services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: finemark-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PG_DATABASE:-finemark_backend}
      POSTGRES_USER:     ${PG_USER:-finemark}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./finemark-backend/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-finemark} -d ${PG_DATABASE:-finemark_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finemark-net
      - finemark-xenv-net

  # ── Express / Node.js backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./finemark-backend
      dockerfile: Dockerfile
    container_name: finemark-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./finemark-backend/.env
    environment:
      # Override DB connection to point at the db container
      PG_HOST:     db
      PG_PORT:     5432
      PORT:        3000
      NODE_ENV:    production
      # Backup: prod DB is local (same network)
      DB_PROD_HOST: db
      DB_PROD_PORT: 5432
      # Backup: dev DB (cross-network, use container name)
      DB_DEV_HOST: finemark-db
      DB_DEV_PORT: 5432
    volumes:
      # Persist uploaded files and PDF templates across restarts
      - backend_uploads:/app/uploads
      - backend_public:/app/public
      # Legacy IDTS certificate archive — read-only bind mount, not copied (13GB;
      # same host path is the single source of truth, no duplication).
      - /home/admin_finemark/IDTS/app/installation.finemarktracking.co.ke/admin/generated_certificates:/app/archive-certificates:ro

    networks:
      - finemark-net
      - finemark-xenv-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/partner-portal/auth/ping 2>/dev/null | grep -q '' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Customer Portal (separate container, OTP-only auth) ─────────────────────
  portal:
    build:
      context: ./finemark-portal
      dockerfile: Dockerfile
    container_name: finemark-prod-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:            3001
      NODE_ENV:        production
      PG_HOST:         db
      PG_PORT:         5432
      PG_DATABASE:     ${PG_DATABASE:-finemark_backend}
      PG_USER:         ${PG_USER:-finemark}
      PG_PASSWORD:     ${PG_PASSWORD}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET}
      GRAPH_TENANT_ID:    ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID:    ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_OTP_MAILBOX:  ${GRAPH_OTP_MAILBOX:-customer@finemarktracking.co.ke}
      GRAPH_CUSTOMER_MAILBOX: ${GRAPH_CUSTOMER_MAILBOX:-customer@finemarktracking.co.ke}
    networks:
      - finemark-net
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health 2>/dev/null | grep -q 'finemark-portal' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx static frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./finemark-ui
      dockerfile: Dockerfile
    container_name: finemark-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - portal
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
    networks:
      - finemark-net

volumes:
  postgres_data:
    external: true
    name: finemark-prod_finemark_prod_postgres_data
  backend_uploads:
    external: true
    name: finemark-prod_finemark_prod_backend_uploads
  backend_public:
    external: true
    name: finemark-prod_finemark_prod_backend_public

networks:
  finemark-net:
    driver: bridge
  finemark-xenv-net:
    external: true
    name: finemark-xenv-net
