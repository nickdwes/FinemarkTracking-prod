server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS resolver (defers upstream resolution to request time)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;
    set $portal_upstream  http://portal:3001;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Server-level 401 handler: redirect to login ──────────────────────────
    # Used by auth_request failures in protected locations below.
    error_page 401 = @auth_redirect;

    # ── Customer Portal — proxy to portal container ──────────────────────────
    # ^~ prevents regex locations from running for /customer-portal/* paths.
    location ^~ /customer-portal/ {
        proxy_pass         $portal_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Backend API proxy ────────────────────────────────────────────────────
    # ^~ prevents regex locations from matching /api/* paths.
    location ^~ /api/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Public assets proxy (logo, etc.) ────────────────────────────────────
    location ^~ /public/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Uploads proxy ────────────────────────────────────────────────────────
    location ^~ /uploads/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Internal auth subrequest endpoint ───────────────────────────────────
    # Reachable ONLY from nginx itself (internal directive).
    # Validates the fm_rt HttpOnly cookie against the backend refresh_tokens table.
    location = /internal/verify-page {
        internal;
        proxy_pass         $backend_upstream/api/auth/verify-page;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length  "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Original-URI  $request_uri;
        proxy_set_header   X-Real-IP       $remote_addr;
    }

    # ── Auth redirect named location ─────────────────────────────────────────
    location @auth_redirect {
        return 302 /login.html?reason=session_expired;
    }

    # ── Root — serve index without auth (it just redirects to login) ─────────
    location = / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # ── Public HTML pages — no authentication required ───────────────────────
    # Staff auth flow pages only. Keep this list minimal.
    # NOTE: regex locations are matched in file order; this must come before
    # the protected ~* \.html$ location below.
    location ~ ^/(login|forgot-password|reset-password|reset-sent|reset-success|unauthorized|index)(\.html)?/?$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # ── Partner portal HTML pages — managed by portal's own session ──────────
    # These pages call /api/partner-portal/* endpoints which validate partner
    # tokens independently. Excluding them from the staff auth gate here.
    location ~* ^/partner-portal-[^/]+(\.html)?/?$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    # ── Static assets — always public (required by login page) ───────────────
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.pdf$ {
        add_header Cache-Control "no-store";
    }

    # ── Protected HTML pages — require a valid session cookie ────────────────
    # auth_request calls /internal/verify-page which validates the fm_rt cookie.
    # 401 from the subrequest triggers the server-level error_page 401 redirect.
    location ~* \.html$ {
        auth_request /internal/verify-page;
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── All other requests (extensionless, directories) — require auth ────────
    # Catches /admin, /dashboard, etc. that map to .html files via try_files.
    location / {
        auth_request /internal/verify-page;
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Disable access to hidden files ───────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
