<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Apply for Leave</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
    <style>
      .cal-day { min-width:0; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:0.8125rem; cursor:pointer; transition:background 0.1s,color 0.1s; user-select:none; }
      .cal-day.weekend { color:#cbd5e1; cursor:not-allowed; pointer-events:none; }
      .cal-day.other-month { color:#e2e8f0; pointer-events:none; }
      .cal-day.in-segment { background:#ccfbf1; color:#0d9488; font-weight:600; }
      .cal-day.in-preview { background:#f0fdf4; color:#15803d; }
      .cal-day.range-start { background:#0d9488; color:#fff; font-weight:700; border-radius:8px; }
      .cal-day.is-today { box-shadow:inset 0 0 0 1.5px #5eead4; }
      .cal-day:not(.weekend):not(.other-month):not(.in-segment):not(.in-preview):not(.range-start):hover { background:#f1f5f9; }
      .seg-chip { animation:fadeIn 0.15s ease; }
      @keyframes fadeIn { from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);} }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-5xl mx-auto space-y-6">

          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <nav class="text-xs text-slate-400 mb-1">
                <a href="hr-dashboard.html" class="hover:text-teal-600">HR</a> / Leave / My Leave
              </nav>
              <h1 class="text-2xl font-semibold text-slate-900">My Leave</h1>
            </div>
            <button onclick="openApplyModal()" class="px-4 py-2 bg-teal-600 text-white text-sm rounded-xl hover:bg-teal-700">+ Apply for Leave</button>
          </div>

          <!-- Balance cards -->
          <div id="balance-cards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

          <!-- My applications -->
          <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
              <h3 class="text-sm font-semibold text-slate-700">My Applications</h3>
              <select id="filter-status" onchange="loadApplications()" class="border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none">
                <option value="">All statuses</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-slate-100">
                  <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Leave Type</th>
                  <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Dates</th>
                  <th class="text-center px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Days</th>
                  <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Applied</th>
                  <th class="text-center px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Status</th>
                  <th class="px-5 py-3"></th>
                </tr>
              </thead>
              <tbody id="apps-tbody" class="divide-y divide-slate-50"></tbody>
            </table>
            <p id="apps-empty" class="hidden py-10 text-center text-sm text-slate-400">No leave applications yet.</p>
          </div>

        </div>
      </main>
    </div>
    <div id="fm-footer"></div>

    <!-- ─── APPLY MODAL ────────────────────────────────────────────── -->
    <div id="apply-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm p-3">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">

        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 shrink-0">
          <h3 class="text-base font-semibold text-slate-800">Apply for Leave</h3>
          <button onclick="closeApplyModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>

        <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">

          <!-- Leave type -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Leave Type <span class="text-rose-500">*</span></label>
            <select id="a-type" onchange="onLeaveTypeChange()" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none bg-white">
              <option value="">Select…</option>
            </select>
            <!-- Balance panel -->
            <div id="a-balance-panel" class="hidden mt-2 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 space-y-2">
              <div class="flex items-center justify-between">
                <div class="flex items-baseline gap-1.5">
                  <span id="a-bal-remaining" class="text-2xl font-bold text-teal-600"></span>
                  <span id="a-bal-total" class="text-xs text-slate-400"></span>
                </div>
                <div class="text-right">
                  <p id="a-bal-used" class="text-xs text-slate-500"></p>
                  <p id="a-bal-pending" class="text-xs text-amber-500 font-medium"></p>
                </div>
              </div>
              <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                <div id="a-bal-bar" class="h-full rounded-full transition-all duration-300"></div>
              </div>
              <p id="a-bal-warn" class="hidden text-xs text-rose-500 font-medium">⚠ Low balance — check with HR before applying</p>
            </div>
          </div>

          <!-- Calendar -->
          <div class="border border-slate-200 rounded-xl p-4 bg-white">
            <div class="flex items-center justify-between mb-4">
              <p id="cal-instruction" class="text-xs text-slate-500 italic max-w-[55%]">Click a date to start selecting a leave period</p>
              <div class="flex items-center gap-1">
                <button onclick="calNav(-1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 font-bold">‹</button>
                <span id="cal-month-label" class="text-sm font-semibold text-slate-700 w-36 text-center"></span>
                <button onclick="calNav(1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 font-bold">›</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1 mb-1">
              <div class="text-center text-xs font-semibold text-slate-400 py-1">Mo</div>
              <div class="text-center text-xs font-semibold text-slate-400 py-1">Tu</div>
              <div class="text-center text-xs font-semibold text-slate-400 py-1">We</div>
              <div class="text-center text-xs font-semibold text-slate-400 py-1">Th</div>
              <div class="text-center text-xs font-semibold text-slate-400 py-1">Fr</div>
              <div class="text-center text-xs font-semibold text-teal-300 py-1">Sa</div>
              <div class="text-center text-xs font-semibold text-teal-300 py-1">Su</div>
            </div>
            <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
            <div id="cal-selecting-banner" class="hidden mt-3 text-xs text-teal-700 bg-teal-50 border border-teal-100 rounded-lg px-3 py-2 flex items-center gap-2">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
              <span id="cal-selecting-text"></span>
            </div>
          </div>

          <!-- Segments list -->
          <div id="segments-section" class="hidden space-y-2">
            <div class="flex items-center justify-between">
              <p class="text-xs font-semibold text-slate-600 uppercase tracking-wide">Selected Periods</p>
              <span id="total-days-badge" class="text-xs bg-teal-50 text-teal-700 border border-teal-200 rounded-full px-3 py-0.5 font-semibold"></span>
            </div>
            <div id="segments-list" class="space-y-2"></div>
          </div>

          <!-- Reason -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Reason <span class="text-slate-400 font-normal">(optional)</span></label>
            <textarea id="a-reason" rows="2" maxlength="1000" placeholder="Briefly describe the reason for leave…" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm resize-none focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
          </div>

          <div id="apply-error" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-xl px-4 py-3"></div>
        </div>

        <div class="px-6 py-4 border-t border-slate-100 shrink-0 flex justify-end gap-3">
          <button onclick="closeApplyModal()" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50">Cancel</button>
          <button id="apply-submit" onclick="submitApplication()" disabled
            class="px-5 py-2 text-sm rounded-xl bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
            Submit Application
          </button>
        </div>
      </div>
    </div>

    <!-- ─── DETAIL MODAL ──────────────────────────────────────────────── -->
    <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 class="text-base font-semibold text-slate-800">Application Details</h3>
          <button onclick="document.getElementById('detail-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <div id="detail-body" class="px-6 py-5 space-y-3 text-sm max-h-[65vh] overflow-y-auto"></div>
        <div class="px-6 pb-5 flex justify-end gap-3">
          <button id="cancel-btn" onclick="cancelApp()" class="hidden px-4 py-2 text-sm rounded-lg bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100">Cancel Leave</button>
          <button onclick="document.getElementById('detail-modal').classList.add('hidden')" class="px-4 py-2 text-sm rounded-lg border border-slate-200 text-slate-600">Close</button>
        </div>
      </div>
    </div>

    <script src="assets/app.js?v=202607011016"></script>
    <script src="assets/layout.js?v=202607011016"></script>
    <script>
    // ─── State ──────────────────────────────────────────────────────────
    let balances = [], leaveTypes = [], myEmployee = null;
    let segments  = [];       // { startDate, endDate, halfDay, days }
    let calYear, calMonth;
    let rangeStart = null;
    let hoverDate  = null;
    let calMode    = 'idle';  // 'idle' | 'selecting'

    const MONTHS_LONG  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const STATUS_COLOR = {
      Pending:   'bg-amber-50 text-amber-700 border-amber-200',
      Approved:  'bg-emerald-50 text-emerald-700 border-emerald-200',
      Rejected:  'bg-rose-50 text-rose-700 border-rose-200',
      Cancelled: 'bg-slate-100 text-slate-500 border-slate-200',
    };

    // ─── Helpers ──────────────────────────────────────────────────────────
    const pad   = n => String(n).padStart(2, '0');
    const toISO = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

    function countWorkingDays(s, e) {
      let count = 0;
      const cur  = new Date(s + 'T00:00:00');
      const last = new Date(e + 'T00:00:00');
      while (cur <= last) { const d = cur.getDay(); if (d !== 0 && d !== 6) count++; cur.setDate(cur.getDate() + 1); }
      return count;
    }
    function fmtDate(d) { const [y, m, day] = d.split('-'); return `${MONTHS_SHORT[parseInt(m)-1]} ${parseInt(day)}, ${y}`; }
    function fmtRange(s, e) { return s === e ? fmtDate(s) : `${fmtDate(s)} — ${fmtDate(e)}`; }

    // ─── Calendar ──────────────────────────────────────────────────────────
    function calNav(dir) {
      calMonth += dir;
      if (calMonth < 0)  { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0;  calYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('cal-month-label').textContent = `${MONTHS_LONG[calMonth]} ${calYear}`;
      const todayStr = new Date().toISOString().slice(0, 10);
      let startDow = new Date(calYear, calMonth, 1).getDay() - 1;
      if (startDow < 0) startDow = 6;
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

      let previewLo = null, previewHi = null;
      if (calMode === 'selecting' && rangeStart && hoverDate) {
        previewLo = rangeStart < hoverDate ? rangeStart : hoverDate;
        previewHi = rangeStart < hoverDate ? hoverDate  : rangeStart;
      }

      let cells = '';
      for (let i = 0; i < startDow; i++) cells += `<div class="cal-day other-month"></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const ds  = toISO(calYear, calMonth, day);
        const dow = new Date(calYear, calMonth, day).getDay();
        const isWeekend = dow === 6 || dow === 0;
        const isToday   = ds === todayStr;
        const inSeg     = segments.some(sg => ds >= sg.startDate && ds <= sg.endDate);
        const isStart   = calMode === 'selecting' && ds === rangeStart;
        const inPreview = !inSeg && !isStart && previewLo && ds >= previewLo && ds <= previewHi;
        let cls = 'cal-day';
        if (isWeekend)       cls += ' weekend';
        else if (inSeg)      cls += ' in-segment';
        else if (inPreview)  cls += ' in-preview';
        else if (isStart)    cls += ' range-start';
        if (!isWeekend && isToday && !inSeg && !isStart && !inPreview) cls += ' is-today';
        // Use data-date for event delegation — no inline handlers (avoids infinite re-render on mouseenter)
        const attr = isWeekend ? '' : `data-date="${ds}"`;
        cells += `<div class="${cls}" ${attr}>${day}</div>`;
      }
      document.getElementById('cal-grid').innerHTML = cells;
    }

    // Event delegation — attached once, survives innerHTML rebuilds
    function initCalendarEvents() {
      const grid = document.getElementById('cal-grid');

      grid.addEventListener('mouseover', e => {
        if (calMode !== 'selecting') return;
        const cell = e.target.closest('[data-date]');
        const ds   = cell?.dataset.date;
        if (!ds || ds === hoverDate) return;   // no change, skip re-render
        hoverDate = ds;
        renderCalendar();
      });

      grid.addEventListener('mouseleave', () => {
        if (calMode !== 'selecting' || hoverDate === null) return;
        hoverDate = null;
        renderCalendar();
      });

      grid.addEventListener('click', e => {
        const cell = e.target.closest('[data-date]');
        const ds   = cell?.dataset.date;
        if (!ds) return;
        if (calMode === 'idle') {
          rangeStart = ds;
          calMode    = 'selecting';
          document.getElementById('cal-instruction').textContent = 'Now click an end date — or click the same date for a single day';
          document.getElementById('cal-selecting-text').textContent = `From: ${fmtDate(ds)}`;
          document.getElementById('cal-selecting-banner').classList.remove('hidden');
          renderCalendar();
        } else {
          if (ds < rangeStart) {
            rangeStart = ds;
            document.getElementById('cal-selecting-text').textContent = `From: ${fmtDate(ds)}`;
            renderCalendar();
            return;
          }
          const ok = addSegment(rangeStart, ds);
          if (ok) {
            rangeStart = null; hoverDate = null; calMode = 'idle';
            document.getElementById('cal-instruction').textContent = 'Click a date to add another leave period';
            document.getElementById('cal-selecting-banner').classList.add('hidden');
            renderCalendar();
          }
        }
      });
    }

    // ─── Segments ──────────────────────────────────────────────────────────
    function addSegment(startDate, endDate) {
      for (const sg of segments) {
        if (startDate <= sg.endDate && endDate >= sg.startDate) {
          showApplyError(`This range overlaps an already selected period (${fmtDate(sg.startDate)} — ${fmtDate(sg.endDate)}).`);
          return false;
        }
      }
      const days = countWorkingDays(startDate, endDate);
      if (days === 0) { showApplyError('The selected range contains no working days (weekends only).'); return false; }
      hideApplyError();
      segments.push({ startDate, endDate, halfDay: null, days });
      segments.sort((a, b) => a.startDate.localeCompare(b.startDate));
      renderSegments();
      return true;
    }

    function removeSegment(idx) { segments.splice(idx, 1); renderSegments(); renderCalendar(); if (!segments.length) document.getElementById('cal-instruction').textContent = 'Click a date to start selecting a leave period'; }

    function setHalfDay(idx, val) {
      segments[idx].halfDay = val || null;
      segments[idx].days = (val && segments[idx].startDate === segments[idx].endDate) ? 0.5 : countWorkingDays(segments[idx].startDate, segments[idx].endDate);
      renderSegments();
    }

    function renderSegments() {
      const section = document.getElementById('segments-section');
      const list    = document.getElementById('segments-list');
      const btn     = document.getElementById('apply-submit');
      if (!segments.length) { section.classList.add('hidden'); btn.disabled = true; return; }
      section.classList.remove('hidden');
      btn.disabled = !document.getElementById('a-type').value;
      const total = segments.reduce((s, sg) => s + sg.days, 0);
      document.getElementById('total-days-badge').textContent = `Total: ${total % 1 === 0 ? total : total.toFixed(1)} day${total !== 1 ? 's' : ''}`;
      list.innerHTML = segments.map((sg, i) => {
        const isSingle = sg.startDate === sg.endDate;
        return `<div class="seg-chip flex items-start gap-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-slate-800">${fmtRange(sg.startDate, sg.endDate)}</p>
            <p class="text-xs text-slate-500 mt-0.5">${sg.days % 1 === 0 ? sg.days : sg.days.toFixed(1)} working day${sg.days !== 1 ? 's' : ''}${sg.halfDay ? ` · <span class="text-teal-600 font-medium">${sg.halfDay.charAt(0).toUpperCase() + sg.halfDay.slice(1)} half-day</span>` : ''}</p>
            ${isSingle ? `<div class="mt-2.5 flex flex-wrap gap-3">
              <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="radio" name="hd-${i}" value="" ${!sg.halfDay ? 'checked' : ''} onchange="setHalfDay(${i},'')"><span class="text-slate-600">Full day</span></label>
              <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="radio" name="hd-${i}" value="morning" ${sg.halfDay === 'morning' ? 'checked' : ''} onchange="setHalfDay(${i},'morning')"><span class="text-slate-600">½ Morning</span></label>
              <label class="flex items-center gap-1.5 text-xs cursor-pointer"><input type="radio" name="hd-${i}" value="afternoon" ${sg.halfDay === 'afternoon' ? 'checked' : ''} onchange="setHalfDay(${i},'afternoon')"><span class="text-slate-600">½ Afternoon</span></label>
            </div>` : ''}
          </div>
          <button onclick="removeSegment(${i})" class="text-slate-300 hover:text-rose-400 text-xl leading-none shrink-0 mt-0.5 transition-colors" title="Remove">×</button>
        </div>`;
      }).join('');
    }

    // ─── Error helpers ────────────────────────────────────────────────────
    function showApplyError(msg)  { const e = document.getElementById('apply-error'); e.textContent = msg; e.classList.remove('hidden'); }
    function hideApplyError()     { document.getElementById('apply-error').classList.add('hidden'); }

    // ─── Modal ────────────────────────────────────────────────────────────
    function openApplyModal() {
      const sel = document.getElementById('a-type');
      sel.innerHTML = '<option value="">Select…</option>' + leaveTypes.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      document.getElementById('a-reason').value = '';
      hideApplyError();
      segments = []; rangeStart = null; hoverDate = null; calMode = 'idle';
      const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
      document.getElementById('apply-submit').disabled = true;
      document.getElementById('segments-section').classList.add('hidden');
      document.getElementById('cal-selecting-banner').classList.add('hidden');
      document.getElementById('cal-instruction').textContent = 'Click a date to start selecting a leave period';
      document.getElementById('a-balance-panel').classList.add('hidden');
      renderCalendar();
      document.getElementById('apply-modal').classList.remove('hidden');
    }
    function closeApplyModal() { document.getElementById('apply-modal').classList.add('hidden'); }

    function onLeaveTypeChange() {
      const typeId = document.getElementById('a-type').value;
      const bal    = balances.find(b => b.leave_type_id === typeId);
      const panel  = document.getElementById('a-balance-panel');
      if (bal) {
        const rem     = parseFloat(bal.remaining_days)  || 0;
        const used    = parseFloat(bal.used_days)        || 0;
        const pending = parseFloat(bal.pending_days)     || 0;
        const entitled= parseFloat(bal.entitled_days)    || 0;
        const carried = parseFloat(bal.carried_forward)  || 0;
        const total   = entitled + carried;
        const pct     = total > 0 ? Math.min(100, Math.round((used / total) * 100)) : 0;
        const low     = rem < 2;
        const fmtD = d => d % 1 === 0 ? d : d.toFixed(1);
        document.getElementById('a-bal-remaining').textContent = fmtD(rem);
        document.getElementById('a-bal-remaining').className   = `text-2xl font-bold ${low ? 'text-rose-500' : 'text-teal-600'}`;
        document.getElementById('a-bal-total').textContent     = `/ ${fmtD(total)} days remaining`;
        document.getElementById('a-bal-used').textContent      = `${fmtD(used)} used`;
        document.getElementById('a-bal-pending').textContent   = pending > 0 ? `${fmtD(pending)} pending approval` : '';
        document.getElementById('a-bal-pending').classList.toggle('hidden', pending === 0);
        const bar = document.getElementById('a-bal-bar');
        bar.style.width = pct + '%';
        bar.className   = `h-full rounded-full transition-all duration-300 ${pct > 80 ? 'bg-rose-400' : pct > 50 ? 'bg-amber-400' : 'bg-teal-400'}`;
        document.getElementById('a-bal-warn').classList.toggle('hidden', !low);
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
      document.getElementById('apply-submit').disabled = !typeId || !segments.length;
    }

    // ─── Submit ───────────────────────────────────────────────────────────
    async function submitApplication() {
      hideApplyError();
      const typeId = document.getElementById('a-type').value;
      if (!typeId) { showApplyError('Please select a leave type.'); return; }
      if (!segments.length) { showApplyError('Please select at least one leave period on the calendar.'); return; }
      const btn = document.getElementById('apply-submit');
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        await window.FINEMARK_APP.apiFetch('/hr/leave/applications', {
          method: 'POST',
          body: {
            leaveTypeId: typeId,
            segments: segments.map(sg => ({ startDate: sg.startDate, endDate: sg.endDate, ...(sg.halfDay ? { halfDay: sg.halfDay } : {}) })),
            reason: document.getElementById('a-reason').value.trim() || undefined,
          },
        });
        closeApplyModal();
        await loadData();
      } catch (err) {
        showApplyError(err?.message || 'Failed to submit application.');
        btn.disabled = false; btn.textContent = 'Submit Application';
      }
    }

    // ─── Data loaders ─────────────────────────────────────────────────────
    const loadData = async () => {
      const typesRes = await window.FINEMARK_APP.apiFetch('/hr/leave/types');
      leaveTypes = (typesRes?.data || []).filter(t => t.is_active);
      const user = window.FINEMARK_APP.getSession()?.user;
      if (user) {
        const res = await window.FINEMARK_APP.apiFetch('/hr/employees?limit=200');
        const all = res?.data?.employees || res?.data || [];
        myEmployee = all.find(e => e.email === user.email) || null;
      }
      if (myEmployee) {
        const balRes = await window.FINEMARK_APP.apiFetch(`/hr/leave/balances/${myEmployee.id}?year=${new Date().getFullYear()}`);
        balances = balRes?.data || [];
        renderBalances();
      }
      await loadApplications();
    };

    const renderBalances = () => {
      const el = document.getElementById('balance-cards');
      if (!balances.length) { el.innerHTML = ''; return; }
      el.innerHTML = balances.map(b => {
        const rem   = parseFloat(b.remaining_days) || 0;
        const used  = parseFloat(b.used_days) || 0;
        const total = parseFloat(b.entitled_days) + parseFloat(b.carried_forward || 0);
        const pct   = total > 0 ? Math.round((used / total) * 100) : 0;
        return `<div class="bg-white border border-slate-200/80 rounded-xl p-4 shadow-sm">
          <p class="text-xs text-slate-400 mb-1 truncate">${b.leave_type_name}</p>
          <div class="flex items-end gap-2 mb-2">
            <span class="text-2xl font-bold ${rem < 3 ? 'text-rose-600' : 'text-teal-600'}">${rem % 1 === 0 ? rem : rem.toFixed(1)}</span>
            <span class="text-xs text-slate-400 mb-0.5">/ ${total} days left</span>
          </div>
          <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full ${pct > 80 ? 'bg-rose-400' : pct > 50 ? 'bg-amber-400' : 'bg-teal-400'} rounded-full" style="width:${pct}%"></div>
          </div>
          <p class="text-xs text-slate-400 mt-1">${used} used · ${b.pending_days || 0} pending</p>
        </div>`;
      }).join('');
    };

    const loadApplications = async () => {
      const status = document.getElementById('filter-status').value;
      const q = new URLSearchParams({ limit: '50' });
      if (status) q.set('status', status);
      const { data } = await window.FINEMARK_APP.apiFetch(`/hr/leave/applications?${q}`);
      const apps  = data?.applications || data || [];
      const tbody = document.getElementById('apps-tbody');
      const empty = document.getElementById('apps-empty');
      if (!apps.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      tbody.innerHTML = apps.map(a => {
        let dateCell;
        try {
          const segs = a.segments ? JSON.parse(a.segments) : null;
          dateCell = (segs && segs.length > 1) ? `${segs.length} periods` : `${a.start_date} → ${a.end_date}`;
        } catch { dateCell = `${a.start_date} → ${a.end_date}`; }
        return `<tr class="hover:bg-slate-50 cursor-pointer" onclick="showDetail('${a.id}')">
          <td class="px-5 py-3 font-medium text-slate-800">${a.leave_type_name}</td>
          <td class="px-5 py-3 text-slate-600">${dateCell}</td>
          <td class="px-5 py-3 text-center font-medium">${a.total_days}</td>
          <td class="px-5 py-3 text-slate-500">${a.applied_date}</td>
          <td class="px-5 py-3 text-center"><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${STATUS_COLOR[a.status] || ''}">${a.status}</span></td>
          <td class="px-5 py-3 text-right">${a.status === 'Pending' ? `<button onclick="event.stopPropagation();openCancel('${a.id}')" class="text-xs text-rose-500 hover:underline">Cancel</button>` : ''}</td>
        </tr>`;
      }).join('');
    };

    // ─── Detail ───────────────────────────────────────────────────────────
    const showDetail = async id => {
      const data = await window.FINEMARK_APP.apiFetch(`/hr/leave/applications/${id}`);
      if (!data) return;
      cancelAppId = id;
      document.getElementById('cancel-btn').classList.toggle('hidden', data.status !== 'Pending');
      let dateSection;
      if (data.segments && data.segments.length > 1) {
        dateSection = `<div class="col-span-2"><p class="text-xs text-slate-400">Periods (${data.segments.length})</p><div class="mt-1 space-y-1">${data.segments.map(sg =>
          `<div class="text-sm">${fmtRange(sg.startDate, sg.endDate)}<span class="text-slate-400 ml-1">(${sg.days % 1 === 0 ? sg.days : sg.days.toFixed(1)} day${sg.days !== 1 ? 's' : ''}${sg.halfDay ? ' · ' + sg.halfDay : ''})</span></div>`).join('')}</div></div>`;
      } else {
        const sg = data.segments?.[0];
        dateSection = `<div><p class="text-xs text-slate-400">Duration</p><p>${data.start_date} → ${data.end_date}${sg?.halfDay ? ' · ' + sg.halfDay + ' half-day' : ''}</p></div>`;
      }
      document.getElementById('detail-body').innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div><p class="text-xs text-slate-400">Leave Type</p><p class="font-medium">${data.leave_type_name}</p></div>
          <div><p class="text-xs text-slate-400">Status</p><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${STATUS_COLOR[data.status] || ''}">${data.status}</span></div>
          ${dateSection}
          <div><p class="text-xs text-slate-400">Total Days</p><p class="font-medium">${data.total_days} working days</p></div>
          <div><p class="text-xs text-slate-400">Applied</p><p>${data.applied_date}</p></div>
          <div><p class="text-xs text-slate-400">Manager</p><p>${data.manager_name || '—'}</p></div>
        </div>
        ${data.reason ? `<div><p class="text-xs text-slate-400">Reason</p><p class="text-slate-700">${data.reason}</p></div>` : ''}
        ${data.rejection_reason ? `<div class="bg-rose-50 rounded-lg px-3 py-2"><p class="text-xs font-medium text-rose-700">Rejection Reason</p><p class="text-sm text-rose-600">${data.rejection_reason}</p></div>` : ''}
        ${data.approvalLog?.length ? `<div><p class="text-xs text-slate-400 mb-2">Approval Log</p>
          ${data.approvalLog.map(l => `<div class="flex items-start gap-2 text-xs"><span class="text-slate-500">${l.created_at?.slice(0,16)}</span><span class="font-medium ${l.action.includes('Approved') ? 'text-emerald-600' : l.action.includes('Rejected') ? 'text-rose-600' : 'text-teal-600'}">${l.action}</span><span class="text-slate-400">by ${l.actor_name || l.by_user_id}</span>${l.notes ? `<span class="text-slate-400">· ${l.notes}</span>` : ''}</div>`).join('')}
        </div>` : ''}`;
      document.getElementById('detail-modal').classList.remove('hidden');
    };

    // ─── Cancel ───────────────────────────────────────────────────────────
    let cancelAppId = null;
    const openCancel = id => { cancelAppId = id; showDetail(id); };
    const cancelApp  = async () => {
      if (!cancelAppId || !confirm('Cancel this leave application?')) return;
      try {
        await window.FINEMARK_APP.apiFetch(`/hr/leave/applications/${cancelAppId}/cancel`, { method: 'PATCH', body: {} });
        document.getElementById('detail-modal').classList.add('hidden');
        await loadData();
      } catch (err) { alert(err?.message || 'Cancel failed'); }
    };

    // ─── Boot ─────────────────────────────────────────────────────────────
    (async () => {
      await window.FINEMARK_APP.requirePageAccess();
      initCalendarEvents();   // attach once; survives cal-grid innerHTML rebuilds
      await loadData();
    })();
    </script>
  </body>
</html>
