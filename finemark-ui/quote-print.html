<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotation | Finemark</title>
  <style>
    /* ── Base ─────────────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; background: #f0f0f0; color: #1a1a1a; }

    /* ── Screen controls bar ──────────────────────────────────────────── */
    .controls-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #2f3c93; color: white;
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .controls-bar h2 { font-size: 15px; font-weight: 700; flex: 1; }
    .btn-print {
      background: white; color: #2f3c93; border: none; border-radius: 6px;
      padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .btn-print:hover { background: #e0e7ff; }
    .btn-close {
      background: transparent; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    .btn-close:hover { background: rgba(255,255,255,0.12); }

    /* ── Document wrapper (screen) ─────────────────────────────────────── */
    .page-wrapper { padding: 70px 20px 30px; min-height: 100vh; }
    .document {
      background: white; width: 210mm; margin: 0 auto;
      padding: 15mm 14mm 12mm;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }

    /* ── Brand accent bar ─────────────────────────────────────────────── */
    .brand-bar {
      height: 5px; border-radius: 2px; margin-bottom: 18px;
      background: linear-gradient(90deg, #2f3c93 0%, #2fa9df 100%);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .company-block { display: flex; gap: 10px; align-items: flex-start; }
    .company-name { font-size: 17px; font-weight: 800; color: #2f3c93; letter-spacing: -0.3px; line-height: 1.1; }
    .company-sub { font-size: 9px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .company-contact { font-size: 9.5px; color: #555; line-height: 1.7; }

    .doc-meta-block { text-align: right; }
    .doc-title {
      font-size: 26px; font-weight: 900; color: #2f3c93;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
    }
    .meta-table { border-collapse: collapse; margin-left: auto; }
    .meta-table td { padding: 2px 5px; font-size: 10.5px; }
    .meta-table td:first-child { color: #64748b; text-align: right; white-space: nowrap; }
    .meta-table td:last-child { font-weight: 700; color: #1a1a1a; min-width: 120px; }

    /* ── Divider ──────────────────────────────────────────────────────── */
    .divider { border: none; border-top: 1.5px solid #2f3c93; margin: 14px 0 10px; }

    /* ── Customer section ─────────────────────────────────────────────── */
    .customer-section {
      display: flex; justify-content: space-between; gap: 24px;
      margin-bottom: 14px;
    }
    .customer-block { flex: 1; }
    .customer-label { font-size: 9px; font-weight: 700; color: #2f3c93; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .customer-name { font-size: 13px; font-weight: 700; color: #1a1a1a; }
    .customer-detail { font-size: 10px; color: #555; line-height: 1.6; }

    .status-block { text-align: right; min-width: 130px; }
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700; background: #eff6ff; color: #1d4ed8;
      border: 1px solid #bfdbfe; letter-spacing: 0.3px;
    }
    .status-badge.accepted { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .status-badge.rejected { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .status-badge.expired  { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .status-badge.draft    { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

    /* ── Info bar ─────────────────────────────────────────────────────── */
    .info-bar {
      background: #f8fafc; border-radius: 5px; padding: 5px 10px;
      display: flex; gap: 24px; font-size: 10px; color: #475569;
      margin-bottom: 12px; border: 1px solid #e2e8f0;
    }
    .info-bar span strong { color: #2f3c93; }

    /* ── Items table ──────────────────────────────────────────────────── */
    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
    .items-table thead tr { background: #2f3c93; color: white; }
    .items-table th {
      padding: 7px 8px; font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4px; border: none;
    }
    .items-table td { padding: 6px 8px; font-size: 10.5px; border-bottom: 1px solid #e8ecf0; vertical-align: top; }
    .items-table tbody tr:nth-child(even) td { background: #fafafa; }
    .items-table tbody tr:last-child td { border-bottom: 2px solid #2f3c93; }
    .items-table .num { text-align: right; white-space: nowrap; }
    .items-table .center { text-align: center; }
    .col-product { }
    .col-desc { color: #555; font-size: 10px; }
    .col-qty { width: 45px; }
    .col-unit { width: 45px; }
    .col-price { width: 90px; }
    .col-disc { width: 55px; }
    .col-amount { width: 90px; }

    /* ── Totals ───────────────────────────────────────────────────────── */
    .totals-section { display: flex; justify-content: flex-end; margin: 4px 0 14px; }
    .totals-table { border-collapse: collapse; min-width: 260px; }
    .totals-table td { padding: 5px 8px; font-size: 11px; }
    .totals-table td:first-child { color: #475569; font-weight: 600; text-align: right; }
    .totals-table td:last-child { font-weight: 700; text-align: right; color: #1a1a1a; min-width: 110px; }
    .totals-table tr.grand-total td { font-size: 13px; color: #2f3c93; border-top: 2px solid #2f3c93; padding-top: 7px; }
    .totals-table tr.subtotal-row td { border-top: 1px solid #e2e8f0; padding-top: 7px; }

    /* ── Terms / Notes ────────────────────────────────────────────────── */
    .terms-section { margin-bottom: 12px; }
    .section-label { font-size: 9px; font-weight: 700; color: #2f3c93; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .terms-text { font-size: 10px; color: #475569; line-height: 1.6; white-space: pre-line; }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      margin-top: 14px; border-top: 1px solid #e2e8f0; padding-top: 8px;
      text-align: center; font-size: 9px; color: #94a3b8; letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* ── States ───────────────────────────────────────────────────────── */
    .state-msg { padding: 40px; text-align: center; color: #64748b; font-size: 14px; }

    /* ── Print ────────────────────────────────────────────────────────── */
    @media print {
      body { background: white; }
      .controls-bar { display: none !important; }
      .page-wrapper { padding: 0; }
      .document { width: 100%; margin: 0; padding: 10mm 10mm 8mm; box-shadow: none; }
    }
    @page { size: A4 portrait; margin: 8mm 10mm; }
  </style>
</head>
<body>

<!-- Controls bar (hidden when printing) -->
<div class="controls-bar">
  <h2 id="ctrl-title">Quotation</h2>
  <button class="btn-print" onclick="window.print()">&#128438; Print / Save as PDF</button>
  <button class="btn-close" onclick="window.close ? window.close() : history.back()">&#x2715; Close</button>
</div>

<div class="page-wrapper">
  <div class="document" id="doc-root">
    <div class="state-msg" id="state-msg">Loading quotation&hellip;</div>
  </div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const msgEl = document.getElementById("state-msg");
  const root = document.getElementById("doc-root");

  if (!id) { msgEl.textContent = "No quote ID provided."; return; }

  const session = JSON.parse(localStorage.getItem("finemark_session") || "{}");
  const token = session?.accessToken;
  if (!token) {
    msgEl.innerHTML = 'Not authenticated. Please <a href="login.html">log in</a>.';
    return;
  }

  let quote;
  try {
    const r = await fetch(`/api/quotes/${encodeURIComponent(id)}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!r.ok) throw new Error(`Server returned ${r.status}`);
    quote = await r.json();
    // Handle both direct response and wrapped { data: ... }
    if (quote.data) quote = quote.data;
  } catch (e) {
    msgEl.textContent = "Failed to load quotation: " + e.message;
    return;
  }

  const items = quote.items || [];

  const quoteNo = quote.quoteNumber || quote.quote_number || "Quotation";
  document.title = `Quotation ${quoteNo} | Finemark`;
  document.getElementById("ctrl-title").textContent = `Quotation ${quoteNo}`;

  const fmt = (d) => d ? new Date(d).toLocaleDateString("en-KE", { year:"numeric", month:"short", day:"numeric" }) : "—";
  const kes = (v) => "Ksh " + Number(v || 0).toLocaleString("en-KE", { minimumFractionDigits:2, maximumFractionDigits:2 });

  const status = (quote.status || "Draft");
  const statusClass = { Draft:"draft", Sent:"", Accepted:"accepted", Rejected:"rejected", Expired:"expired" }[status] || "";

  root.innerHTML = `
    <div class="brand-bar"></div>

    <!-- ── Header ── -->
    <div class="header">
      <div class="company-block">
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="48" height="48">
            <path d="M44 60c40-36 128-36 168 0" fill="none" stroke="#2f3c93" stroke-width="12" stroke-linecap="round"/>
            <path d="M56 84c32-28 112-28 144 0" fill="none" stroke="#2fa9df" stroke-width="16" stroke-linecap="round"/>
            <text x="28" y="190" font-family="Arial,sans-serif" font-size="120" font-weight="700" fill="#2f3c93">F</text>
            <text x="118" y="190" font-family="Arial,sans-serif" font-size="120" font-weight="700" fill="#2fa9df">M</text>
            <path fill="#2f3c93" d="M168 104c0-22.1-17.9-40-40-40s-40 17.9-40 40c0 30 40 78 40 78s40-48 40-78z"/>
            <circle fill="#2fa9df" cx="128" cy="104" r="18"/>
          </svg>
        </div>
        <div style="margin-left:10px">
          <div class="company-name">Fine Mark Tracking Limited</div>
          <div class="company-sub">Staff Portal</div>
          <div class="company-contact">
            Nairobi, Kenya<br>
            support@finemarktracking.co.ke<br>
            +254 (0) 795-123-456
          </div>
        </div>
      </div>

      <div class="doc-meta-block">
        <div class="doc-title">QUOTATION</div>
        <table class="meta-table">
          <tr><td>Quotation No:</td><td>${escHtml(quoteNo)}</td></tr>
          <tr><td>Date:</td><td>${fmt(quote.quoteDate || quote.quote_date)}</td></tr>
          <tr><td>Valid Until:</td><td>${fmt(quote.validUntil || quote.valid_until)}</td></tr>
          <tr><td>Prepared by:</td><td>${escHtml(quote.salesRepEmail || quote.sales_rep_email || "—")}</td></tr>
          ${quote.revisionNumber > 1 ? `<tr><td>Revision:</td><td>Rev. ${escHtml(quote.revisionNumber)}</td></tr>` : ""}
        </table>
      </div>
    </div>

    <hr class="divider" />

    <!-- ── Customer + status ── -->
    <div class="customer-section">
      <div class="customer-block">
        <div class="customer-label">Prepared For</div>
        <div class="customer-name">${escHtml(quote.customerName || quote.customer_name || quote.customerId || quote.customer_id || "—")}</div>
        ${quote.customerEmail || quote.customer_email ? `<div class="customer-detail">${escHtml(quote.customerEmail || quote.customer_email)}</div>` : ""}
        ${quote.customerPhone || quote.customer_phone ? `<div class="customer-detail">${escHtml(quote.customerPhone || quote.customer_phone)}</div>` : ""}
      </div>
      <div class="status-block">
        <div class="customer-label">Status</div>
        <span class="status-badge ${statusClass}">${escHtml(status)}</span>
      </div>
    </div>

    <!-- ── Info bar ── -->
    <div class="info-bar">
      <span>Tax Rate: <strong>${Number((quote.taxRate || quote.tax_rate || 0) * 100).toFixed(0)}%</strong></span>
      ${quote.discountAmount > 0 ? `<span>Discount: <strong>${kes(quote.discountAmount || quote.discount_amount)}</strong></span>` : ""}
    </div>

    <!-- ── Line items table ── -->
    <table class="items-table">
      <thead>
        <tr>
          <th class="col-product">Product / Service</th>
          <th class="col-desc">Description</th>
          <th class="col-qty center">Qty</th>
          <th class="col-unit center">Unit</th>
          <th class="col-price num">Unit Price</th>
          <th class="col-disc center">Disc %</th>
          <th class="col-amount num">Line Total</th>
        </tr>
      </thead>
      <tbody>
        ${items.length ? items.map(it => `
          <tr>
            <td class="col-product">${escHtml(it.productName || it.product_name || "—")}</td>
            <td class="col-desc">${escHtml(it.description || "")}</td>
            <td class="col-qty center">${Number(it.quantity || 0).toLocaleString("en-KE")}</td>
            <td class="col-unit center">${escHtml(it.unit || "unit")}</td>
            <td class="col-price num">${kes(it.unitPrice || it.unit_price)}</td>
            <td class="col-disc center">${Number(it.discountPercent || it.discount_percent || 0).toFixed(1)}%</td>
            <td class="col-amount num">${kes(it.lineTotal || it.line_total)}</td>
          </tr>`).join("") : `<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:12px;">No line items</td></tr>`}
      </tbody>
    </table>

    <!-- ── Totals ── -->
    <div class="totals-section">
      <table class="totals-table">
        <tr class="subtotal-row">
          <td>SUB TOTAL :</td>
          <td>${kes(quote.subtotal)}</td>
        </tr>
        ${quote.discountAmount > 0 ? `<tr><td>Discount :</td><td>- ${kes(quote.discountAmount || quote.discount_amount)}</td></tr>` : ""}
        <tr>
          <td>TAX (${Number((quote.taxRate || quote.tax_rate || 0) * 100).toFixed(0)}%) :</td>
          <td>${kes(quote.taxAmount || quote.tax_amount)}</td>
        </tr>
        <tr class="grand-total">
          <td>GRAND TOTAL :</td>
          <td>${kes(quote.totalAmount || quote.total_amount)}</td>
        </tr>
      </table>
    </div>

    ${(quote.termsConditions || quote.terms_conditions) ? `
    <!-- ── Terms & Conditions ── -->
    <div class="terms-section">
      <div class="section-label">Terms &amp; Conditions</div>
      <div class="terms-text">${escHtml(quote.termsConditions || quote.terms_conditions)}</div>
    </div>` : ""}

    ${quote.notes ? `
    <!-- ── Notes ── -->
    <div class="terms-section">
      <div class="section-label">Notes</div>
      <div class="terms-text">${escHtml(quote.notes)}</div>
    </div>` : ""}

    <!-- ── Footer ── -->
    <div class="footer">
      GPS Tracking &bull; Fleet Management &bull; Vehicle Monitoring &bull; Fuel Management &bull; Driver Behaviour
    </div>
  `;

  function escHtml(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
})();
</script>
</body>
</html>
