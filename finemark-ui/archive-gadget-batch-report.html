<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — Gadget Batch Report</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div><h1 class="text-3xl font-semibold tracking-tight text-slate-900">Gadget Batch Report</h1>
              <p class="text-sm text-slate-600">Also covers "Gadgets Requisition Report" — same underlying check in IDTS. Archived, historical reference only.</p></div>
            <div id="badge-slot"></div>
          </div>
          <section class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm space-y-4">
            <div class="grid gap-4 md:grid-cols-3">
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">From Batch</label>
                <select id="from-batch" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="">Select…</option></select></div>
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">To Batch</label>
                <select id="to-batch" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="">Select…</option></select></div>
              <div class="flex items-end"><button id="check" class="w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Check IMEIs</button></div>
            </div>
          </section>
          <div id="results" class="space-y-6"></div>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;
        init();
      });
      const $ = (id) => document.getElementById(id);
      async function loadBatches() {
        try {
          const res = await window.FINEMARK_APP.apiFetch("/archive/gadget-batches");
          const batches = res.data || res;
          [$("from-batch"), $("to-batch")].forEach((sel) => {
            batches.forEach((b) => { const o = document.createElement("option"); o.value = b; o.textContent = b; sel.appendChild(o); });
          });
        } catch (e) { window.FINEMARK_APP?.showToast?.(e.message, "error"); }
      }
      async function check() {
        const fromBatch = $("from-batch").value, toBatch = $("to-batch").value;
        if (!fromBatch || !toBatch) { window.FINEMARK_APP?.showToast?.("Select both From and To batch", "warn"); return; }
        $("results").innerHTML = `<div class="text-center text-slate-400 py-8">Loading…</div>`;
        try {
          const qs = new URLSearchParams({ fromBatch, toBatch }).toString();
          const res = await window.FINEMARK_APP.apiFetch(`/archive/gadget-batch-report?${qs}`);
          const d = res.data || res;
          $("results").innerHTML = `
            <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-4">
              <h2 class="text-sm font-semibold text-slate-700">Batch Range: ${ArchiveCommon.escapeHtml(fromBatch)} to ${ArchiveCommon.escapeHtml(toBatch)} — ${d.totalImeisInRange} total IMEIs</h2>
              <div class="overflow-x-auto"><table class="w-full text-sm min-w-[500px]">
                <thead class="text-left text-slate-500 text-xs uppercase border-b border-slate-200"><tr><th class="py-2">Batch</th><th class="py-2">Total</th><th class="py-2">Used</th><th class="py-2">Unused</th></tr></thead>
                <tbody class="divide-y divide-slate-100">${d.batchSummary.map((b) => `<tr><td class="py-2 font-medium">${ArchiveCommon.escapeHtml(b.batch)}</td><td class="py-2">${b.total}</td><td class="py-2 text-emerald-600">${b.used}</td><td class="py-2 text-rose-600">${b.unused}</td></tr>`).join("")}</tbody>
              </table></div>
            </section>
            <div class="grid md:grid-cols-2 gap-6">
              <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-3">
                <h3 class="text-sm font-semibold text-emerald-700">Used IMEIs (${d.matching.length})</h3>
                <div class="overflow-x-auto max-h-96 overflow-y-auto"><table class="w-full text-xs min-w-[420px]">
                  <thead class="text-left text-slate-500 uppercase border-b border-slate-200"><tr><th class="py-1.5">IMEI</th><th class="py-1.5">Vehicle</th><th class="py-1.5">Technician</th><th class="py-1.5">Install Date</th></tr></thead>
                  <tbody class="divide-y divide-slate-100">${d.matching.map((m) => `<tr><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(m.imei)}</td><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(m.vehicleReg)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(m.technician)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(m.installDate)}</td></tr>`).join("") || `<tr><td colspan="4" class="py-4 text-center text-slate-400">None</td></tr>`}</tbody>
                </table></div>
              </section>
              <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-3">
                <h3 class="text-sm font-semibold text-rose-700">Unused IMEIs (${d.unused.length})</h3>
                <div class="overflow-x-auto max-h-96 overflow-y-auto"><table class="w-full text-xs min-w-[300px]">
                  <thead class="text-left text-slate-500 uppercase border-b border-slate-200"><tr><th class="py-1.5">IMEI</th><th class="py-1.5">Technician</th></tr></thead>
                  <tbody class="divide-y divide-slate-100">${d.unused.map((u) => `<tr><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(u.imei)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(u.technician)}</td></tr>`).join("") || `<tr><td colspan="2" class="py-4 text-center text-slate-400">All IMEIs match</td></tr>`}</tbody>
                </table></div>
              </section>
            </div>`;
        } catch (e) {
          $("results").innerHTML = `<div class="text-center text-rose-600 py-8">${ArchiveCommon.escapeHtml(e.message)}</div>`;
        }
      }
      function init() { loadBatches(); $("check").addEventListener("click", check); }
    </script>
  </body>
</html>
