<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoice | Finemark</title>
  <style>
    /* ── Base ─────────────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand: #2f3c93;        /* primary brand colour (Finemark blue by default) */
      --brand-accent: #2fa9df; /* accent / gradient end */
      --brand-row: #f1f4fb;    /* alternating row + light fill tint */
    }
    /* Unique Tracking invoices override these to the orange certificate palette (set from JS). */
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; background: #f0f0f0; color: #1a1a1a; }

    /* ── Controls bar (hidden when printing) ──────────────────────────── */
    .controls-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--brand); color: white;
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .controls-bar h2 { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: -0.2px; }
    .btn-print {
      background: white; color: var(--brand); border: none; border-radius: 6px;
      padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .btn-print:hover { background: #e0e7ff; }
    .btn-close {
      background: transparent; color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.4); border-radius: 6px;
      padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    .btn-close:hover { background: rgba(255,255,255,0.12); }

    /* ── Page wrapper ─────────────────────────────────────────────────── */
    .page-wrapper { padding: 70px 20px 30px; min-height: 100vh; }
    .document {
      background: white; width: 210mm; margin: 0 auto;
      padding: 7mm 9mm 6mm;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }

    /* ── Brand gradient bar ───────────────────────────────────────────── */
    .brand-bar {
      height: 5px; border-radius: 2px; margin-bottom: 18px;
      background: linear-gradient(90deg, var(--brand) 0%, var(--brand-accent) 100%);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    .header { display: flex; flex-direction: column; margin-bottom: 10px; gap: 6px; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .header-bottom { text-align: center; padding: 4px 0 2px; }
    .company-block { display: flex; gap: 10px; align-items: center; }
    .company-name { font-size: 17px; font-weight: 800; color: var(--brand); letter-spacing: -0.3px; line-height: 1.1; white-space: nowrap; }
    .company-sub { font-size: 9px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .doc-title { font-size: 14px; font-weight: 900; color: var(--brand); letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.5; }
    .contact-block { text-align: right; font-size: 8.5px; color: #555; line-height: 1.9; min-width: 145px; }
    .contact-pin { color: var(--brand); font-weight: 800; font-size: 9px; display: block; margin-top: 3px; }

    /* ── Divider ──────────────────────────────────────────────────────── */
    hr.divider { border: none; border-top: 1.5px solid var(--brand); margin: 14px 0 12px; }

    /* ── Info row: Bill To + Invoice meta ─────────────────────────────── */
    .info-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; }

    .billto-box { flex: 0 0 55%; border: 1px solid #bbb; border-radius: 3px; overflow: hidden; }
    .billto-label {
      background: var(--brand-row); border-bottom: 1px solid #bbb;
      padding: 3px 8px; font-size: 8px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.5px; color: var(--brand);
    }
    .billto-body { padding: 8px 10px; }
    .customer-name { font-size: 13px; font-weight: 800; color: #1a1a1a; line-height: 1.2; }

    .quote-meta-box { flex: 1; border: 1px solid #bbb; border-radius: 3px; overflow: hidden; }
    .qmeta-tbl { width: 100%; border-collapse: collapse; }
    .qmeta-tbl tr:nth-child(odd) td { background: var(--brand-row); }
    .qmeta-tbl tr:nth-child(even) td { background: white; }
    .qmeta-tbl td { padding: 4px 8px; font-size: 9.5px; border-bottom: 1px solid #e8ecf0; }
    .qmeta-tbl td:first-child { font-weight: 700; color: #374151; width: 42%; border-right: 1px solid #e8ecf0; white-space: nowrap; }
    .qmeta-tbl tr:last-child td { border-bottom: none; }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700; border: 1px solid;
    }
    .badge-paid      { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .badge-unpaid    { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .badge-partial   { background: #fffbeb; color: #92400e; border-color: #fde68a; }
    .badge-overdue   { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
    .badge-cancelled { background: #f8fafc; color: #475569; border-color: #e2e8f0; }

    /* ── Vehicle table ────────────────────────────────────────────────── */
    .vehicle-wrap { border: 1px solid #c8d0e0; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .vehicle-tbl { width: 100%; border-collapse: collapse; }
    .vehicle-tbl thead tr { background: var(--brand); color: white; }
    .vehicle-tbl th {
      padding: 6px 8px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; text-align: left; color: white;
      border-right: 1px solid rgba(255,255,255,0.2);
    }
    .vehicle-tbl th:last-child { border-right: none; }
    .vehicle-tbl td { padding: 6px 8px; font-size: 10px; font-weight: 700; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
    .vehicle-tbl td:last-child { border-right: none; }
    .vehicle-tbl tbody tr:last-child td { border-bottom: none; }

    /* ── Line items table ─────────────────────────────────────────────── */
    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
    .items-table thead tr { background: var(--brand); color: white; }
    .items-table th {
      padding: 7px 8px; font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .items-table td { padding: 6px 8px; font-size: 10.5px; border-bottom: 1px solid #e8ecf0; vertical-align: top; }
    .items-table tbody tr:nth-child(even) td { background: var(--brand-row); }
    .items-table tbody tr:last-child td { border-bottom: 2px solid var(--brand); }
    .num { text-align: right; white-space: nowrap; }
    .center { text-align: center; }
    .col-item  { min-width: 90px; }
    .col-desc  { font-size: 10px; }
    td.col-desc { color: #1a1a1a; }
    .col-qty   { width: 40px; }
    .col-price { width: 85px; }
    .col-vat   { width: 80px; }
    .col-amount{ width: 90px; }

    /* ── Totals ───────────────────────────────────────────────────────── */
    .totals-section { display: flex; justify-content: flex-end; margin: 4px 0 14px; }
    .totals-table { border-collapse: collapse; min-width: 270px; }
    .totals-table td { padding: 4px 8px; font-size: 11px; }
    .totals-table td:first-child { color: #475569; font-weight: 600; text-align: right; }
    .totals-table td:last-child  { font-weight: 700; text-align: right; color: #1a1a1a; min-width: 115px; }
    .totals-table tr.subtotal-row td { border-top: 1px solid #e2e8f0; padding-top: 7px; }
    .totals-table tr.grand-total td  { font-size: 13px; color: var(--brand); border-top: 2px solid var(--brand); padding-top: 7px; }

    /* ── Notes ────────────────────────────────────────────────────────── */
    .notes-section { margin-bottom: 12px; }
    .section-label { font-size: 9px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .notes-text { font-size: 10px; color: #475569; line-height: 1.6; white-space: pre-line; }

    /* ── eTIMS badge ──────────────────────────────────────────────────── */
    .etims-badge {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 5px;
      padding: 8px 12px; margin-bottom: 12px; font-size: 9.5px; color: #166534;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .etims-badge-text { flex: 1; }
    .etims-badge-text strong { color: #15803d; }
    .etims-badge-logo { opacity: 0.45; flex-shrink: 0; }

    /* ── Payment table ────────────────────────────────────────────────── */
    .payment-section { margin-bottom: 14px; display: flex; justify-content: flex-end; }
    .payment-tbl { width: 55%; border-collapse: collapse; border: 1px solid #c8d0e0; }
    .payment-tbl caption {
      background: var(--brand); color: white;
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
      padding: 6px 10px; text-align: left; caption-side: top;
    }
    .payment-tbl th {
      background: var(--brand-row); color: var(--brand);
      font-size: 9.5px; font-weight: 800; text-align: left;
      padding: 6px 10px; border: 1px solid #c8d0e0;
      width: 30%; vertical-align: top; white-space: nowrap;
    }
    .payment-tbl td {
      font-size: 9.5px; color: #1a1a1a;
      padding: 6px 10px; border: 1px solid #c8d0e0;
      line-height: 1.6; vertical-align: top;
    }
    .payment-tbl tbody tr:nth-child(even) th,
    .payment-tbl tbody tr:nth-child(even) td { background: var(--brand-row); }

    /* ── Footer ───────────────────────────────────────────────────────── */
    .footer {
      margin-top: 14px; border-top: 1px solid #e2e8f0; padding-top: 8px;
      text-align: center; font-size: 9px; color: #94a3b8;
      letter-spacing: 0.4px; text-transform: uppercase;
    }

    /* ── States ───────────────────────────────────────────────────────── */
    .state-msg { padding: 40px; text-align: center; color: #64748b; font-size: 14px; }

    /* ── Print ────────────────────────────────────────────────────────── */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @media print {
      body { background: white; }
      .controls-bar { display: none !important; }
      .page-wrapper { padding: 0; }
      .document { width: 100%; margin: 0; padding: 3mm 4mm; box-shadow: none; }
    }
    @page { size: A4 portrait; margin: 5mm; }
  </style>
</head>
<body>

<!-- Controls bar -->
<div class="controls-bar">
  <h2 id="ctrl-title">Invoice</h2>
  <button class="btn-print" onclick="window.print()">&#128438; Print / Save as PDF</button>
  <button class="btn-close" onclick="window.close ? window.close() : history.back()">&#x2715; Close</button>
</div>

<div class="page-wrapper">
  <div class="document" id="doc-root">
    <div class="state-msg" id="state-msg">Loading invoice&hellip;</div>
  </div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const id     = params.get("id");
  const msgEl  = document.getElementById("state-msg");
  const root   = document.getElementById("doc-root");

  if (!id) { msgEl.textContent = "No invoice ID provided."; return; }

  const session = JSON.parse(localStorage.getItem("finemark_session") || "{}");
  const token   = session?.accessToken;
  if (!token) {
    msgEl.innerHTML = 'Not authenticated. Please <a href="login.html">log in</a>.';
    return;
  }

  let payload;
  try {
    const r = await fetch(`/api/invoices/${encodeURIComponent(id)}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!r.ok) throw new Error(`Server returned ${r.status}`);
    payload = await r.json();
  } catch (e) {
    msgEl.textContent = "Failed to load invoice: " + e.message;
    return;
  }

  const inv   = payload.data?.invoice || payload.data || payload;
  const items = payload.data?.items || inv.items || [];

  // ── Helpers ───────────────────────────────────────────────────────────────
  const esc = (s) => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const fmt = (d) => d ? new Date(d).toLocaleDateString("en-KE", { year:"numeric", month:"short", day:"numeric" }) : "—";
  const kes = (v) => "Ksh " + Number(v || 0).toLocaleString("en-KE", { minimumFractionDigits:2, maximumFractionDigits:2 });

  const invNo    = inv.invoiceNumber || inv.invoice_number || "Invoice";
  const docTitle = "INVOICE";

  // Company brand (Finemark vs Unique Tracking) + VAT presentation, per the partner-bank config.
  const BRAND = inv.brandProfile || {};
  const bCompany = BRAND.companyName || "Fine Mark Tracking Limited";
  const bTagline = BRAND.tagline || "Security in Every Mile";
  const bAddress = BRAND.address || "P.O. Box 12345-00100, Nairobi";
  const bPhone   = BRAND.phone || "+254 700 000 000";
  const bEmail   = BRAND.email || "info@finemark.co.ke";
  const bWeb     = BRAND.website || "www.finemark.co.ke";
  const bPin     = BRAND.pin || inv.pinNo || inv.pin_no || "P051961922E";

  // Unique Tracking invoices adopt the orange certificate palette + the UT logo.
  const isUnique = (BRAND.key === "unique") || (inv.template === "unique");
  if (isUnique) {
    const rs = document.documentElement.style;
    rs.setProperty("--brand", "#de7809");
    rs.setProperty("--brand-accent", "#f97316");
    rs.setProperty("--brand-row", "#fff3ea");
  }
  const logoHtml = isUnique
    ? `<img src="assets/unique-tracking-logo.png" alt="Unique Tracking Solutions" style="height:46px;width:auto;display:block;" />`
    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="52" height="52">
              <path d="M44 60c40-36 128-36 168 0" fill="none" stroke="#2f3c93" stroke-width="12" stroke-linecap="round"/>
              <path d="M56 84c32-28 112-28 144 0" fill="none" stroke="#2fa9df" stroke-width="16" stroke-linecap="round"/>
              <text x="28" y="190" font-family="Arial,sans-serif" font-size="120" font-weight="700" fill="#2f3c93">F</text>
              <text x="118" y="190" font-family="Arial,sans-serif" font-size="120" font-weight="700" fill="#2fa9df">M</text>
              <path fill="#2f3c93" d="M168 104c0-22.1-17.9-40-40-40s-40 17.9-40 40c0 30 40 78 40 78s40-48 40-78z"/>
              <circle fill="#2fa9df" cx="128" cy="104" r="18"/>
            </svg>`;

  const vatMode  = inv.vatDisplay || "auto";
  let dSub = Number(inv.subtotal || 0), dVat = Number(inv.vatTotal || inv.vat_total || 0), dTot = Number(inv.total || inv.amount || 0);
  let vatLabel = "VAT (16%) :", inclLabel = false;
  if (vatMode === "inclusive") { dSub = Math.round(dTot / 1.16 * 100) / 100; dVat = Math.round((dTot - dSub) * 100) / 100; inclLabel = true; }
  else if (vatMode === "zero_rated") { dSub = dTot; dVat = 0; vatLabel = "VAT (0%) :"; }
  else if (vatMode === "none") { dSub = dTot; dVat = 0; }   // amount as-is, no VAT line/calc
  const isVat = vatMode === "zero_rated" ? true : (vatMode === "none" ? false : (inclLabel || dVat > 0));
  document.title = `${docTitle} ${invNo} | Finemark`;
  document.getElementById("ctrl-title").textContent = `${docTitle} ${invNo}`;

  // ── Status badge ──────────────────────────────────────────────────────────
  const status = inv.status || "Unpaid";
  const badgeClass = {
    Paid: "badge-paid", Unpaid: "badge-unpaid", Partial: "badge-partial",
    Overdue: "badge-overdue", Cancelled: "badge-cancelled"
  }[status] || "badge-unpaid";

  // ── eTIMS ─────────────────────────────────────────────────────────────────
  const etimsSigned = inv.etimsSigned || inv.etims_signed;
  const etimsCtrl   = inv.etimsControlNo || inv.etims_control_no || "";
  const etimsRcpt   = inv.etimsReceiptNo || inv.etims_receipt_no || inv.etrReceiptNo || "";

  const isBankPartner = !!inv.bankPartnerName;
  const hasVehicle = !!(inv.vehicle && (inv.vehicle.registration || inv.vehicle.make || inv.vehicle.model));

  // ── Build items rows ──────────────────────────────────────────────────────
  const itemsHtml = items.length ? items.map(it => `
      <tr>
        <td class="col-item">${esc(it.item || "—")}</td>
        <td class="col-desc">${esc(it.description || "")}</td>
        <td class="col-qty center">${Number(it.qty || 0).toLocaleString("en-KE")}</td>
        <td class="col-price num">${kes(it.rate)}</td>
        <td class="col-vat num">${kes(it.vat)}</td>
        <td class="col-amount num">${kes(it.amount)}</td>
      </tr>`).join("")
    : `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:12px;">No line items</td></tr>`;

  // ── Render ────────────────────────────────────────────────────────────────
  root.innerHTML = `
    <div class="brand-bar"></div>

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="company-block">
          <div>
            ${logoHtml}
          </div>
          <div style="margin-left:10px">
            <div class="company-name">${esc(bCompany)}</div>
            <div class="company-sub">${esc(bTagline)}</div>
          </div>
        </div>
        <div class="contact-block">
          ${esc(bAddress)}<br>
          M: ${esc(bPhone)}<br>
          E: ${esc(bEmail)}<br>
          W: ${esc(bWeb)}<br>
          <span class="contact-pin">PIN: ${esc(bPin)}</span>
        </div>
      </div>
      <div class="header-bottom">
        <span class="doc-title">${docTitle}</span>
      </div>
    </div>

    <hr class="divider" />

    <!-- Bill To + Invoice Meta -->
    <div class="info-row">
      <div class="billto-box">
        <div class="billto-label">Bill To${isBankPartner ? " (Bank Partner)" : ""}</div>
        <div class="billto-body">
          ${isBankPartner ? `
          <div class="customer-name">${esc(inv.bankPartnerName)}</div>
          ${inv.bankAddress ? `<div style="font-size:9.5px;color:#374151;margin-top:3px">${esc(inv.bankAddress)}</div>` : ""}
          <div style="font-size:10px;color:#111827;margin-top:6px"><strong>Customer:</strong> ${esc(inv.customer || "—")}</div>
          ` : `
          <div class="customer-name">${esc(inv.customer || "—")}</div>
          ${inv.customerAddress ? `<div style="font-size:9.5px;color:#374151;margin-top:3px">${esc(inv.customerAddress)}</div>` : ""}
          ${inv.representative ? `<div style="font-size:9.5px;color:#374151;margin-top:2px"><strong>Attn:</strong> ${esc(inv.representative)}</div>` : ""}
          `}
          ${etimsSigned ? `<div style="margin-top:8px"><span style="font-size:9.5px;color:#166534;font-weight:700;">&#10003; KRA eTIMS Signed</span></div>` : ""}
        </div>
      </div>
      <div class="quote-meta-box">
        <table class="qmeta-tbl">
          <tr><td>Invoice No:</td><td><strong>${esc(invNo)}</strong></td></tr>
          <tr><td>Invoice Date:</td><td>${fmt(inv.taxDate || inv.issuedOn || inv.issued_on)}</td></tr>
          <tr><td>Due Date:</td><td>${fmt(inv.dueOn || inv.due_on)}</td></tr>
          ${(inv.salesRepName || inv.representative) ? `<tr><td>Sales Representative:</td><td>${esc(inv.salesRepName || inv.representative)}</td></tr>` : ""}
          ${inv.technicianName ? `<tr><td>Technician:</td><td>${esc(inv.technicianName)}</td></tr>` : ""}
          ${(inv.jobCardNo || inv.ticketNo) ? `<tr><td>Job Card No:</td><td>${esc(inv.jobCardNo || inv.ticketNo)}</td></tr>` : ""}
          ${inv.jobCardStatus ? `<tr><td>Job Card Status:</td><td>${esc(inv.jobCardStatus)}</td></tr>` : ""}
          ${inv.installationDate ? `<tr><td>Installation Date:</td><td>${esc(inv.installationDate)}${inv.installationTime ? " " + esc(inv.installationTime) : ""}</td></tr>` : ""}
        </table>
      </div>
    </div>

    <!-- Vehicle table (shown only when vehicle is linked) -->
    ${hasVehicle ? `
    <div class="vehicle-wrap">
      <table class="vehicle-tbl">
        <thead>
          <tr>
            <th style="width:30%">Vehicle Reg.</th>
            <th style="width:30%">Make</th>
            <th style="width:40%">Make &amp; Model</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>${esc(inv.vehicle.registration || "—")}</td>
            <td>${esc(inv.vehicle.make || "—")}</td>
            <td>${esc([inv.vehicle.make, inv.vehicle.model].filter(Boolean).join(" ") || "—")}</td>
          </tr>
        </tbody>
      </table>
    </div>` : ""}

    <!-- Line items -->
    <table class="items-table">
      <thead>
        <tr>
          <th class="col-item">Code</th>
          <th class="col-desc">Description</th>
          <th class="col-qty center">Qty</th>
          <th class="col-price num">Unit Price</th>
          <th class="col-vat num">VAT</th>
          <th class="col-amount num">Amount</th>
        </tr>
      </thead>
      <tbody>${itemsHtml}</tbody>
    </table>

    <!-- Totals -->
    <div class="totals-section">
      <table class="totals-table">
        <tr class="subtotal-row">
          <td>${inclLabel ? "AMOUNT (EXCL. VAT) :" : "SUB TOTAL :"}</td>
          <td>${kes(dSub)}</td>
        </tr>
        ${isVat ? `<tr><td>${inclLabel ? "VAT (16% INCL.) :" : vatLabel}</td><td>${kes(dVat)}</td></tr>` : ""}
        <tr class="grand-total">
          <td>GRAND TOTAL :</td>
          <td>${kes(dTot)}</td>
        </tr>
      </table>
    </div>

    ${inv.notes ? `
    <!-- Notes -->
    <div class="notes-section">
      <div class="section-label">Notes / Remarks</div>
      <div class="notes-text">${esc(inv.notes)}</div>
    </div>` : ""}

    ${etimsSigned && etimsCtrl ? `
    <!-- eTIMS -->
    <div class="etims-badge">
      <div class="etims-badge-text">
        <div style="font-weight:700;font-size:10px;color:#15803d;letter-spacing:0.3px;">KRA eTIMS VERIFIED</div>
        <div style="margin-top:3px;">Control No: <strong>${esc(etimsCtrl)}</strong></div>
        ${etimsRcpt ? `<div>Receipt No: <strong>${esc(etimsRcpt)}</strong></div>` : ""}
        ${(inv.etimsSignedAt || inv.etims_signed_at) ? `<div style="color:#166534;">Signed: ${esc(String(inv.etimsSignedAt || inv.etims_signed_at))}</div>` : ""}
      </div>
      <img class="etims-badge-logo" src="/assets/kra-logo.png" alt="KRA" style="height:52px;width:auto;">
    </div>` : ""}

    <!-- Payment details -->
    <hr class="divider" style="margin-top:10px" />
    <div class="payment-section">
      <table class="payment-tbl">
        <caption>Mode of Payments &mdash; ${esc(bCompany)}</caption>
        <tbody>
          ${(() => {
            // Unique Tracking documents collect into Unique Tracking's own accounts (brand profile).
            if (inv.template === "unique") {
              const r = [];
              if (BRAND.till) r.push(`<tr><th>MPESA TILL</th><td>${esc(bCompany)}<br><strong>Till: ${esc(BRAND.till)}</strong></td></tr>`);
              if (BRAND.paybill) r.push(`<tr><th>MPESA PAYBILL</th><td>${esc(bCompany)}<br><strong>Paybill: ${esc(BRAND.paybill)}</strong></td></tr>`);
              if (BRAND.bankName && BRAND.bankAccountNo) r.push(`<tr><th>${esc(BRAND.bankName)}</th><td>${BRAND.bankBranch ? esc(BRAND.bankBranch) + "<br>" : ""}A/C <strong>${esc(BRAND.bankAccountNo)}</strong>${BRAND.payee ? "<br>" + esc(BRAND.payee) : ""}</td></tr>`);
              if (r.length) return r.join("");
            }
            if (Array.isArray(inv.paymentOptions) && inv.paymentOptions.length) {
              return inv.paymentOptions.map(o => `<tr><th>${esc(o.label)}</th><td>${esc(o.value)}</td></tr>`).join("");
            }
            const paybill = inv.paymentPaybill || inv.payment_paybill || "4048569";
            const vehicleRef = (inv.vehicle && inv.vehicle.registration) ? inv.vehicle.registration : (inv.paymentAccountHint || inv.payment_account_hint || "Finemark Tracking");
            let rows = `
              <tr><th>MPESA PAYBILL</th><td>Paybill Number &mdash; Fine Mark Tracking Limited<br><strong>${esc(paybill)}</strong><br>Account: <strong>${esc(vehicleRef)}</strong></td></tr>
              <tr><th>MPESA TILL NUMBER</th><td>Till Number &mdash; Fine Mark Tracking Limited<br><strong>5620852</strong></td></tr>`;
            if (inv.bankName || inv.bank_name) {
              rows += `<tr><th>${esc(inv.bankName || inv.bank_name)}</th><td>${esc(inv.bankAccountNo || inv.bank_account_no || "—")}</td></tr>`;
            } else if (inv.bankAccount) {
              const ba = inv.bankAccount;
              rows += `<tr><th>${esc(ba.bankName)}</th><td>${esc(ba.accountName)} &mdash; ${esc(ba.accountNumber)}</td></tr>`;
            }
            return rows;
          })()}
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div class="footer">
      GPS Tracking &bull; Fleet Management &bull; Vehicle Monitoring &bull; Fuel Management &bull; Driver Behaviour
    </div>
  `;
})();
</script>
</body>
</html>
