<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner Portal – Reset Password</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white border border-slate-200 p-8 shadow-xl">
      <h1 class="text-xl font-semibold text-slate-900">Reset password</h1>
      <p class="text-sm text-slate-500 mt-1">Set a new password for your partner portal account.</p>
      <form id="r-form" class="mt-5 space-y-3">
        <input id="r-pass" type="password" minlength="8" required placeholder="New password" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm" />
        <input id="r-pass2" type="password" minlength="8" required placeholder="Confirm new password" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm" />
        <button id="r-send" class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Update password</button>
        <p id="r-msg" class="text-xs text-slate-500"></p>
      </form>
      <a href="partner-portal-login.html" class="mt-4 inline-block text-sm text-blue-600 hover:underline">Back to login</a>
    </div>
    <script>
      const API = "/api";
      const token = new URLSearchParams(window.location.search).get("token") || "";
      document.getElementById("r-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("r-msg");
        const btn = document.getElementById("r-send");
        const p1 = document.getElementById("r-pass").value;
        const p2 = document.getElementById("r-pass2").value;
        if (!token) { msg.textContent = "Invalid reset token."; return; }
        if (p1 !== p2) { msg.textContent = "Passwords do not match."; return; }
        btn.disabled = true;
        btn.textContent = "Updating...";
        try {
          const r = await fetch(`${API}/partner-portal/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: p1 }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.message || "Failed to reset password");
          msg.textContent = "Password updated successfully. Redirecting to login...";
          setTimeout(() => { location.href = "partner-portal-login.html"; }, 1200);
        } catch (err) {
          msg.textContent = err.message || "Failed to reset password.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Update password";
        }
      });
    </script>
  </body>
</html>
