<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — Certificate Repository</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div><h1 class="text-3xl font-semibold tracking-tight text-slate-900">Certificate Repository</h1>
              <p class="text-sm text-slate-600">Archived IDTS-generated installation certificates (PDF) — historical reference only.</p></div>
            <div id="badge-slot"></div>
          </div>
          <section class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-end gap-3">
              <div class="flex-1 min-w-[240px]">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Search by Vehicle Reg or File Name</label>
                <input id="search" type="text" placeholder="e.g. KDT 175V" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Sort By</label>
                <select id="sort" class="mt-2 rounded-lg border border-slate-200 px-3 py-2 text-sm">
                  <option value="name">Name</option>
                  <option value="date">Last Modified</option>
                </select>
              </div>
            </div>
          </section>
          <p id="count-summary" class="text-sm text-slate-600"></p>
          <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
          <div class="flex items-center justify-between pt-2">
            <span id="page-info" class="text-sm text-slate-600">—</span>
            <div class="flex gap-2">
              <button id="btn-prev" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs hover:bg-slate-50 disabled:opacity-40" disabled>Previous</button>
              <button id="btn-next" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs hover:bg-slate-50 disabled:opacity-40" disabled>Next</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;
        init();
      });
      const $ = (id) => document.getElementById(id);
      let page = 1;
      const pageSize = 60;
      let searchTimeout;

      function fmtBytes(n) {
        if (!n) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        let i = 0, v = n;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return `${v.toFixed(1)} ${units[i]}`;
      }

      async function load(resetPage) {
        if (resetPage) page = 1;
        const params = { page: String(page), pageSize: String(pageSize), sort: $("sort").value };
        if ($("search").value.trim()) params.search = $("search").value.trim();
        const qs = new URLSearchParams(params).toString();
        $("grid").innerHTML = `<div class="col-span-full text-center text-slate-400 py-8">Loading…</div>`;
        try {
          const res = await window.FINEMARK_APP.apiFetch(`/archive/certificates?${qs}`);
          const rows = res.data || [];
          const meta = res.meta || { total: rows.length };
          $("count-summary").textContent = `${meta.total.toLocaleString()} certificate${meta.total === 1 ? "" : "s"} in the archive.`;
          if (!rows.length) {
            $("grid").innerHTML = `<div class="col-span-full text-center text-amber-700 bg-amber-50 border border-amber-200 rounded-lg py-8">No certificates found.</div>`;
          } else {
            $("grid").innerHTML = rows.map((f) => `
              <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2">
                <div class="font-semibold text-slate-800 text-sm truncate" title="${ArchiveCommon.escapeHtml(f.filename)}">${ArchiveCommon.escapeHtml(f.vehicleReg)}</div>
                <div class="text-xs text-slate-500">${ArchiveCommon.fmtDate(f.lastModified)} · ${fmtBytes(f.sizeBytes)}</div>
                <div class="flex gap-3 pt-1 text-sm">
                  <button type="button" class="cert-view text-blue-600 hover:text-blue-800 font-medium" data-filename="${ArchiveCommon.escapeHtml(f.filename)}">View</button>
                  <button type="button" class="cert-download text-slate-600 hover:text-slate-900 font-medium" data-filename="${ArchiveCommon.escapeHtml(f.filename)}">Download</button>
                </div>
              </div>`).join("");
          }
          const from = meta.total === 0 ? 0 : (page - 1) * pageSize + 1;
          const to = Math.min(page * pageSize, meta.total);
          $("page-info").textContent = meta.total ? `Showing ${from}–${to} of ${meta.total.toLocaleString()}` : "—";
          $("btn-prev").disabled = page <= 1;
          $("btn-next").disabled = page * pageSize >= meta.total;
        } catch (e) {
          $("grid").innerHTML = `<div class="col-span-full text-center text-rose-600 bg-rose-50 border border-rose-200 rounded-lg py-8">${ArchiveCommon.escapeHtml(e.message)}</div>`;
        }
      }

      function init() {
        load(true);
        $("search").addEventListener("input", () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => load(true), 400); });
        $("sort").addEventListener("change", () => load(true));
        $("btn-prev").addEventListener("click", () => { if (page > 1) { page--; load(false); } });
        $("btn-next").addEventListener("click", () => { page++; load(false); });
        // Delegated: the grid's contents are re-rendered on every load()/search, so
        // listen on the container rather than re-binding per card.
        $("grid").addEventListener("click", (e) => {
          const filename = e.target?.dataset?.filename;
          if (!filename) return;
          const path = `/archive/certificates/file/${encodeURIComponent(filename)}`;
          if (e.target.classList.contains("cert-view")) ArchiveCommon.viewFile(path);
          else if (e.target.classList.contains("cert-download")) ArchiveCommon.downloadFile(path, filename);
        });
      }
    </script>
  </body>
</html>
