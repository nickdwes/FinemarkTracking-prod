<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Deliver Certificate</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-6">

          <div class="max-w-5xl mx-auto space-y-6">
            <div>
              <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Deliver Certificate</h1>
              <p class="text-sm text-slate-600">Send certificates via email or prepare physical delivery.</p>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm shadow-slate-200/60">
              <h2 class="text-sm font-semibold text-slate-700">Next Step</h2>
              <p class="mt-2 text-sm text-slate-600">Complete delivery and update status.</p>
              <a href="admin-certificates.html" class="mt-3 inline-flex items-center text-sm text-blue-600 hover:underline">
                Return to Certificates Overview →
              </a>
            </div>
          </div>
        
  </main>
</div>
<div id="fm-footer"></div>
<script src="assets/contracts.js"></script>
<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.FINEMARK_APP?.requirePageAccess?.();
  });
</script>
<script>
      const storedUser = localStorage.getItem("finemarkUser");
      let userData = null;
      try {
        userData = storedUser ? JSON.parse(storedUser) : null;
      } catch (error) {
        userData = null;
      }

      if (!userData || !userData.role || userData.role !== "admin") {
        window.location.href = "login.html";
      } else {
        document.getElementById("user-info").textContent = `User: ${userData.email} (${userData.role})`;
      }

      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("finemarkUser");
        window.location.href = "login.html";
      });
    </script>
</body>
</html>
