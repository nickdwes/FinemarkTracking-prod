<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — Removal Logs</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div><h1 class="text-3xl font-semibold tracking-tight text-slate-900">Removal Logs</h1>
              <p class="text-sm text-slate-600">Archived IDTS record deletions — historical reference only.</p></div>
            <div id="badge-slot"></div>
          </div>
          <section class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm space-y-4">
            <div class="grid gap-4 md:grid-cols-3">
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Deleted From</label>
                <input id="start-date" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/></div>
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Deleted To</label>
                <input id="end-date" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/></div>
              <div class="flex items-end gap-3">
                <button id="apply" class="w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Apply</button>
                <button id="reset" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Reset</button>
              </div>
            </div>
          </section>
          <section class="bg-white border border-slate-200/80 rounded-xl shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-sm min-w-[900px]">
                <thead class="text-left text-slate-500 text-xs uppercase border-b border-slate-200 bg-slate-50">
                  <tr><th class="py-2 px-3">Archive ID</th><th class="py-2 px-3">Original ID</th><th class="py-2 px-3">Client</th>
                    <th class="py-2 px-3">Vehicle Reg</th><th class="py-2 px-3">IMEI</th><th class="py-2 px-3">Install Date</th>
                    <th class="py-2 px-3">Deleted By</th><th class="py-2 px-3">Deletion Date</th></tr>
                </thead>
                <tbody id="rows" class="divide-y divide-slate-100"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;
        init();
      });
      const $ = (id) => document.getElementById(id);
      async function load() {
        const f = {};
        if ($("start-date").value) f.startDate = $("start-date").value;
        if ($("end-date").value) f.endDate = $("end-date").value;
        const qs = new URLSearchParams(f).toString();
        $("rows").innerHTML = `<tr><td colspan="8" class="text-center text-slate-400 py-8">Loading…</td></tr>`;
        try {
          const res = await window.FINEMARK_APP.apiFetch(`/archive/removals-log?${qs}`);
          const rows = res.data || res;
          if (!rows.length) {
            $("rows").innerHTML = `<tr><td colspan="8" class="text-center text-slate-400 py-8">No records have been archived and deleted in this range.</td></tr>`;
            return;
          }
          $("rows").innerHTML = rows.map((r) => `
            <tr>
              <td class="py-2 px-3">${r.legacyId}</td>
              <td class="py-2 px-3 font-semibold">${r.originalLegacyId}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.clientName)}</td>
              <td class="py-2 px-3 font-mono uppercase">${ArchiveCommon.escapeHtml(r.vehicleReg)}</td>
              <td class="py-2 px-3 font-mono text-xs">${ArchiveCommon.escapeHtml(r.imei)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.installationDateRaw)}</td>
              <td class="py-2 px-3 text-rose-600 font-semibold">${ArchiveCommon.escapeHtml(r.deletedBy)}</td>
              <td class="py-2 px-3 text-slate-400 text-xs">${ArchiveCommon.fmtDateTime(r.deletionDate)}</td>
            </tr>`).join("");
        } catch (e) {
          $("rows").innerHTML = `<tr><td colspan="8" class="text-center text-rose-600 py-8">${ArchiveCommon.escapeHtml(e.message)}</td></tr>`;
        }
      }
      function init() {
        load();
        $("apply").addEventListener("click", load);
        $("reset").addEventListener("click", () => { $("start-date").value = ""; $("end-date").value = ""; load(); });
      }
    </script>
  </body>
</html>
