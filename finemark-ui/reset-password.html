<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Reset Password</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<main class="min-h-screen flex items-center justify-center px-6 py-12">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200/80 p-8">
          <div class="flex items-center gap-4 mb-6">
            <img src="assets/finemark-logo.svg" alt="Finemark logo" class="h-12 w-12" />
            <div>
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Finemark</p>
              <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Reset password</h1>
              <p class="text-sm text-slate-600">Choose a strong password to protect your account.</p>
            </div>
          </div>

          <div id="token-warning" class="hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700">
            Invalid or missing reset token
          </div>

          <form id="reset-form" class="space-y-4" novalidate>
            <div>
              <label class="block text-sm font-medium mb-1.5 text-slate-700" for="password">New password</label>
              <input id="password" type="password" placeholder="••••••••" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-slate-900 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40 focus:border-blue-500" />
              <p class="fm-error hidden" data-error-for="password"></p>
            </div>
            <div class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 space-y-2">
              <div class="flex items-center gap-2" data-rule="length">
                <span class="rule-icon h-5 w-5 inline-flex items-center justify-center rounded-full bg-slate-200 text-slate-500 text-xs">•</span>
                <span>At least 8 characters</span>
              </div>
              <div class="flex items-center gap-2" data-rule="uppercase">
                <span class="rule-icon h-5 w-5 inline-flex items-center justify-center rounded-full bg-slate-200 text-slate-500 text-xs">•</span>
                <span>1 uppercase</span>
              </div>
              <div class="flex items-center gap-2" data-rule="number">
                <span class="rule-icon h-5 w-5 inline-flex items-center justify-center rounded-full bg-slate-200 text-slate-500 text-xs">•</span>
                <span>1 number</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5 text-slate-700" for="confirm-password">Confirm password</label>
              <input id="confirm-password" type="password" placeholder="••••••••" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-slate-900 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40 focus:border-blue-500" />
              <p id="mismatch-error" class="mt-1 text-xs text-red-600 hidden">Passwords do not match.</p>
            </div>
            <button id="reset-submit" type="submit" class="w-full rounded-lg bg-blue-600 text-white py-2.5 font-medium shadow-sm shadow-blue-600/20 hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50">
              Update password
            </button>
            <div id="reset-inline-error" class="hidden"></div>
          </form>

          <div class="mt-6 text-sm text-slate-500">
            <a href="login.html" class="text-blue-600 hover:underline">Back to login</a>
          </div>
        </div>

        
      </div>
    </main>

    
  
<script src="assets/contracts.js"></script>
<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm-password");
      const mismatchError = document.getElementById("mismatch-error");
      const resetForm = document.getElementById("reset-form");
      const resetSubmit = document.getElementById("reset-submit");
      const tokenWarning = document.getElementById("token-warning");
      const inlineError = document.getElementById("reset-inline-error");

      const rules = {
        length: (value) => value.length >= 8,
        uppercase: (value) => /[A-Z]/.test(value),
        number: (value) => /\d/.test(value),
      };

      const updateRule = (name, passed) => {
        const ruleRow = document.querySelector(`[data-rule="${name}"]`);
        const icon = ruleRow.querySelector(".rule-icon");
        icon.textContent = passed ? "✓" : "•";
        icon.classList.toggle("bg-emerald-100", passed);
        icon.classList.toggle("text-emerald-700", passed);
        icon.classList.toggle("bg-slate-200", !passed);
        icon.classList.toggle("text-slate-500", !passed);
      };

      const updateRules = () => {
        const value = passwordInput.value;
        updateRule("length", rules.length(value));
        updateRule("uppercase", rules.uppercase(value));
        updateRule("number", rules.number(value));
      };

      const updateMismatch = () => {
        const mismatch = confirmInput.value && confirmInput.value !== passwordInput.value;
        confirmInput.classList.toggle("border-red-500", mismatch);
        confirmInput.classList.toggle("focus-visible:ring-red-500/40", mismatch);
        confirmInput.classList.toggle("focus-visible:ring-blue-500/40", !mismatch);
        mismatchError.classList.toggle("hidden", !mismatch);
        return mismatch;
      };

      const token = new URLSearchParams(window.location.search).get("token");
      if (!token) {
        tokenWarning.classList.remove("hidden");
        resetSubmit.disabled = true;
        resetSubmit.classList.add("bg-slate-300", "hover:bg-slate-300", "text-slate-500", "cursor-not-allowed");
        resetSubmit.classList.remove("bg-blue-600", "hover:bg-blue-700", "text-white");
      }

      passwordInput.addEventListener("input", () => {
        updateRules();
        updateMismatch();
      });

      confirmInput.addEventListener("input", updateMismatch);

      resetForm.addEventListener("submit", (event) => {
        event.preventDefault();
        window.FINEMARK_APP.clearFormErrors(resetForm);
        inlineError.classList.add("hidden");
        if (!token) {
          window.FINEMARK_APP.showInlineError(inlineError, "Invalid or missing reset token.");
          inlineError.classList.remove("hidden");
          return;
        }
        updateRules();
        const hasMismatch = updateMismatch();
        const value = passwordInput.value;
        const policyError = window.FINEMARK_APP.Validators.passwordPolicy(value);
        if (policyError) {
          window.FINEMARK_APP.setFieldError(passwordInput, policyError);
        }
        const valid =
          rules.length(value) && rules.uppercase(value) && rules.number(value) && !hasMismatch && !policyError;
        if (!valid) {
          return;
        }
        window.FINEMARK_APP.setLoading(resetSubmit, true, "Updating...");
        window.FINEMARK_APP.AuthService.resetPassword({ token, newPassword: value })
          .then(() => {
            localStorage.setItem("resetComplete", "true");
            window.location.href = "reset-success.html";
          })
          .catch((error) => {
            window.FINEMARK_APP.showToast(error.message || "Failed to reset password", "error");
            window.FINEMARK_APP.showInlineError(inlineError, error.message || "Failed to reset password", {
              retryText: "Try again",
              onRetry: () => resetForm.dispatchEvent(new Event("submit")),
            });
            inlineError.classList.remove("hidden");
          })
          .finally(() => {
            window.FINEMARK_APP.setLoading(resetSubmit, false);
          });
      });
    </script>
</body>
</html>
