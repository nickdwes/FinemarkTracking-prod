<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — Speed Governor Records</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div><h1 class="text-3xl font-semibold tracking-tight text-slate-900">Search Speed Governor Record</h1>
              <p class="text-sm text-slate-600">Archived IDTS speed governor installs — historical reference only.</p></div>
            <div id="badge-slot"></div>
          </div>
          <section class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm space-y-4">
            <div class="grid gap-4 md:grid-cols-4">
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Start Date</label><input id="f-start" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/></div>
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">End Date</label><input id="f-end" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/></div>
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Technician</label>
                <select id="f-technician" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="">All</option></select></div>
              <div><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Sales Person</label>
                <select id="f-sales" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"><option value="">All</option></select></div>
            </div>
            <div class="flex gap-3"><button id="search" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Filter</button>
              <button id="reset" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Reset</button></div>
          </section>
          <section class="bg-white border border-slate-200/80 rounded-xl shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-sm min-w-[1000px]">
                <thead class="text-left text-slate-500 text-xs uppercase border-b border-slate-200 bg-slate-50">
                  <tr><th class="py-2 px-3">S/N</th><th class="py-2 px-3">Install Date</th><th class="py-2 px-3">Client</th><th class="py-2 px-3">Contact</th>
                    <th class="py-2 px-3">Reg No</th><th class="py-2 px-3">Model</th><th class="py-2 px-3">Device Type</th>
                    <th class="py-2 px-3">Technician</th><th class="py-2 px-3">Sales Person</th><th class="py-2 px-3">Comments</th></tr>
                </thead>
                <tbody id="rows" class="divide-y divide-slate-100"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;
        init();
      });
      const $ = (id) => document.getElementById(id);
      function filters() {
        const f = {};
        if ($("f-start").value) f.startDate = $("f-start").value;
        if ($("f-end").value) f.endDate = $("f-end").value;
        if ($("f-technician").value) f.technician = $("f-technician").value;
        if ($("f-sales").value) f.salesPerson = $("f-sales").value;
        return f;
      }
      async function loadMeta() {
        try {
          const res = await window.FINEMARK_APP.apiFetch("/archive/meta");
          const d = res.data || res;
          d.technicians.forEach((t) => { const o = document.createElement("option"); o.value = t; o.textContent = t; $("f-technician").appendChild(o); });
          d.salesPeople.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; $("f-sales").appendChild(o); });
        } catch (e) { /* non-fatal */ }
      }
      async function load() {
        const qs = new URLSearchParams(filters()).toString();
        $("rows").innerHTML = `<tr><td colspan="10" class="text-center text-slate-400 py-8">Loading…</td></tr>`;
        try {
          const res = await window.FINEMARK_APP.apiFetch(`/archive/speed-governors?${qs}`);
          const rows = res.data || res;
          if (!rows.length) { $("rows").innerHTML = `<tr><td colspan="10" class="text-center text-slate-400 py-8">No records found matching the criteria.</td></tr>`; return; }
          $("rows").innerHTML = rows.map((r, i) => `
            <tr>
              <td class="py-2 px-3">${i + 1}</td>
              <td class="py-2 px-3">${ArchiveCommon.fmtDate(r.installationDate)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.clientName)}</td>
              <td class="py-2 px-3 font-mono">${ArchiveCommon.escapeHtml(r.contact)}</td>
              <td class="py-2 px-3 font-mono uppercase">${ArchiveCommon.escapeHtml(r.regNo)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.model)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.deviceType)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.technician)}</td>
              <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.salesPerson)}</td>
              <td class="py-2 px-3 max-w-xs truncate" title="${ArchiveCommon.escapeHtml(r.comments)}">${ArchiveCommon.escapeHtml(r.comments)}</td>
            </tr>`).join("");
        } catch (e) {
          $("rows").innerHTML = `<tr><td colspan="10" class="text-center text-rose-600 py-8">${ArchiveCommon.escapeHtml(e.message)}</td></tr>`;
        }
      }
      function init() {
        loadMeta();
        load();
        $("search").addEventListener("click", load);
        $("reset").addEventListener("click", () => { document.querySelectorAll("input, select").forEach((el) => { if (el.tagName === "SELECT") el.selectedIndex = 0; else el.value = ""; }); load(); });
      }
    </script>
  </body>
</html>
