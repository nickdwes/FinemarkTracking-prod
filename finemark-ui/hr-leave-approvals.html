<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Leave Approvals</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">

          <div>
            <nav class="text-xs text-slate-400 mb-1">
              <a href="hr-dashboard.html" class="hover:text-teal-600">HR</a> / Leave / Approvals
            </nav>
            <h1 class="text-2xl font-semibold text-slate-900">Leave Approvals</h1>
          </div>

          <!-- Tabs -->
          <div class="flex gap-1 border-b border-slate-200">
            <button data-tab="pending" class="tab-btn px-4 py-2 text-sm font-medium text-teal-600 border-b-2 border-teal-500">
              Pending <span id="pending-count" class="ml-1 inline-flex items-center justify-center h-4 w-4 rounded-full bg-amber-100 text-amber-700 text-xs font-medium">0</span>
            </button>
            <button data-tab="all" class="tab-btn px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent">All Applications</button>
          </div>

          <!-- PENDING TAB -->
          <div id="tab-pending" class="tab-panel space-y-3" ></div>

          <!-- ALL TAB -->
          <div id="tab-all" class="tab-panel hidden space-y-4">
            <div class="flex flex-wrap gap-3">
              <input id="search-emp" type="text" placeholder="Search employee…" class="border border-slate-200 rounded-lg px-3 py-2 text-sm w-44 focus:ring-2 focus:ring-teal-500 focus:outline-none" />
              <select id="filter-status" class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Cancelled">Cancelled</option>
              </select>
              <input id="filter-from" type="date" class="border border-slate-200 rounded-lg px-3 py-2 text-sm" />
              <input id="filter-to" type="date" class="border border-slate-200 rounded-lg px-3 py-2 text-sm" />
              <button onclick="loadAll()" class="px-4 py-2 bg-slate-100 text-sm text-slate-700 rounded-lg hover:bg-slate-200">Filter</button>
            </div>
            <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-slate-100">
                    <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Employee</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Leave Type</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Dates</th>
                    <th class="text-center px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Days</th>
                    <th class="text-center px-5 py-3 text-xs font-semibold uppercase tracking-wide text-slate-400">Status</th>
                    <th class="px-5 py-3"></th>
                  </tr>
                </thead>
                <tbody id="all-tbody" class="divide-y divide-slate-50"></tbody>
              </table>
              <p id="all-empty" class="hidden py-10 text-center text-sm text-slate-400">No applications found.</p>
            </div>
          </div>

        </div>
      </main>
    </div>
    <div id="fm-footer"></div>

    <!-- Approve/Reject Modal -->
    <div id="action-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 id="action-modal-title" class="text-base font-semibold text-slate-800">Review Leave Application</h3>
          <button onclick="closeActionModal()" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <div id="action-app-summary" class="px-6 py-4 bg-slate-50 text-sm space-y-1"></div>
        <form id="action-form" class="px-6 py-5 space-y-4">
          <input type="hidden" id="action-app-id" />
          <input type="hidden" id="action-type" />
          <div id="rejection-reason-row" class="hidden">
            <label class="block text-xs font-medium text-slate-600 mb-1">Rejection Reason *</label>
            <textarea id="rejection-reason" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Notes (optional)</label>
            <textarea id="action-notes" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none"></textarea>
          </div>
          <div id="action-error" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2"></div>
          <div class="flex justify-end gap-3">
            <button type="button" onclick="closeActionModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-200 text-slate-600">Cancel</button>
            <button type="submit" id="action-submit-btn" class="px-4 py-2 text-sm rounded-lg text-white">Confirm</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Override Modal (Admin) -->
    <div id="override-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 class="text-base font-semibold text-slate-800">HR Override</h3>
          <button onclick="document.getElementById('override-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <form id="override-form" class="px-6 py-5 space-y-4">
          <input type="hidden" id="override-app-id" />
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Action *</label>
            <select id="override-action" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
              <option value="Approved">Force Approve</option>
              <option value="Rejected">Force Reject</option>
              <option value="Cancelled">Cancel</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Notes</label>
            <textarea id="override-notes" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none"></textarea>
          </div>
          <div id="override-error" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2"></div>
          <div class="flex justify-end gap-3">
            <button type="button" onclick="document.getElementById('override-modal').classList.add('hidden')" class="px-4 py-2 text-sm rounded-lg border border-slate-200 text-slate-600">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-amber-600 text-white hover:bg-amber-700">Apply Override</button>
          </div>
        </form>
      </div>
    </div>

    <script src="assets/app.js?v=202607011016"></script>
    <script src="assets/layout.js?v=202607011016"></script>
    <script>
      let isAdmin = false;
      const STATUS_COLOR = { Pending: "bg-amber-50 text-amber-700 border-amber-200", Approved: "bg-emerald-50 text-emerald-700 border-emerald-200", Rejected: "bg-rose-50 text-rose-700 border-rose-200", Cancelled: "bg-slate-100 text-slate-500 border-slate-200" };

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => { b.classList.remove("text-teal-600","border-teal-500"); b.classList.add("text-slate-500","border-transparent"); });
          btn.classList.add("text-teal-600","border-teal-500"); btn.classList.remove("text-slate-500","border-transparent");
          document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
          document.getElementById("tab-"+btn.dataset.tab).classList.remove("hidden");
        });
      });

      const loadPending = async () => {
        const { data } = await window.FINEMARK_APP.apiFetch("/hr/leave/reports/pending-approvals");
        const items = data || [];
        document.getElementById("pending-count").textContent = items.length;
        const el = document.getElementById("tab-pending");
        if (!items.length) { el.innerHTML = `<div class="bg-white border border-slate-200/80 rounded-2xl p-10 text-center text-sm text-slate-400 shadow-sm">No pending applications.</div>`; return; }
        el.innerHTML = items.map(a => `
          <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm p-5 flex flex-wrap items-start gap-4">
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <p class="text-sm font-semibold text-slate-900">${a.employee_name}</p>
                <span class="text-xs text-slate-400">${a.employee_no}</span>
                <span class="text-xs text-slate-400">· ${a.org_unit_name||""}</span>
              </div>
              <p class="text-sm text-slate-700 mb-1"><span class="font-medium">${a.leave_type_name}</span> · ${a.start_date} → ${a.end_date} · <strong>${a.total_days} days</strong></p>
              ${a.reason ? `<p class="text-xs text-slate-500 line-clamp-2">${a.reason}</p>` : ""}
              <p class="text-xs text-slate-400 mt-1">Applied: ${a.applied_date}</p>
            </div>
            <div class="flex flex-wrap gap-2 items-start">
              <button onclick="openAction('${a.id}','Approved',${JSON.stringify(a).replace(/"/g,"&quot;")})" class="px-3 py-1.5 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg hover:bg-emerald-100">Approve</button>
              <button onclick="openAction('${a.id}','Rejected',${JSON.stringify(a).replace(/"/g,"&quot;")})" class="px-3 py-1.5 text-xs bg-rose-50 text-rose-700 border border-rose-200 rounded-lg hover:bg-rose-100">Reject</button>
              ${isAdmin ? `<button onclick="openOverride('${a.id}')" class="px-3 py-1.5 text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg hover:bg-amber-100">Override</button>` : ""}
            </div>
          </div>`).join("");
      };

      const loadAll = async () => {
        const q = new URLSearchParams({ limit: "100" });
        const emp = document.getElementById("search-emp").value.trim();
        const status = document.getElementById("filter-status").value;
        const from = document.getElementById("filter-from").value;
        const to = document.getElementById("filter-to").value;
        if (status) q.set("status", status);
        if (from) q.set("from", from);
        if (to) q.set("to", to);
        const { data } = await window.FINEMARK_APP.apiFetch(`/hr/leave/applications?${q}`);
        let rows = data?.applications || data || [];
        if (emp) rows = rows.filter(r => (r.employee_name||"").toLowerCase().includes(emp.toLowerCase()));
        const tbody = document.getElementById("all-tbody");
        const empty = document.getElementById("all-empty");
        if (!rows.length) { tbody.innerHTML=""; empty.classList.remove("hidden"); return; }
        empty.classList.add("hidden");
        tbody.innerHTML = rows.map(a => `
          <tr class="hover:bg-slate-50">
            <td class="px-5 py-3"><p class="font-medium text-slate-800">${a.employee_name}</p><p class="text-xs text-slate-400">${a.employee_no}</p></td>
            <td class="px-5 py-3 text-slate-600">${a.leave_type_name}</td>
            <td class="px-5 py-3 text-slate-600">${a.start_date} → ${a.end_date}</td>
            <td class="px-5 py-3 text-center font-medium">${a.total_days}</td>
            <td class="px-5 py-3 text-center"><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${STATUS_COLOR[a.status]||''}">${a.status}</span></td>
            <td class="px-5 py-3 text-right flex justify-end gap-2">
              ${a.status==="Pending" ? `<button onclick="openAction('${a.id}','Approved',null)" class="text-xs text-emerald-600 hover:underline">Approve</button><button onclick="openAction('${a.id}','Rejected',null)" class="text-xs text-rose-500 hover:underline">Reject</button>` : ""}
              ${isAdmin&&a.status!=="Cancelled" ? `<button onclick="openOverride('${a.id}')" class="text-xs text-amber-600 hover:underline">Override</button>` : ""}
            </td>
          </tr>`).join("");
      };

      const openAction = (id, action, appData) => {
        document.getElementById("action-app-id").value = id;
        document.getElementById("action-type").value = action;
        document.getElementById("action-modal-title").textContent = action === "Approved" ? "Approve Leave Application" : "Reject Leave Application";
        const btn = document.getElementById("action-submit-btn");
        btn.textContent = action === "Approved" ? "Approve" : "Reject";
        btn.className = `px-4 py-2 text-sm rounded-lg text-white ${action==="Approved"?"bg-emerald-600 hover:bg-emerald-700":"bg-rose-600 hover:bg-rose-700"}`;
        document.getElementById("rejection-reason-row").classList.toggle("hidden", action !== "Rejected");
        document.getElementById("action-notes").value = "";
        document.getElementById("rejection-reason").value = "";
        document.getElementById("action-error").classList.add("hidden");
        if (appData) {
          document.getElementById("action-app-summary").innerHTML = `
            <p><strong>${appData.employee_name}</strong> (${appData.employee_no})</p>
            <p>${appData.leave_type_name} · ${appData.start_date} → ${appData.end_date} · ${appData.total_days} days</p>
            ${appData.reason ? `<p class="text-slate-500">${appData.reason}</p>` : ""}`;
        } else { document.getElementById("action-app-summary").innerHTML = ""; }
        document.getElementById("action-modal").classList.remove("hidden");
      };
      const closeActionModal = () => document.getElementById("action-modal").classList.add("hidden");

      document.getElementById("action-form").onsubmit = async e => {
        e.preventDefault();
        const errEl = document.getElementById("action-error"); errEl.classList.add("hidden");
        const id = document.getElementById("action-app-id").value;
        const action = document.getElementById("action-type").value;
        const body = {
          action,
          notes: document.getElementById("action-notes").value.trim() || undefined,
          rejectionReason: action === "Rejected" ? document.getElementById("rejection-reason").value.trim() : undefined,
        };
        try {
          await window.FINEMARK_APP.apiFetch(`/hr/leave/applications/${id}/approve`, { method: "POST", body });
          closeActionModal();
          await Promise.all([loadPending(), loadAll()]);
        } catch (err) { errEl.textContent = err?.message || "Action failed"; errEl.classList.remove("hidden"); }
      };

      const openOverride = id => {
        document.getElementById("override-app-id").value = id;
        document.getElementById("override-notes").value = "";
        document.getElementById("override-error").classList.add("hidden");
        document.getElementById("override-modal").classList.remove("hidden");
      };
      document.getElementById("override-form").onsubmit = async e => {
        e.preventDefault();
        const errEl = document.getElementById("override-error"); errEl.classList.add("hidden");
        const id = document.getElementById("override-app-id").value;
        try {
          await window.FINEMARK_APP.apiFetch(`/hr/leave/applications/${id}/override`, {
            method: "POST",
            body: { action: document.getElementById("override-action").value, notes: document.getElementById("override-notes").value.trim() || undefined },
          });
          document.getElementById("override-modal").classList.add("hidden");
          await Promise.all([loadPending(), loadAll()]);
        } catch (err) { errEl.textContent = err?.message || "Override failed"; errEl.classList.remove("hidden"); }
      };

      (async () => {
        await window.FINEMARK_APP.requirePageAccess();
        isAdmin = window.FINEMARK_APP.getSession()?.user?.role === "Admin";
        await Promise.all([loadPending(), loadAll()]);
      })();
    </script>
  </body>
</html>
