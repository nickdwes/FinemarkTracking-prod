<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Gadget Batches Report</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-6">

          <div class="max-w-6xl mx-auto space-y-6">
            <div class="flex flex-wrap items-center gap-3 justify-between">
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Reports</p>
                <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Gadget Batches</h1>
                <p class="text-sm text-slate-600">Inventory overview by batch.</p>
              </div>
              <a href="admin.html" class="text-sm text-blue-600 hover:underline">← Back to Admin</a>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm shadow-slate-200/60">
              <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3 items-center">
                  <select id="range-filter" class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40">
                    <option value="today">Today</option>
                    <option value="weekly" selected>Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                  </select>
                  <input id="search-input" type="search" placeholder="Search batch, model, status" class="w-64 max-w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40" />
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <button id="export-csv" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Export CSV</button>
                  <button id="export-pdf" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Export PDF</button>
                  <span id="result-count" class="text-xs text-slate-500">0 results</span>
                </div>
              </div>

              <div class="mt-4 overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="text-xs uppercase text-slate-500 border-b border-slate-200">
                    <tr>
                      <th class="py-2 px-3 text-left font-semibold">Batch ID</th>
                      <th class="py-2 px-3 text-left font-semibold">Model</th>
                      <th class="py-2 px-3 text-left font-semibold">Quantity</th>
                      <th class="py-2 px-3 text-left font-semibold">Status</th>
                      <th class="py-2 px-3 text-left font-semibold">Date</th>
                    </tr>
                  </thead>
                  <tbody id="report-rows" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
              </div>
              <p id="empty-state" class="hidden text-sm text-slate-500 py-6 text-center">No records found for this filter.</p>
            </div>
          </div>
        
  </main>
</div>
<div id="fm-footer"></div>
</body>
</html>
