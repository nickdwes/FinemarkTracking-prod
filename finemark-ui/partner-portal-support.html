<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner Portal – Support</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">

    <!-- Portal Nav -->
    <header class="fixed top-0 inset-x-0 z-40 bg-white border-b border-slate-200/80 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-900">Partner Portal</p>
            <p id="partner-name" class="text-xs text-slate-500">Finemark Tracking Systems</p>
          </div>
        </div>
        <nav class="hidden md:flex items-center gap-1">
          <a href="partner-portal-dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Dashboard</a>
          <a href="partner-portal-vehicles.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Vehicles</a>
          <a href="partner-portal-support.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">Support</a>
          <a href="partner-portal-settings.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Settings</a>
        </nav>
        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <p id="user-name" class="text-xs font-medium text-slate-700">—</p>
            <p id="user-role" class="text-xs text-slate-400">—</p>
          </div>
          <button id="btn-logout" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100 transition">Sign out</button>
        </div>
      </div>
    </header>

    <main class="pt-20 pb-10 px-4">
      <div class="max-w-5xl mx-auto space-y-6">

        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-semibold text-slate-900">Support Tickets</h1>
            <p class="text-sm text-slate-500 mt-0.5">Raise and track support requests with Finemark.</p>
          </div>
          <button id="btn-new-ticket" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">+ New Ticket</button>
        </div>

        <!-- Tickets -->
        <div class="bg-white border border-slate-200/80 rounded-xl shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-widest border-b border-slate-100">
                  <th class="pb-3 pt-4 pl-6 pr-4">Ticket No</th>
                  <th class="pb-3 pr-4">Subject</th>
                  <th class="pb-3 pr-4">Category</th>
                  <th class="pb-3 pr-4">Priority</th>
                  <th class="pb-3 pr-4">Status</th>
                  <th class="pb-3 pr-6">Opened</th>
                </tr>
              </thead>
              <tbody id="tickets-tbody">
                <tr><td colspan="6" class="py-8 text-center text-slate-400 pl-6">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <!-- New Ticket Modal -->
    <div id="ticket-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="flex items-center justify-between p-6 border-b border-slate-100">
          <h2 class="text-lg font-semibold text-slate-900">Raise a Support Ticket</h2>
          <button onclick="document.getElementById('ticket-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-1 rounded hover:bg-slate-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="ticket-form" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Subject *</label>
            <input id="t-subject" type="text" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="Brief description of the issue" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Category *</label>
              <select id="t-category" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus:outline-none focus:border-blue-500">
                <option value="">Select…</option>
                <option>Device Fault</option>
                <option>Installation Issue</option>
                <option>Portal Access</option>
                <option>Billing Dispute</option>
                <option>General Enquiry</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Priority</label>
              <select id="t-priority" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus:outline-none focus:border-blue-500">
                <option>Normal</option>
                <option>High</option>
                <option>Urgent</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Device IMEI</label>
              <input id="t-imei" type="text" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="Optional" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Vehicle Registration</label>
              <input id="t-reg" type="text" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 uppercase" placeholder="Optional" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Description *</label>
            <textarea id="t-desc" rows="4" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 resize-none" placeholder="Describe the issue in detail…"></textarea>
          </div>
          <div id="t-error" class="hidden rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-700"></div>
          <div id="t-success" class="hidden rounded-lg bg-green-50 border border-green-200 p-3 text-sm text-green-700"></div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" onclick="document.getElementById('ticket-modal').classList.add('hidden')" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
            <button type="submit" id="t-save" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-700">Submit Ticket</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API = "/api";

      function getSession() {
        try {
          const s = JSON.parse(localStorage.getItem("finemark_partner_session") || "null");
          if (!s?.accessToken || new Date(s.expiresAt) <= new Date()) { localStorage.removeItem("finemark_partner_session"); return null; }
          return s;
        } catch (_) { return null; }
      }

      async function portalFetch(path, opts = {}) {
        const session = getSession();
        if (!session) { location.href = "partner-portal-login.html"; throw new Error("No session"); }
        const r = await fetch(`${API}/partner-portal${path}`, {
          ...opts,
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.accessToken}`, ...(opts.headers || {}) },
        });
        const data = await r.json();
        if (r.status === 401) { localStorage.removeItem("finemark_partner_session"); location.href = "partner-portal-login.html"; }
        if (!r.ok) throw new Error(data.message || "Request failed");
        return data;
      }

      const STATUS_STYLE = {
        Open: "bg-blue-50 text-blue-700 border-blue-200",
        Assigned: "bg-indigo-50 text-indigo-700 border-indigo-200",
        InProgress: "bg-amber-50 text-amber-700 border-amber-200",
        Resolved: "bg-green-50 text-green-700 border-green-200",
        Closed: "bg-slate-100 text-slate-500 border-slate-200",
      };

      const PRIORITY_STYLE = {
        Normal: "text-slate-500",
        High: "text-orange-600 font-semibold",
        Urgent: "text-red-600 font-bold",
      };

      async function loadTickets() {
        document.getElementById("tickets-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 pl-6">Loading…</td></tr>`;
        try {
          const d = await portalFetch("/tickets");
          const tickets = d.data || d;
          if (!tickets.length) {
            document.getElementById("tickets-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 pl-6">No support tickets yet.</td></tr>`;
            return;
          }
          document.getElementById("tickets-tbody").innerHTML = tickets.map(t => {
            const statusCls = STATUS_STYLE[t.status] || "bg-slate-100 text-slate-600 border-slate-200";
            const priCls = PRIORITY_STYLE[t.priority] || "text-slate-500";
            return `
              <tr class="hover:bg-slate-50/60 transition-colors border-b border-slate-50">
                <td class="py-3 pr-4 pl-6 font-mono text-xs font-semibold text-slate-700">${t.ticketNo || "—"}</td>
                <td class="py-3 pr-4 text-slate-900 max-w-xs truncate">${t.subject}</td>
                <td class="py-3 pr-4 text-xs text-slate-500">${t.category || "—"}</td>
                <td class="py-3 pr-4 text-xs ${priCls}">${t.priority}</td>
                <td class="py-3 pr-4"><span class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold border ${statusCls}">${t.status}</span></td>
                <td class="py-3 pr-6 text-xs text-slate-500">${t.openedAt ? new Date(t.openedAt).toLocaleDateString() : "—"}</td>
              </tr>`;
          }).join("");
        } catch (e) {
          document.getElementById("tickets-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500 pl-6">Failed to load tickets.</td></tr>`;
        }
      }

      document.getElementById("btn-new-ticket").addEventListener("click", () => {
        document.getElementById("ticket-form").reset();
        document.getElementById("t-error").classList.add("hidden");
        document.getElementById("t-success").classList.add("hidden");
        document.getElementById("ticket-modal").classList.remove("hidden");
      });

      document.getElementById("ticket-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errEl = document.getElementById("t-error");
        const okEl = document.getElementById("t-success");
        errEl.classList.add("hidden");
        okEl.classList.add("hidden");
        const btn = document.getElementById("t-save");
        btn.disabled = true; btn.textContent = "Submitting…";

        try {
          const body = {
            subject: document.getElementById("t-subject").value.trim(),
            category: document.getElementById("t-category").value,
            priority: document.getElementById("t-priority").value,
            description: document.getElementById("t-desc").value.trim(),
            deviceImei: document.getElementById("t-imei").value.trim() || null,
            vehicleRegistration: document.getElementById("t-reg").value.trim().toUpperCase() || null,
          };
          if (!body.category) { throw new Error("Please select a category."); }
          const d = await portalFetch("/tickets", { method: "POST", body: JSON.stringify(body) });
          const td = d.data || d;
          okEl.textContent = `Ticket ${td.ticketNo} submitted successfully. Our team will be in touch.`;
          okEl.classList.remove("hidden");
          document.getElementById("ticket-form").reset();
          setTimeout(() => { document.getElementById("ticket-modal").classList.add("hidden"); loadTickets(); }, 3000);
        } catch (err) {
          errEl.textContent = err.message || "Failed to submit ticket.";
          errEl.classList.remove("hidden");
        } finally {
          btn.disabled = false; btn.textContent = "Submit Ticket";
        }
      });

      function init() {
        const session = getSession();
        if (!session) { location.href = "partner-portal-login.html"; return; }
        document.getElementById("partner-name").textContent = session.user?.partnerName || "Partner";
        document.getElementById("user-name").textContent = session.user?.fullName || session.user?.email;
        document.getElementById("user-role").textContent = session.user?.role;
        document.getElementById("btn-logout").addEventListener("click", async () => {
          try { await portalFetch("/auth/logout", { method: "POST" }); } catch (_) {}
          localStorage.removeItem("finemark_partner_session");
          location.href = "partner-portal-login.html";
        });
        loadTickets();
      }

      init();
    </script>
  </body>
</html>
