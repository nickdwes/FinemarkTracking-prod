<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Dashboard - Finemark</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-7xl mx-auto space-y-6">

          <!-- Header -->
          <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h1 class="text-2xl font-semibold text-slate-900">Invoice Dashboard</h1>
                <p class="mt-1 text-sm text-slate-500">View, preview, download, and email invoices.</p>
              </div>
              <div class="flex items-center gap-2">
                <button id="export-csv" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Export CSV</button>
              </div>
            </div>
          </div>

          <!-- Summary Stats -->
          <div id="stats-row" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wide">Total Invoices</p>
              <p id="stat-total" class="mt-1 text-2xl font-bold text-slate-900">—</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wide">Total Value (KES)</p>
              <p id="stat-value" class="mt-1 text-2xl font-bold text-slate-900">—</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
              <p class="text-xs font-medium text-green-600 uppercase tracking-wide">Paid</p>
              <p id="stat-paid" class="mt-1 text-2xl font-bold text-green-600">—</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm text-center">
              <p class="text-xs font-medium text-amber-600 uppercase tracking-wide">Unpaid / Pending</p>
              <p id="stat-unpaid" class="mt-1 text-2xl font-bold text-amber-600">—</p>
            </div>
          </div>

          <!-- Filters -->
          <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
            <div class="grid gap-3 md:grid-cols-6">
              <div class="md:col-span-2">
                <label class="text-xs font-semibold text-slate-600">Search</label>
                <input id="filter-search" type="text" placeholder="Invoice no, customer, rep..." class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600">Status</label>
                <select id="filter-status" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                  <option value="">All</option>
                  <option value="Paid">Paid</option>
                  <option value="Unpaid">Unpaid</option>
                  <option value="Partial">Partial</option>
                  <option value="Overdue">Overdue</option>
                </select>
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600">Start Date</label>
                <input id="filter-start" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600">End Date</label>
                <input id="filter-end" type="date" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600">Rep</label>
                <input id="filter-rep" type="text" placeholder="Sales rep name" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <button id="btn-apply" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Apply Filters</button>
              <button id="btn-reset" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Reset</button>
              <span id="result-count" class="text-xs text-slate-500"></span>
            </div>
          </div>

          <!-- Table -->
          <div class="bg-white border border-slate-200 rounded-xl shadow-sm">
            <div id="tbl-skeleton" class="p-10 text-center text-sm text-slate-400">Loading invoices…</div>
            <div id="tbl-empty" class="hidden p-10 text-center text-sm text-slate-500">No invoices found.</div>
            <div id="tbl-error" class="hidden p-10 text-center text-sm text-red-500"></div>
            <div id="tbl-wrap" class="hidden overflow-x-auto">
              <table class="w-full min-w-[900px] text-sm">
                <thead class="border-b border-slate-100 text-left text-xs text-slate-500 uppercase tracking-wide">
                  <tr>
                    <th class="px-4 py-3">Date</th>
                    <th class="px-4 py-3">Invoice No</th>
                    <th class="px-4 py-3">Customer</th>
                    <th class="px-4 py-3">Rep</th>
                    <th class="px-4 py-3">Subtotal</th>
                    <th class="px-4 py-3">VAT</th>
                    <th class="px-4 py-3">Total</th>
                    <th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="invoice-tbody" class="divide-y divide-slate-100"></tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <div id="fm-toast-root"></div>

    <!-- Preview Modal -->
    <div id="modal-preview" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 px-4">
      <div class="w-full max-w-5xl rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3">
          <div>
            <p id="preview-title" class="text-sm font-semibold text-slate-900">Invoice Preview</p>
            <p id="preview-subtitle" class="text-xs text-slate-500"></p>
          </div>
          <button id="preview-close" class="rounded-lg border border-slate-200 px-3 py-1 text-xs text-slate-600 hover:bg-slate-50">Close</button>
        </div>
        <div class="grid gap-4 p-5 md:grid-cols-[1fr_200px]">
          <iframe id="preview-frame" class="h-[70vh] w-full rounded-lg border border-slate-200 bg-white" title="Invoice preview"></iframe>
          <div class="space-y-2">
            <button id="preview-download" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800">Download</button>
            <button id="preview-print" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Print</button>
            <button id="preview-email-btn" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Send Email</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Email Modal -->
    <div id="modal-email" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 px-4">
      <div class="w-full max-w-md rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3">
          <p class="text-sm font-semibold text-slate-900">Send Invoice</p>
          <button id="email-close" class="rounded-lg border border-slate-200 px-3 py-1 text-xs text-slate-600 hover:bg-slate-50">Close</button>
        </div>
        <div class="p-5 space-y-3">
          <div>
            <label class="text-xs font-semibold text-slate-600">To Email</label>
            <input id="email-to" type="email" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Subject</label>
            <input id="email-subject" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600">Message</label>
            <textarea id="email-message" rows="4" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
          </div>
          <p id="email-error" class="hidden text-xs text-red-600"></p>
          <div class="flex justify-end gap-2">
            <button id="email-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
            <button id="email-send" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/app.js?v=202607011016"></script>
    <script src="assets/layout.js?v=202607011016"></script>
    <script>
      const APP = window.FINEMARK_APP;
      if (!APP) { document.body.innerHTML = "<p class='p-10 text-center text-red-600'>App failed to load.</p>"; }
      APP?.requirePageAccess?.();

      const $ = id => document.getElementById(id);
      const api = APP?.apiFetch;
      const formatKes = n => Number(n || 0).toLocaleString("en-KE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const formatDate = v => { if (!v) return "—"; try { return new Date(v).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); } catch { return v; } };

      const STATUS_PILL = {
        Paid:    "bg-green-50 text-green-700 border-green-200",
        Unpaid:  "bg-amber-50 text-amber-700 border-amber-200",
        Partial: "bg-blue-50 text-blue-700 border-blue-200",
        Overdue: "bg-red-50 text-red-700 border-red-200",
      };
      function statusBadge(s) {
        const cls = STATUS_PILL[s] || "bg-slate-100 text-slate-600 border-slate-200";
        return `<span class="inline-block rounded-full border px-2 py-0.5 text-xs font-semibold ${cls}">${s || "—"}</span>`;
      }

      let items = [], activeId = null, activeItem = null;

      const getToken = () => APP.getSession?.()?.accessToken || "";
      const pdfUrl = (id, disposition = "") => {
        const base = `${APP.CONFIG.API_BASE_URL}/invoices/${id}/pdf`;
        const p = new URLSearchParams({ token: getToken() });
        if (disposition) p.set("disposition", disposition);
        return `${base}?${p}`;
      };

      async function load() {
        $("tbl-skeleton").classList.remove("hidden");
        $("tbl-wrap").classList.add("hidden");
        $("tbl-empty").classList.add("hidden");
        $("tbl-error").classList.add("hidden");

        const p = new URLSearchParams({ page: "1", pageSize: "200" });
        const q = $("filter-search").value.trim();
        const status = $("filter-status").value;
        const start = $("filter-start").value;
        const end = $("filter-end").value;
        const rep = $("filter-rep").value.trim();
        if (q)      p.set("search", q);
        if (status) p.set("status", status);
        if (start)  p.set("startDate", start);
        if (end)    p.set("endDate", end);
        if (rep)    p.set("rep", rep);

        try {
          const r = await api(`/invoices?${p}`);
          items = r?.data || [];
          $("tbl-skeleton").classList.add("hidden");

          // Stats
          const total = items.length;
          const totalVal = items.reduce((s, i) => s + Number(i.total ?? i.amount ?? 0), 0);
          const paid = items.filter(i => (i.status || "").toLowerCase() === "paid").length;
          const unpaid = items.filter(i => ["unpaid","partial","overdue"].includes((i.status||"").toLowerCase())).length;
          $("stat-total").textContent = total;
          $("stat-value").textContent = formatKes(totalVal);
          $("stat-paid").textContent = paid;
          $("stat-unpaid").textContent = unpaid;
          $("result-count").textContent = `${total} invoice${total !== 1 ? "s" : ""}`;

          if (!items.length) { $("tbl-empty").classList.remove("hidden"); return; }

          $("invoice-tbody").innerHTML = items.map(inv => `
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-2 text-xs text-slate-500">${formatDate(inv.taxDate || inv.issuedOn)}</td>
              <td class="px-4 py-2 font-mono font-semibold text-slate-800">${inv.invoiceNumber || "—"}</td>
              <td class="px-4 py-2">${inv.customerId
                ? `<a href="crm-customer-360.html?id=${inv.customerId}" class="text-blue-600 hover:underline font-medium">${inv.customer || "—"}</a>`
                : (inv.customer || "—")}</td>
              <td class="px-4 py-2 text-slate-500 text-xs">${inv.representative || inv.salesPerson || "—"}</td>
              <td class="px-4 py-2 text-right text-xs">${formatKes(inv.subtotal ?? inv.amount)}</td>
              <td class="px-4 py-2 text-right text-xs">${formatKes(inv.vatTotal ?? 0)}</td>
              <td class="px-4 py-2 text-right font-semibold">${formatKes(inv.total ?? inv.amount)}</td>
              <td class="px-4 py-2">${statusBadge(inv.status)}</td>
              <td class="px-4 py-2 text-right whitespace-nowrap">
                <button data-action="preview" data-id="${inv.id}" class="text-blue-600 hover:underline text-xs">Preview</button>
                <span class="mx-1 text-slate-300">|</span>
                <button data-action="download" data-id="${inv.id}" class="text-blue-600 hover:underline text-xs">Download</button>
                <span class="mx-1 text-slate-300">|</span>
                <button data-action="email" data-id="${inv.id}" class="text-blue-600 hover:underline text-xs">Email</button>
              </td>
            </tr>
          `).join("");
          $("tbl-wrap").classList.remove("hidden");
        } catch(e) {
          $("tbl-skeleton").classList.add("hidden");
          $("tbl-error").textContent = e.message || "Failed to load invoices.";
          $("tbl-error").classList.remove("hidden");
        }
      }

      // Table actions
      $("invoice-tbody").addEventListener("click", e => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const { action, id } = btn.dataset;
        activeId = id;
        activeItem = items.find(i => i.id === id) || null;
        if (action === "preview") openPreview();
        if (action === "download") window.open(pdfUrl(id, "attachment"), "_blank");
        if (action === "email") openEmail();
      });

      // Preview
      function openPreview() {
        $("preview-title").textContent = activeItem ? `Invoice ${activeItem.invoiceNumber}` : "Invoice Preview";
        $("preview-subtitle").textContent = activeItem?.customer || "";
        $("preview-frame").src = pdfUrl(activeId);
        $("modal-preview").classList.remove("hidden");
        $("modal-preview").classList.add("flex");
      }
      $("preview-close").addEventListener("click", () => {
        $("modal-preview").classList.add("hidden");
        $("modal-preview").classList.remove("flex");
        $("preview-frame").src = "";
      });
      $("preview-download").addEventListener("click", () => activeId && window.open(pdfUrl(activeId, "attachment"), "_blank"));
      $("preview-print").addEventListener("click", () => {
        if (!activeId) return;
        const w = window.open(pdfUrl(activeId), "_blank");
        if (w) w.addEventListener("load", () => w.print());
      });
      $("preview-email-btn").addEventListener("click", () => {
        $("modal-preview").classList.add("hidden");
        $("modal-preview").classList.remove("flex");
        openEmail();
      });

      // Email
      function openEmail() {
        $("email-to").value = "";
        $("email-subject").value = activeItem ? `Invoice ${activeItem.invoiceNumber} – ${activeItem.customer}` : "";
        $("email-message").value = activeItem ? `Please find attached invoice ${activeItem.invoiceNumber}.` : "";
        $("email-error").classList.add("hidden");
        $("modal-email").classList.remove("hidden");
        $("modal-email").classList.add("flex");
      }
      function closeEmail() {
        $("modal-email").classList.add("hidden");
        $("modal-email").classList.remove("flex");
      }
      $("email-close").addEventListener("click", closeEmail);
      $("email-cancel").addEventListener("click", closeEmail);
      $("email-send").addEventListener("click", async () => {
        const toEmail = $("email-to").value.trim();
        if (!toEmail) { $("email-error").textContent = "Recipient email required."; $("email-error").classList.remove("hidden"); return; }
        $("email-send").textContent = "Sending…"; $("email-send").disabled = true;
        try {
          await api(`/invoices/${activeId}/email`, {
            method: "POST",
            body: { toEmail, subject: $("email-subject").value.trim(), message: $("email-message").value.trim() },
          });
          closeEmail();
          APP.showToast("Email sent successfully.", "success");
        } catch(e) {
          $("email-error").textContent = e.message || "Failed to send.";
          $("email-error").classList.remove("hidden");
        } finally {
          $("email-send").textContent = "Send"; $("email-send").disabled = false;
        }
      });

      // CSV export
      $("export-csv").addEventListener("click", () => {
        const header = ["Date","Invoice No","Customer","Rep","Subtotal","VAT","Total","Status"];
        const rows = items.map(i => [
          i.taxDate || i.issuedOn, i.invoiceNumber, i.customer,
          i.representative || i.salesPerson || "",
          i.subtotal ?? i.amount ?? 0, i.vatTotal ?? 0, i.total ?? i.amount ?? 0, i.status || "",
        ]);
        const csv = [header, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
        const a = Object.assign(document.createElement("a"), {
          href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })),
          download: `invoices_${new Date().toISOString().slice(0,10)}.csv`,
        });
        document.body.appendChild(a); a.click(); a.remove();
      });

      // Filters
      $("btn-apply").addEventListener("click", load);
      $("btn-reset").addEventListener("click", () => {
        ["filter-search","filter-status","filter-start","filter-end","filter-rep"].forEach(id => {
          const el = $(id);
          if (el.tagName === "SELECT") el.value = ""; else el.value = "";
        });
        load();
      });

      load();
    </script>
  </body>
</html>
