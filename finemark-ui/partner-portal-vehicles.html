<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner Portal – Vehicles</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">

    <!-- Portal Nav -->
    <header class="fixed top-0 inset-x-0 z-40 bg-white border-b border-slate-200/80 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-900">Partner Portal</p>
            <p id="partner-name" class="text-xs text-slate-500">Finemark Tracking Systems</p>
          </div>
        </div>
        <nav class="hidden md:flex items-center gap-1">
          <a href="partner-portal-dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Dashboard</a>
          <a href="partner-portal-vehicles.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-700">Vehicles</a>
          <a href="partner-portal-support.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Support</a>
          <a href="partner-portal-settings.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Settings</a>
        </nav>
        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <p id="user-name" class="text-xs font-medium text-slate-700">—</p>
            <p id="user-role" class="text-xs text-slate-400">—</p>
          </div>
          <button id="btn-logout" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100 transition">Sign out</button>
        </div>
      </div>
    </header>

    <main class="pt-20 pb-10 px-4">
      <div class="max-w-7xl mx-auto space-y-6">

        <div>
          <h1 class="text-2xl font-semibold text-slate-900">Vehicles</h1>
          <p class="text-sm text-slate-500 mt-0.5">All vehicles registered under your partnership.</p>
        </div>

        <div class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-4">
          <div class="flex flex-wrap items-end gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Search</label>
              <input id="search" type="text" placeholder="Registration, customer…" class="w-64 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
            </div>
            <button id="btn-search" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">Search</button>
            <button id="btn-clear" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 transition">Clear</button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-widest border-b border-slate-100">
                  <th class="pb-3 pr-4">Registration</th>
                  <th class="pb-3 pr-4">Make / Model</th>
                  <th class="pb-3 pr-4">Customer</th>
                  <th class="pb-3 pr-4">Loan Tenure</th>
                  <th class="pb-3 pr-4">Loan Expiry</th>
                  <th class="pb-3">Days Remaining</th>
                </tr>
              </thead>
              <tbody id="vehicles-tbody">
                <tr><td colspan="6" class="py-8 text-center text-slate-400">Loading…</td></tr>
              </tbody>
            </table>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-500">
            <span id="meta-info">—</span>
            <div class="flex gap-2">
              <button id="btn-prev" class="px-3 py-1 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40" disabled>← Prev</button>
              <button id="btn-next" class="px-3 py-1 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40" disabled>Next →</button>
            </div>
          </div>
        </div>

      </div>
    </main>

    <script>
      const API = "/api";
      let page = 1;
      const PS = 20;

      function getSession() {
        try {
          const s = JSON.parse(localStorage.getItem("finemark_partner_session") || "null");
          if (!s?.accessToken || new Date(s.expiresAt) <= new Date()) { localStorage.removeItem("finemark_partner_session"); return null; }
          return s;
        } catch (_) { return null; }
      }

      async function portalFetch(path, opts = {}) {
        const session = getSession();
        if (!session) { location.href = "partner-portal-login.html"; throw new Error("No session"); }
        const r = await fetch(`${API}/partner-portal${path}`, {
          ...opts,
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.accessToken}`, ...(opts.headers || {}) },
        });
        const data = await r.json();
        if (r.status === 401) { localStorage.removeItem("finemark_partner_session"); location.href = "partner-portal-login.html"; }
        if (!r.ok) throw new Error(data.message || "Request failed");
        return data;
      }

      function urgencyBadge(days) {
        if (days == null) return "—";
        if (days <= 0) return `<span class="inline-flex rounded-full bg-red-100 px-2 py-0.5 text-xs font-bold text-red-700">EXPIRED</span>`;
        if (days <= 7) return `<span class="inline-flex rounded-full bg-red-100 px-2 py-0.5 text-xs font-semibold text-red-700">${days}d ⚠</span>`;
        if (days <= 30) return `<span class="inline-flex rounded-full bg-orange-100 px-2 py-0.5 text-xs font-semibold text-orange-700">${days}d</span>`;
        if (days <= 90) return `<span class="inline-flex rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-700">${days}d</span>`;
        return `<span class="inline-flex rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700">${days}d</span>`;
      }

      async function loadVehicles() {
        const search = document.getElementById("search").value.trim();
        const params = new URLSearchParams({ page, pageSize: PS });
        if (search) params.set("search", search);

        document.getElementById("vehicles-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Loading…</td></tr>`;
        try {
          const d = await portalFetch(`/vehicles?${params}`);
          const { data, meta } = d;
          if (!data.length) {
            document.getElementById("vehicles-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">No vehicles found.</td></tr>`;
          } else {
            document.getElementById("vehicles-tbody").innerHTML = data.map(v => `
              <tr class="hover:bg-slate-50/60 transition-colors border-b border-slate-50">
                <td class="py-3 pr-4 font-mono text-xs font-semibold text-slate-800">${v.registration}</td>
                <td class="py-3 pr-4 text-slate-700">${v.make} ${v.model}</td>
                <td class="py-3 pr-4 text-slate-900">${v.customerName}</td>
                <td class="py-3 pr-4 text-xs text-slate-600">${v.loanTenureMonths ? v.loanTenureMonths + ' months' : '—'}</td>
                <td class="py-3 pr-4 text-xs text-slate-600">${v.loanExpiry || '—'}</td>
                <td class="py-3">${urgencyBadge(v.loanDaysLeft)}</td>
              </tr>`).join("");
          }
          const total = meta?.total ?? 0;
          document.getElementById("meta-info").textContent = `${(page-1)*PS+1}–${Math.min(page*PS, total)} of ${total}`;
          document.getElementById("btn-prev").disabled = page <= 1;
          document.getElementById("btn-next").disabled = page * PS >= total;
        } catch (e) {
          document.getElementById("vehicles-tbody").innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">Failed to load vehicles.</td></tr>`;
        }
      }

      function init() {
        const session = getSession();
        if (!session) { location.href = "partner-portal-login.html"; return; }
        document.getElementById("partner-name").textContent = session.user?.partnerName || "Partner";
        document.getElementById("user-name").textContent = session.user?.fullName || session.user?.email;
        document.getElementById("user-role").textContent = session.user?.role;
        document.getElementById("btn-logout").addEventListener("click", async () => {
          try { await portalFetch("/auth/logout", { method: "POST" }); } catch (_) {}
          localStorage.removeItem("finemark_partner_session");
          location.href = "partner-portal-login.html";
        });
        document.getElementById("btn-search").addEventListener("click", () => { page = 1; loadVehicles(); });
        document.getElementById("btn-clear").addEventListener("click", () => { document.getElementById("search").value = ""; page = 1; loadVehicles(); });
        document.getElementById("search").addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; loadVehicles(); } });
        document.getElementById("btn-prev").addEventListener("click", () => { if (page > 1) { page--; loadVehicles(); } });
        document.getElementById("btn-next").addEventListener("click", () => { page++; loadVehicles(); });
        loadVehicles();
      }

      init();
    </script>
  </body>
</html>
