<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Forgot Password</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<main class="min-h-screen flex items-center justify-center px-6 py-12">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/60 border border-slate-200/80 p-8">
          <div class="flex items-center gap-4 mb-6">
            <img src="assets/finemark-logo.svg" alt="Finemark logo" class="h-12 w-12" />
            <div>
              <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Finemark</p>
              <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Forgot your password?</h1>
              <p class="text-sm text-slate-600">Enter your email and we’ll send a reset link.</p>
            </div>
          </div>

          <form id="reset-form" class="space-y-4" novalidate>
            <div>
              <label class="block text-sm font-medium mb-1.5 text-slate-700" for="email">Email</label>
              <input id="email" type="email" placeholder="you@company.com" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-slate-900 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40 focus:border-blue-500" />
              <p class="fm-error hidden" data-error-for="email"></p>
            </div>
            <button id="send-reset" type="submit" class="w-full rounded-lg bg-blue-600 text-white py-2.5 font-medium shadow-sm shadow-blue-600/20 hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50">
              Send reset link
            </button>
            <div id="reset-inline-error" class="hidden"></div>
          </form>

          <div class="mt-6 text-sm text-slate-500">
            <a href="login.html" class="text-blue-600 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40 rounded">Back to Sign in</a>
          </div>
        </div>

        
      </div>
    </main>

    
  
<script src="assets/contracts.js"></script>
<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
      const resetForm = document.getElementById("reset-form");
      const emailInput = document.getElementById("email");
      const sendButton = document.getElementById("send-reset");
      const inlineError = document.getElementById("reset-inline-error");

      resetForm.addEventListener("submit", (event) => {
        event.preventDefault();
        window.FINEMARK_APP.clearFormErrors(resetForm);
        inlineError.classList.add("hidden");
        const emailValue = emailInput.value.trim();
        const requiredError = window.FINEMARK_APP.Validators.required(emailValue);
        const emailError = window.FINEMARK_APP.Validators.email(emailValue);
        if (requiredError) window.FINEMARK_APP.setFieldError(emailInput, requiredError);
        if (!requiredError && emailError) window.FINEMARK_APP.setFieldError(emailInput, emailError);
        if (requiredError || emailError) {
          return;
        }
        window.FINEMARK_APP.setLoading(sendButton, true, "Sending...");
        window.FINEMARK_APP.AuthService.forgotPassword({ email: emailValue })
          .then(() => {
            localStorage.setItem("resetEmail", emailValue);
            window.location.href = "reset-sent.html";
          })
          .catch((error) => {
            window.FINEMARK_APP.showToast(error.message || "Failed to send reset link", "error");
            inlineError.classList.remove("hidden");
            window.FINEMARK_APP.showInlineError(inlineError, error.message || "Failed to send reset link", {
              retryText: "Retry",
              onRetry: () => resetForm.dispatchEvent(new Event("submit")),
            });
          })
          .finally(() => {
            window.FINEMARK_APP.setLoading(sendButton, false);
          });
      });
    </script>
</body>
</html>
