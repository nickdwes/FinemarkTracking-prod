# ── Security headers for static HTML / document responses ────────────────────
# Added 2026-08-07 as part of the authorized VAPT remediation.
#
# Scope: `include`d ONLY into the HTML-serving location blocks in nginx.conf.
# It is deliberately NOT applied to /api, /public, /uploads or /customer-portal,
# because the backend (helmet) already sets its own CSP/HSTS/X-Frame-Options on
# those responses and they pass through this proxy — double-setting would produce
# conflicting policies.
#
# `always` ensures the header is emitted on error responses (401/404) too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP is shipped in REPORT-ONLY mode first: it does NOT block anything yet, it only
# reports violations to the browser console. Load every portal page (especially the
# training-video pages and any PDF preview), confirm the console shows no CSP
# violations, THEN switch the directive name below from
#   Content-Security-Policy-Report-Only
# to
#   Content-Security-Policy
# to begin enforcing. The policy already allow-lists the app's real dependencies:
#   - inline <script>/<style> and inline event handlers ('unsafe-inline')
#   - same-origin API (connect-src 'self'; API_BASE_URL is '/api')
#   - PDF previews via iframe blobs (frame-src blob:)
#   - embedded YouTube/Vimeo training videos
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
