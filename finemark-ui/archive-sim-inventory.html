<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — SIM Cards Report</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div><h1 class="text-3xl font-semibold tracking-tight text-slate-900">SIM Cards Report</h1>
              <p class="text-sm text-slate-600">Archived IDTS SIM inventory by batch — historical reference only.</p></div>
            <div id="badge-slot"></div>
          </div>
          <section class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-end gap-3">
              <div class="flex-1 min-w-[200px]"><label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Batch Name</label>
                <input id="batch" type="text" placeholder="e.g. 1, 2, or Batch-Q4" class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"/></div>
              <button id="analyze" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-medium text-white hover:bg-blue-700">Analyze Batch Inventory</button>
            </div>
          </section>
          <div id="results" class="space-y-6"></div>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;
        document.getElementById("analyze").addEventListener("click", analyze);
        document.getElementById("batch").addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
      });
      const $ = (id) => document.getElementById(id);
      async function analyze() {
        const batch = $("batch").value.trim();
        if (!batch) { window.FINEMARK_APP?.showToast?.("Enter a batch name", "warn"); return; }
        $("results").innerHTML = `<div class="text-center text-slate-400 py-8">Loading…</div>`;
        try {
          const res = await window.FINEMARK_APP.apiFetch(`/archive/sim-inventory?batch=${encodeURIComponent(batch)}`);
          const d = res.data || res;
          if (!d.totalSimsInBatch) { $("results").innerHTML = `<div class="text-center text-amber-700 bg-amber-50 border border-amber-200 rounded-lg py-8">No SIM cards found in batch "${ArchiveCommon.escapeHtml(batch)}".</div>`; return; }
          $("results").innerHTML = `
            <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div class="bg-rose-50 border border-rose-100 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-rose-600">${d.usedCount}</div><div class="text-xs text-slate-600 uppercase">Used / Active</div></div>
              <div class="bg-amber-50 border border-amber-100 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-amber-600">${d.allocatedUnusedCount}</div><div class="text-xs text-slate-600 uppercase">Allocated / Pending</div></div>
              <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-emerald-600">${d.unallocatedUnusedCount}</div><div class="text-xs text-slate-600 uppercase">Unallocated / Stock</div></div>
              <div class="bg-blue-600 rounded-xl p-4 text-center text-white"><div class="text-2xl font-bold">${d.totalSimsInBatch}</div><div class="text-xs uppercase opacity-90">Total in Batch</div></div>
            </section>
            <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-3">
              <h3 class="text-sm font-semibold text-rose-700">Used SIM Cards (${d.usedCount})</h3>
              <div class="overflow-x-auto max-h-80 overflow-y-auto"><table class="w-full text-xs min-w-[700px]">
                <thead class="text-left text-slate-500 uppercase border-b border-slate-200"><tr><th class="py-1.5">MSISDN</th><th class="py-1.5">IMSI</th><th class="py-1.5">Vehicle</th><th class="py-1.5">Source</th><th class="py-1.5">Install Date</th><th class="py-1.5">Bank/Client</th></tr></thead>
                <tbody class="divide-y divide-slate-100">${d.used.map((r) => `<tr><td class="py-1.5 font-mono font-semibold">${ArchiveCommon.escapeHtml(r.msisdn)}</td><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(r.imsi)}</td><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(r.vehicleReg)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(r.source)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(r.installDate)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(r.extra)}</td></tr>`).join("") || `<tr><td colspan="6" class="py-4 text-center text-slate-400">None</td></tr>`}</tbody>
              </table></div>
            </section>
            <div class="grid md:grid-cols-2 gap-6">
              <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-3">
                <h3 class="text-sm font-semibold text-amber-700">Allocated Unused (${d.allocatedUnusedCount})</h3>
                <div class="overflow-x-auto max-h-72 overflow-y-auto"><table class="w-full text-xs min-w-[400px]">
                  <thead class="text-left text-slate-500 uppercase border-b border-slate-200"><tr><th class="py-1.5">MSISDN</th><th class="py-1.5">IMSI</th><th class="py-1.5">Technician</th><th class="py-1.5">Allocated</th></tr></thead>
                  <tbody class="divide-y divide-slate-100">${d.allocatedUnused.map((r) => `<tr><td class="py-1.5 font-mono font-semibold">${ArchiveCommon.escapeHtml(r.msisdn)}</td><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(r.imsi)}</td><td class="py-1.5">${ArchiveCommon.escapeHtml(r.technician)}</td><td class="py-1.5">${ArchiveCommon.fmtDate(r.dateAllocated)}</td></tr>`).join("") || `<tr><td colspan="4" class="py-4 text-center text-slate-400">None</td></tr>`}</tbody>
                </table></div>
              </section>
              <section class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm space-y-3">
                <h3 class="text-sm font-semibold text-emerald-700">Unallocated Unused (${d.unallocatedUnusedCount})</h3>
                <div class="overflow-x-auto max-h-72 overflow-y-auto"><table class="w-full text-xs min-w-[300px]">
                  <thead class="text-left text-slate-500 uppercase border-b border-slate-200"><tr><th class="py-1.5">MSISDN</th><th class="py-1.5">IMSI</th></tr></thead>
                  <tbody class="divide-y divide-slate-100">${d.unallocatedUnused.map((r) => `<tr><td class="py-1.5 font-mono font-semibold">${ArchiveCommon.escapeHtml(r.msisdn)}</td><td class="py-1.5 font-mono">${ArchiveCommon.escapeHtml(r.imsi)}</td></tr>`).join("") || `<tr><td colspan="2" class="py-4 text-center text-slate-400">None</td></tr>`}</tbody>
                </table></div>
              </section>
            </div>`;
        } catch (e) {
          $("results").innerHTML = `<div class="text-center text-rose-600 py-8">${ArchiveCommon.escapeHtml(e.message)}</div>`;
        }
      }
    </script>
  </body>
</html>
