<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Customer Confirmation</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-6">

          <div class="max-w-3xl mx-auto space-y-6">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Customer Confirmation</h1>
            <div id="confirmation-inline-error" class="hidden"></div>

            <div id="job-summary" class="bg-white border border-slate-200/80 rounded-xl p-5 shadow-sm shadow-slate-200/60">
              <h2 class="text-sm font-semibold text-slate-700">Job Summary</h2>
              <div class="mt-3 text-sm text-slate-700 space-y-1">
                <p><span class="text-slate-500">Customer:</span> <span id="summary-customer" class="font-medium text-slate-900">--</span></p>
                <p><span class="text-slate-500">Location:</span> <span id="summary-location" class="font-medium text-slate-900">--</span></p>
                <p><span class="text-slate-500">Scheduled:</span> <span id="summary-schedule" class="font-medium text-slate-900">--</span></p>
                <p><span class="text-slate-500">Request ID:</span> <span id="summary-request" class="font-medium text-slate-900">--</span></p>
              </div>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm shadow-slate-200/60 space-y-4">
              <p class="text-sm font-semibold text-slate-700">Is the customer present?</p>
              <div class="flex flex-wrap gap-3">
                <button id="confirm-yes" type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50">
                  Yes, customer present
                </button>
                <button id="confirm-no" type="button" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40">
                  No, customer absent
                </button>
              </div>
            </div>

            <a href="technician-jobs.html" class="inline-flex items-center text-sm text-blue-600 hover:underline">← Back to My Jobs</a>
          </div>
        
  </main>
</div>
<div id="fm-footer"></div>
<script src="assets/contracts.js"></script>
<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.FINEMARK_APP?.requirePageAccess?.();
  });
</script>
<script>
      const storedUser = localStorage.getItem("finemarkUser");
      let userData = null;
      try {
        userData = storedUser ? JSON.parse(storedUser) : null;
      } catch (error) {
        userData = null;
      }

      if (!userData || !userData.role || userData.role !== "technician") {
        window.location.href = "login.html";
      } else {
        const userInfo = document.getElementById("user-info");
        userInfo.textContent = `User: ${userData.email} (${userData.role})`;
      }

      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("finemarkUser");
        window.location.href = "login.html";
      });

      const jobsKey = "finemark_installations";
      const activityKey = "finemark_activity";
      const jobId = new URLSearchParams(window.location.search).get("id");
      const jobs = JSON.parse(localStorage.getItem(jobsKey) || "[]");
      const job = jobs.find((item) => item.id === jobId);
      const inlineError = document.getElementById("confirmation-inline-error");

      if (!job) {
        inlineError.classList.remove("hidden");
        window.FINEMARK_APP.showInlineError(
          inlineError,
          'Job not found. Return to <a href="technician-jobs.html" class="text-blue-600 hover:underline">My Jobs</a>.',
          {}
        );
      }

      if (job) {
        document.getElementById("summary-customer").textContent = job.customerName;
        document.getElementById("summary-location").textContent = job.location;
        document.getElementById("summary-schedule").textContent = job.scheduledDate ? new Date(job.scheduledDate).toLocaleString() : "—";
        document.getElementById("summary-request").textContent = job.requestId;
      }

      const persistChoice = (method) => {
        if (!job) return;
        job.confirmation = {
          ...(job.confirmation || {}),
          method,
          verified: false,
        };
        job.updatedAt = new Date().toISOString();
        localStorage.setItem(jobsKey, JSON.stringify(jobs));

        const activity = {
          id: `ACT-${Date.now()}`,
          action: "UPDATED",
          recordId: job.requestId,
          recordType: "installation",
          summary: `Selected ${method} confirmation for ${job.customerName}`,
          timestamp: job.updatedAt,
          actor: userData ? userData.email : "demo@finemark.com",
        };
        const activityLog = JSON.parse(localStorage.getItem(activityKey) || "[]");
        activityLog.unshift(activity);
        localStorage.setItem(activityKey, JSON.stringify(activityLog));
      };

      document.getElementById("confirm-yes").addEventListener("click", () => {
        persistChoice("signature");
        window.location.href = `signature.html?id=${encodeURIComponent(jobId)}`;
      });

      document.getElementById("confirm-no").addEventListener("click", () => {
        persistChoice("otp");
        window.location.href = `otp.html?id=${encodeURIComponent(jobId)}`;
      });
    </script>
</body>
</html>
