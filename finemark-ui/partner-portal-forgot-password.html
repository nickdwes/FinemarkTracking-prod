<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner Portal – Forgot Password</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white border border-slate-200 p-8 shadow-xl">
      <h1 class="text-xl font-semibold text-slate-900">Forgot password</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your partner portal email to generate a reset link.</p>
      <form id="f-form" class="mt-5 space-y-3">
        <input id="f-email" type="email" required placeholder="you@partner.com" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm" />
        <button id="f-send" class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">Send reset link</button>
        <p id="f-msg" class="text-xs text-slate-500"></p>
      </form>
      <a href="partner-portal-login.html" class="mt-4 inline-block text-sm text-blue-600 hover:underline">Back to login</a>
    </div>
    <script>
      const API = "/api";
      document.getElementById("f-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("f-msg");
        const btn = document.getElementById("f-send");
        btn.disabled = true;
        btn.textContent = "Sending...";
        msg.textContent = "";
        try {
          await fetch(`${API}/partner-portal/auth/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: document.getElementById("f-email").value.trim() }),
          });
          msg.textContent = "If your account exists, a reset link has been generated. Please check with your portal admin if email delivery is not configured.";
        } catch (err) {
          msg.textContent = "Unable to process request right now.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Send reset link";
        }
      });
    </script>
  </body>
</html>
