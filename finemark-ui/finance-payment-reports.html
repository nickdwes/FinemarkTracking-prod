<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finemark | Payment &amp; Tax Reports</title>
  <link rel="icon" href="assets/finemark-logo.svg" />
  <link rel="stylesheet" href="assets/tailwind.css" />
  <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .fade-in{animation:fadeIn .2s ease;}
    table{border-collapse:collapse;width:100%;}
    th{text-align:left;font-size:.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;padding:.5rem .75rem;border-bottom:1px solid #e2e8f0;white-space:nowrap;}
    td{font-size:.82rem;padding:.55rem .75rem;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;white-space:nowrap;}
    tr:hover td{background:#f8fafc;}
    .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.15rem .6rem;font-size:.68rem;font-weight:600;border-width:1px;}
    .tab-btn{padding:.55rem 1rem;font-size:.85rem;font-weight:600;border-bottom:2px solid transparent;color:#64748b;transition:all .15s;white-space:nowrap;}
    .tab-btn:hover{color:#334155;}
    .tab-btn.active{color:#2563eb;border-bottom-color:#2563eb;}
    .subtab-btn{padding:.4rem .95rem;font-size:.8rem;font-weight:600;border-radius:9999px;color:#64748b;background:#f1f5f9;transition:all .15s;white-space:nowrap;}
    .subtab-btn:hover{background:#e2e8f0;color:#334155;}
    .subtab-btn.active{background:#2563eb;color:#fff;}
    .fltr{border-radius:.5rem;border:1px solid #e2e8f0;font-size:.82rem;padding:.5rem .65rem;color:#334155;background:#fff;}
    .fltr:focus{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.25);border-color:#60a5fa;}
    .fltr-label{display:block;font-size:.7rem;font-weight:600;color:#64748b;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.03em;}
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-4 md:p-6 max-w-[1400px] mx-auto space-y-6">

    <!-- Page Header -->
    <div class="flex flex-wrap items-center gap-3 justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Payment &amp; Tax Reports</h1>
        <p class="text-sm text-slate-500 mt-0.5">Invoice revenue, referrer commissions &amp; VAT.</p>
      </div>
    </div>

    <!-- Date range filter -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 flex flex-wrap items-end gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1" for="rep-from">From</label>
        <input id="rep-from" type="date"
               class="rounded-lg border border-slate-200 text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1" for="rep-to">To</label>
        <input id="rep-to" type="date"
               class="rounded-lg border border-slate-200 text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
      </div>
      <button onclick="applyRange()"
              class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition">Apply</button>
      <button onclick="clearRange()"
              class="px-4 py-2 rounded-lg border border-slate-200 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">Clear</button>
      <span class="text-xs text-slate-400 ml-auto self-center">Leave blank for all-time.</span>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 border-b border-slate-200 overflow-x-auto">
      <button data-tab="invoice"     class="tab-btn" onclick="switchTab('invoice')">Invoice Amount</button>
      <button data-tab="payments"    class="tab-btn" onclick="switchTab('payments')">Invoice Payments</button>
      <button data-tab="outstanding" class="tab-btn" onclick="switchTab('outstanding')">Outstanding</button>
      <button data-tab="referrer"    class="tab-btn" onclick="switchTab('referrer')">Referrer Commission</button>
      <button data-tab="ledger"      class="tab-btn" onclick="switchTab('ledger')">Commission Ledger</button>
      <button data-tab="comm"        class="tab-btn" onclick="switchTab('comm')">Commission Analytics</button>
      <button data-tab="advcomm"     class="tab-btn" onclick="switchTab('advcomm')">Advanced Commission</button>
      <button data-tab="tax"         class="tab-btn" onclick="switchTab('tax')">Tax Report</button>
    </div>

    <!-- TAB 1: Invoice Amount -->
    <div id="panel-invoice" class="tab-panel space-y-6">
      <div class="flex items-center justify-between gap-3">
        <div id="inv-status" class="text-sm text-slate-400">Loading…</div>
        <button onclick="dlInvoiceCsv()"
                class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-200 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Download CSV
        </button>
      </div>
      <div id="inv-filters" class="hidden flex flex-wrap items-end gap-3 bg-white rounded-xl border border-slate-200 p-3">
        <div><label class="fltr-label">Sales Person</label><select id="inv-f-sp" onchange="renderInvoice()" class="fltr"><option value="">All</option></select></div>
        <div><label class="fltr-label">Status</label><select id="inv-f-status" onchange="renderInvoice()" class="fltr"><option value="">All</option></select></div>
        <div class="flex-1 min-w-[180px]"><label class="fltr-label">Search</label><input id="inv-f-q" oninput="renderInvoice()" placeholder="Invoice no or customer…" class="fltr w-full" /></div>
        <button onclick="clearInvFilters()" class="px-3 py-2 rounded-lg border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition">Reset</button>
      </div>
      <div id="inv-kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
      <div id="inv-content" class="space-y-6"></div>
    </div>

    <!-- TAB: Invoice Payments (receipts banked, independent of invoice) -->
    <div id="panel-payments" class="tab-panel hidden space-y-6">
      <div class="flex items-center justify-between gap-3">
        <div id="pmt-status" class="text-sm text-slate-400">Loading…</div>
        <button onclick="dlPaymentsCsv()"

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Download CSV

      <div id="pmt-filters" class="hidden flex flex-wrap items-end gap-3 bg-white rounded-xl border border-slate-200 p-3">
        <div><label class="fltr-label">Method</label><select id="pmt-f-method" onchange="renderPayments()" class="fltr"><option value="">All</option></select></div>
        <div><label class="fltr-label">Bank</label><select id="pmt-f-bank" onchange="renderPayments()" class="fltr"><option value="">All</option></select></div>
        <div class="flex-1 min-w-[180px]"><label class="fltr-label">Search</label><input id="pmt-f-q" oninput="renderPayments()" placeholder="Ref, invoice, customer…" class="fltr w-full" /></div>

        <div id="out-status" class="text-sm text-slate-400">Loading…</div>
        <button onclick="dlOutstandingCsv()"

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>

      </div>
      <div id="out-filters" class="hidden flex flex-wrap items-end gap-3 bg-white rounded-xl border border-slate-200 p-3">

        <div><label class="fltr-label">Age</label><select id="out-f-age" onchange="renderOutstanding()" class="fltr"><option value="">All</option><option value="0-30">0–30 days</option><option value="31-60">31–60 days</option><option value="61-90">61–90 days</option><option value="90+">90+ days</option></select></div>
        <div class="flex-1 min-w-[180px]"><label class="fltr-label">Search</label><input id="out-f-q" oninput="renderOutstanding()" placeholder="Invoice no or customer…" class="fltr w-full" /></div>

    <!-- TAB 2: Referrer Commission -->

      <div class="flex items-center justify-between gap-3">
        <div id="ref-status" class="text-sm text-slate-400">Loading…</div>
        <button onclick="dlReferrerCsv()"

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Download CSV
        </button>
      </div>
      <div id="comm-filters" class="hidden flex flex-wrap items-end gap-3 bg-white rounded-xl border border-slate-200 p-3">
        <div><label class="fltr-label">Reconciliation</label><select id="comm-f-recon" onchange="renderComm()" class="fltr"><option value="">All</option><option value="Pending">Pending</option><option value="Reconciled">Reconciled</option></select></div>

    <!-- TAB: Advanced Commission (commission paid before the invoice was fully

      <div class="flex items-center justify-between gap-3">
        <div id="advcomm-status" class="text-sm text-slate-400">Loading…</div>
        <button onclick="dlAdvCommCsv()"
                class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-200 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Download CSV

    <!-- TAB 3: Tax Report -->
    <div id="panel-tax" class="tab-panel hidden space-y-6">
      <div class="flex items-center justify-between gap-3">

        <button onclick="dlTaxCsv()"
                class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-200 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>

<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
  const APP = window.FINEMARK_APP;
  APP && APP.requirePageAccess && APP.requirePageAccess();

  /* ---------- helpers ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  const kes = (v) => 'KES ' + Number(v || 0).toLocaleString('en-KE', { maximumFractionDigits: 0 });
  const num = (v) => Number(v || 0).toLocaleString('en-KE');

  function fmtDate(v){
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d)) return esc(v);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function statusBadge(status){
    const s = String(status || '').toLowerCase();
    let cls = 'bg-slate-100 border-slate-200 text-slate-500';
    if (s === 'paid') cls = 'bg-emerald-50 border-emerald-200 text-emerald-600';
    else if (s === 'unpaid') cls = 'bg-red-50 border-red-200 text-red-600';
    else if (s === 'partial' || s === 'overdue') cls = 'bg-amber-50 border-amber-200 text-amber-700';
    else if (s === 'cancelled') cls = 'bg-slate-100 border-slate-200 text-slate-400';
    return '<span class="badge ' + cls + '">' + esc(status || '—') + '</span>';
  }

  function reconBadge(status){
    const s = String(status || '').toLowerCase();
    let cls = 'bg-slate-100 border-slate-200 text-slate-500';
    if (s === 'reconciled') cls = 'bg-emerald-50 border-emerald-200 text-emerald-600';
    else if (s === 'pending') cls = 'bg-rose-50 border-rose-200 text-rose-600';
    return '<span class="badge ' + cls + '">' + esc(status || '—') + '</span>';
  }

  const agePill = (bucket) => {
    const b = String(bucket || '');
    let cls = 'bg-slate-100 text-slate-500';
    if (b === '31-60') cls = 'bg-amber-50 text-amber-700';
    else if (b === '61-90') cls = 'bg-orange-50 text-orange-700';
    else if (b === '90+') cls = 'bg-red-50 text-red-700';
    return '<span class="badge ' + cls + ' border-transparent">' + esc(b || '—') + '</span>';
  };

  function toast(msg, ok){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg text-sm font-medium shadow-lg fade-in ' + (ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white');
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3200);
  }

  function kpiCard(label, value, accent){
    return '<div class="bg-white rounded-xl border border-slate-200 p-4">'
      + '<div class="text-xs font-medium text-slate-500 uppercase tracking-wide">' + esc(label) + '</div>'
      + '<div class="text-2xl font-bold mt-1 ' + (accent || 'text-slate-900') + '">' + value + '</div>'
      + '</div>';
  }

  function card(title, tableHtml){
    return '<div class="bg-white rounded-xl border border-slate-200 overflow-hidden">'
      + (title ? '<div class="px-4 py-3 border-b border-slate-100 text-sm font-semibold text-slate-700">' + esc(title) + '</div>' : '')
      + '<div class="overflow-x-auto">' + tableHtml + '</div>'
      + '</div>';
  }

  /* Build query string from the shared date range, plus any extra params. */
  function qs(extra){
    const from = (document.getElementById('rep-from').value || '').trim();
    const to   = (document.getElementById('rep-to').value || '').trim();
    const p = [];
    if (from) p.push('from=' + encodeURIComponent(from));
    if (to)   p.push('to='   + encodeURIComponent(to));
    (extra || []).forEach((x) => p.push(x));
    return p.length ? '?' + p.join('&') : '';
  }

  /* Authed file/CSV download. */
  async function downloadAuthed(path, filename){
    const res = await fetch(`${APP.CONFIG.API_BASE_URL}${path}`, {
      headers: { Authorization: `Bearer ${APP.getSession().accessToken}` }
    });
    if (!res.ok) throw new Error('Download failed (' + res.status + ')');
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  /* Client-side CSV cell quoting. */
  function csvCell(v){
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function setStatus(id, mode, msg){
    const el = document.getElementById(id);
    if (mode === 'hide') { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    el.className = 'text-sm ' + (mode === 'error' ? 'text-red-500' : 'text-slate-400');

  /* Populate a <select> with distinct values, preserving the current selection if still present. */
  function fillSelect(id, values){
    const el = document.getElementById(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">All</option>' + values.map((v) => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
    if (values.indexOf(cur) !== -1) el.value = cur;
  }

  /* Client-side CSV download from an array of row objects. */
  function downloadCsv(filename, headers, rows){
    const lines = [headers.join(',')];
    rows.forEach((r) => lines.push(headers.map((h) => csvCell(r[h])).join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // Collapse commission payouts that belong to the SAME payment/deal into one
  // ledger row: Commission = sum of payouts; Net to Finemark = Amount Paid − total
  // commission. Prevents a deal from appearing multiple times and its Amount Paid
  // from being double-counted when >1 referrer commission is recorded on a payment.
  function refAggregateDeals(rows){
    const groups = new Map();
    const order = [];
    rows.forEach((r) => {
      const key = r.payment_id || (r.invoice_id ? r.invoice_id + '|' + (r.amount_paid || '') : r.id);
      let g = groups.get(key);
      if (!g) { g = { base: r, commission: 0, refs: new Set(), payees: new Set(), commDate: null, count: 0 }; groups.set(key, g); order.push(key); }
      g.commission += Number(r.fee_amount || 0);
      g.count++;
      if (r.transaction_code) g.refs.add(r.transaction_code);
      if (r.referrer_name) g.payees.add(r.referrer_name);
      if (r.payment_date && (!g.commDate || String(r.payment_date) > String(g.commDate))) g.commDate = r.payment_date;
    });
    return order.map((k) => {
      const g = groups.get(k);
      return { ...g.base,
        fee_amount: g.commission,
        net_to_finemark: Number(g.base.amount_paid || 0) - g.commission,
        transaction_code: [...g.refs].join(', ') || null,
        payment_date: g.commDate,
        referrer_name: [...g.payees].join(', '),
        _payouts: g.count };
    });
  }

  function renderReferrer(){
    const rows = refFilteredRows();
    const totalPaid = rows.reduce((a, r) => a + Number(r.fee_amount || 0), 0);
    const byMap = new Map();

      let s = byMap.get(k);
      if (!s) { s = { referrer_name: k, payment_count: 0, total_paid: 0 }; byMap.set(k, s); }
      s.payment_count++; s.total_paid += Number(r.fee_amount || 0);
    });
    const summary = [...byMap.values()].sort((a, b) => b.total_paid - a.total_paid);

    document.getElementById('ref-kpis').innerHTML = [
      kpiCard('Total Commission Paid', kes(totalPaid), 'text-emerald-600'),
      kpiCard('Referrers', num(summary.length)),
      kpiCard('Payouts', num(rows.length))

    const sBody = summary.map((s) =>

      + '</tr></thead><tbody>' + (sBody || '<tr><td colspan="3" class="text-center text-slate-400 py-6">—</td></tr>') + '</tbody></table>';

    document.getElementById('ref-content').innerHTML = card('By Referrer', sTable);

  function renderLedgerPagination(totalDeals){
    const pages = Math.max(1, Math.ceil(totalDeals / _ledgerPageSize));
    if (_ledgerPage > pages) _ledgerPage = pages;
    const el = document.getElementById('ledger-pagination');
    if (!el) return;
    el.innerHTML = `
      <span class="text-xs text-slate-500">${totalDeals.toLocaleString()} deal${totalDeals === 1 ? '' : 's'} · Page ${_ledgerPage} of ${pages}</span>
      <div class="flex gap-2">
        <button id="ledger-pg-prev" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium disabled:opacity-40" ${_ledgerPage <= 1 ? 'disabled' : ''}>Prev</button>
        <button id="ledger-pg-next" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium disabled:opacity-40" ${_ledgerPage >= pages ? 'disabled' : ''}>Next</button>
      </div>`;
    document.getElementById('ledger-pg-prev')?.addEventListener('click', () => { if (_ledgerPage > 1) { _ledgerPage--; renderLedger(); } });
    document.getElementById('ledger-pg-next')?.addEventListener('click', () => { if (_ledgerPage < pages) { _ledgerPage++; renderLedger(); } });
  }

  function commSearchMatch(hay){
    const q = (document.getElementById('comm-f-q').value || '').trim().toLowerCase();
    if (!q) return true;
    return String(hay || '').toLowerCase().indexOf(q) !== -1;
  }

  function renderComm(){
    const d = _commData; if (!d) return;
    const s = d.summary;
    document.getElementById('comm-kpis').innerHTML = [
      kpiCard('Commission Paid', kes(s.totalPaid), 'text-emerald-600'),
      kpiCard('Advanced', kes(s.advancedTotal) + ' <span class="text-sm font-medium text-slate-400">/ ' + num(s.advancedCount) + '</span>', 'text-amber-600'),
      kpiCard('Pending Exposure', kes(s.pendingExposure) + ' <span class="text-sm font-medium text-slate-400">/ ' + num(s.pendingCount) + '</span>', 'text-rose-600'),
      kpiCard('Reconciled', kes(s.reconciledTotal) + ' <span class="text-sm font-medium text-slate-400">/ ' + num(s.reconciledCount) + '</span>', 'text-slate-900')
    ].join('');

    const recon = document.getElementById('comm-f-recon').value;

    // By Salesperson
    const spRows = (d.bySalesperson || []).filter((x) => commSearchMatch(x.salesPerson));
    const spBody = spRows.map((x) =>
      '<tr><td class="font-medium text-slate-700">' + esc(x.salesPerson || '—') + '</td>'
      + '<td>' + num(x.count) + '</td><td class="text-emerald-600">' + kes(x.total) + '</td>'
      + '<td class="text-amber-600">' + (x.advanced ? kes(x.advanced) : '—') + '</td></tr>').join('');
    const spTable = '<table><thead><tr><th>Sales Person</th><th>Payouts</th><th>Total</th><th>of which Advanced</th></tr></thead><tbody>'
      + (spBody || '<tr><td colspan="4" class="text-center text-slate-400 py-6">—</td></tr>') + '</tbody></table>';

    // By Customer
    const custRows = (d.byCustomer || []).filter((x) => commSearchMatch(x.customer));
    const custBody = custRows.map((x) =>
      '<tr><td class="font-medium text-slate-700">' + esc(x.customer || '—') + '</td>'
      + '<td>' + num(x.count) + '</td><td class="text-emerald-600">' + kes(x.total) + '</td>'
      + '<td class="text-amber-600">' + (x.advanced ? kes(x.advanced) : '—') + '</td></tr>').join('');
    const custTable = '<table><thead><tr><th>Customer</th><th>Payouts</th><th>Total</th><th>of which Advanced</th></tr></thead><tbody>'
      + (custBody || '<tr><td colspan="4" class="text-center text-slate-400 py-6">—</td></tr>') + '</tbody></table>';

    // An advance is HELD until a second person releases it: whoever raised it
    // cannot, so the buttons only show to Admin/Executive on someone else's.
    const canDecideAdvance = ['Admin', 'Executive'].includes(
      (window.FINEMARK_APP.getSession() || {}).user?.role);
    const myEmail = ((window.FINEMARK_APP.getSession() || {}).user?.email || '').toLowerCase();
    function approvalCell(r) {
      const st = r.approvalStatus || 'NotRequired';
      if (st === 'Approved')  return '<span class="text-emerald-600 text-xs font-semibold">Approved</span>'
        + (r.approvedBy ? '<div class="text-[11px] text-slate-400">' + esc(r.approvedBy.split('@')[0]) + '</div>' : '');
      if (st === 'Rejected')  return '<span class="text-rose-600 text-xs font-semibold">Refused</span>';
      if (st !== 'Pending')   return '<span class="text-slate-400 text-xs">—</span>';
      const mine = (r.authorizedBy || '').toLowerCase() === myEmail;
      if (!canDecideAdvance || mine) {
        return '<span class="text-amber-700 text-xs font-semibold">Awaiting approval</span>'
          + (mine ? '<div class="text-[11px] text-slate-400">you raised this</div>' : '');
      }
      return '<div class="flex gap-1"><button data-adv-approve="' + esc(r.id) + '" class="rounded border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-700 hover:bg-emerald-100">Approve</button>'
        + '<button data-adv-reject="' + esc(r.id) + '" class="rounded border border-rose-200 bg-rose-50 px-2 py-0.5 text-[11px] font-semibold text-rose-700 hover:bg-rose-100">Refuse</button></div>';
    }

    // Advanced Commissions
    const advRows = (d.advanced || []).filter((r) => (!recon || r.reconciliationStatus === recon)
      && commSearchMatch((r.referrerName || '') + ' ' + (r.customer || '') + ' ' + (r.invoiceNumber || '') + ' ' + (r.advanceReason || '') + ' ' + (r.authorizedBy || '')));
    const advBody = advRows.map((r) =>
      '<tr class="fade-in">'
      + '<td class="text-slate-500">' + fmtDate(r.date) + '</td>'
      + '<td class="font-medium text-slate-700">' + esc(r.referrerName || '—') + '</td>'
      + '<td>' + esc(r.customer || '—') + '</td>'
      + '<td class="font-mono text-xs">' + esc(r.invoiceNumber || '—') + '</td>'
      + '<td class="text-amber-600 font-semibold">' + kes(r.amount) + '</td>'
      + '<td>' + esc(r.advanceReason || '—') + '</td>'
      + '<td>' + reconBadge(r.reconciliationStatus) + '</td>'
      + '<td class="text-slate-500">' + fmtDate(r.reconciledAt) + '</td>'
      + '<td class="text-slate-500 text-xs">' + esc(r.authorizedBy || '—') + '</td>'
      + '<td>' + approvalCell(r) + '</td>'
      + '<td class="text-center">' + num(r.ageDays) + ' ' + agePill(r.ageBucket) + '</td>'
      + '</tr>').join('');
    const advTable = '<table><thead><tr><th>Paid On</th><th>Referrer</th><th>Customer</th><th>Invoice</th><th>Amount</th><th>Reason</th><th>Reconciliation</th><th>Reconciled On</th><th>Raised By</th><th>Approval</th><th>Age</th></tr></thead><tbody>'
      + (advBody || '<tr><td colspan="11" class="text-center text-slate-400 py-6">No advanced commissions.</td></tr>') + '</tbody></table>';

    // Pending (partial) payouts
    const pendRows = (d.pending || []).filter((r) => commSearchMatch((r.referrerName || '') + ' ' + (r.customer || '') + ' ' + (r.invoiceNumber || '')));
    const pendBody = pendRows.map((r) =>
      '<tr class="fade-in">'
      + '<td class="text-slate-500">' + fmtDate(r.date) + '</td>'
      + '<td class="font-medium text-slate-700">' + esc(r.referrerName || '—') + '</td>'
      + '<td>' + esc(r.customer || '—') + '</td>'
      + '<td class="font-mono text-xs">' + esc(r.invoiceNumber || '—') + '</td>'
      + '<td>' + kes(r.pledged) + '</td>'
      + '<td class="text-emerald-600">' + kes(r.paid) + '</td>'
      + '<td class="font-semibold text-rose-600">' + kes(r.shortfall) + '</td>'
      + '</tr>').join('');
    const pendTable = '<table><thead><tr><th>Paid On</th><th>Referrer</th><th>Customer</th><th>Invoice</th><th>Pledged</th><th>Paid</th><th>Shortfall</th></tr></thead><tbody>'
      + (pendBody || '<tr><td colspan="7" class="text-center text-slate-400 py-6">No under-paid commissions.</td></tr>') + '</tbody></table>';

    // Aging of unreconciled advances
    const ab = d.agingBuckets || { '0-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
    const ageRow = ['0-30','31-60','61-90','90+'].map((b) =>
      '<td>' + agePill(b) + ' <span class="font-semibold text-slate-800">' + kes(ab[b] || 0) + '</span></td>').join('');
    const ageTable = '<table><thead><tr><th>0–30 days</th><th>31–60 days</th><th>61–90 days</th><th>90+ days</th></tr></thead><tbody><tr>' + ageRow + '</tr></tbody></table>';

    document.getElementById('comm-content').innerHTML =
        '<div class="flex flex-wrap gap-2">'
      +   '<button class="subtab-btn" data-sub="sp"   onclick="switchCommSub(\'sp\')">By Sales Person</button>'
      +   '<button class="subtab-btn" data-sub="cust" onclick="switchCommSub(\'cust\')">By Customer</button>'
      +   '<button class="subtab-btn" data-sub="adv"  onclick="switchCommSub(\'adv\')">Advanced &amp; Reconciliation</button>'
      +   '<button class="subtab-btn" data-sub="pend" onclick="switchCommSub(\'pend\')">Pending (Partial)</button>'
      +   '<button class="subtab-btn" data-sub="age"  onclick="switchCommSub(\'age\')">Aging</button>'
      + '</div>'
      + '<div id="comm-sub-sp">'   + card('Commission by Sales Person', spTable) + '</div>'
      + '<div id="comm-sub-cust">' + card('Commission by Customer', custTable) + '</div>'
      + '<div id="comm-sub-adv">'  + card('Advanced Commissions', advTable) + '</div>'
      + '<div id="comm-sub-pend">' + card('Pending / Partially-Paid Commissions', pendTable) + '</div>'
      + '<div id="comm-sub-age">'  + card('Unreconciled Advance Exposure by Age', ageTable) + '</div>';
    switchCommSub(_commSub);
    wireAdvanceDecisions();
  }

  // Approve / refuse a held advance. The server re-checks the role and blocks
  // self-approval, so this is convenience, not the control itself.
  function wireAdvanceDecisions(){
    document.querySelectorAll('[data-adv-approve]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('Approve this advance? It will then count as commission paid.')) return;
        b.disabled = true;
        try {
          const r = await window.FINEMARK_APP.apiFetch('/referrers/payments/' + b.dataset.advApprove + '/approve', { method: 'POST', body: {} });
          toast(r?.message || 'Advance approved.', true);
          await loadComm();
        } catch (e) { b.disabled = false; toast(e?.message || 'Could not approve.', false); }
      };
    });
    document.querySelectorAll('[data-adv-reject]').forEach((b) => {
      b.onclick = async () => {
        const reason = prompt('Why is this advance being refused?');
        if (!reason || !reason.trim()) return;
        b.disabled = true;
        try {
          const r = await window.FINEMARK_APP.apiFetch('/referrers/payments/' + b.dataset.advReject + '/reject', { method: 'POST', body: { reason: reason.trim() } });
          toast(r?.message || 'Advance refused.', true);
          await loadComm();
        } catch (e) { b.disabled = false; toast(e?.message || 'Could not refuse.', false); }
      };
    });
  }

  function clearCommFilters(){
    document.getElementById('comm-f-recon').value = '';
    document.getElementById('comm-f-q').value = '';
    renderComm();
  }

  function dlCommCsv(){
    const d = _commData; if (!d){ toast('Nothing to download.', false); return; }
    if (_commSub === 'sp'){
      downloadCsv('commission-by-salesperson.csv', ['salesPerson','count','total','advanced'], d.bySalesperson || []);
    } else if (_commSub === 'cust'){
      downloadCsv('commission-by-customer.csv', ['customer','count','total','advanced'], d.byCustomer || []);
    } else if (_commSub === 'adv'){
      downloadCsv('advanced-commissions.csv', ['date','referrerName','customer','invoiceNumber','amount','advanceReason','approvalStatus','approvedBy','approvedAt','reconciliationStatus','reconciledAt','authorizedBy','ageDays','ageBucket'], d.advanced || []);
    } else if (_commSub === 'pend'){
      downloadCsv('pending-commissions.csv', ['date','referrerName','customer','invoiceNumber','pledged','paid','shortfall'], d.pending || []);
    } else {
      const ab = d.agingBuckets || {};
      downloadCsv('advance-aging.csv', ['bucket','exposure'], ['0-30','31-60','61-90','90+'].map((b) => ({ bucket: b, exposure: ab[b] || 0 })));
    }
  }

  /* ---------- TAB: Advanced Commission ---------- */
  /* Same source data as Commission Analytics' "advanced" set — reused here as
     its own first-class report so advanced-commission exposure doesn't have
     to be found by digging into a sub-tab. */
  async function loadAdvComm(){
    setStatus('advcomm-status', 'loading', 'Loading…');
    document.getElementById('advcomm-filters').classList.add('hidden');
    document.getElementById('advcomm-kpis').innerHTML = '';
    document.getElementById('advcomm-content').innerHTML = '';
    _advCommData = null;
    try {
      const r = await APP.apiFetch('/reports/commission-analytics' + qs());
      _advCommData = (r && r.data) || null;
      setStatus('advcomm-status', 'hide');
      if (!_advCommData || !(_advCommData.advanced || []).length){
        document.getElementById('advcomm-content').innerHTML = '<div class="text-center text-slate-400 py-10">No advanced commissions in this period. 🎉</div>';
        return;
      }
      document.getElementById('advcomm-filters').classList.remove('hidden');
      renderAdvComm();
    } catch (e) {
      document.getElementById('advcomm-filters').classList.add('hidden');
      setStatus('advcomm-status', 'error', 'Failed to load advanced commission report.');
    }
  }

  function advCommFilteredRows(){
    if (!_advCommData) return [];
    const recon = document.getElementById('advcomm-f-recon').value;
    const q = (document.getElementById('advcomm-f-q').value || '').trim().toLowerCase();
    return (_advCommData.advanced || []).filter((r) => {
      if (recon && r.reconciliationStatus !== recon) return false;
      if (q){
        const hay = ((r.referrerName || '') + ' ' + (r.customer || '') + ' ' + (r.invoiceNumber || '') + ' ' + (r.advanceReason || '') + ' ' + (r.authorizedBy || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderAdvComm(){
    const rows = advCommFilteredRows();
    const outstanding = rows.filter((r) => r.reconciliationStatus !== 'Reconciled').reduce((s, r) => s + Number(r.amount || 0), 0);
    const outstandingCount = rows.filter((r) => r.reconciliationStatus !== 'Reconciled').length;
    const reconciled = rows.filter((r) => r.reconciliationStatus === 'Reconciled').reduce((s, r) => s + Number(r.amount || 0), 0);
    const total = rows.reduce((s, r) => s + Number(r.amount || 0), 0);
    document.getElementById('advcomm-kpis').innerHTML = [
      kpiCard('Total Advanced', kes(total), 'text-amber-600'),
      kpiCard('Count', num(rows.length)),
      kpiCard('Still Unreconciled', kes(outstanding) + ' <span class="text-sm font-medium text-slate-400">/ ' + num(outstandingCount) + '</span>', 'text-rose-600'),
      kpiCard('Reconciled', kes(reconciled), 'text-emerald-600'),
    ].join('');
    if (!rows.length){ document.getElementById('advcomm-content').innerHTML = NOMATCH; return; }

    const body = rows.map((r) =>
      '<tr class="fade-in">'
      + '<td class="text-slate-500">' + fmtDate(r.date) + '</td>'
      + '<td class="font-medium text-slate-700">' + esc(r.referrerName || '—') + '</td>'
      + '<td>' + esc(r.customer || '—') + '</td>'
      + '<td class="font-mono text-xs">' + esc(r.invoiceNumber || '—') + '</td>'
      + '<td class="text-amber-600 font-semibold">' + kes(r.amount) + '</td>'
      + '<td>' + esc(r.advanceReason || '—') + '</td>'
      + '<td>' + reconBadge(r.reconciliationStatus) + '</td>'
      + '<td class="text-slate-500">' + fmtDate(r.reconciledAt) + '</td>'
      + '<td class="text-slate-500 text-xs">' + esc(r.authorizedBy || '—') + '</td>'
      + '<td class="text-center">' + num(r.ageDays) + ' ' + agePill(r.ageBucket) + '</td>'
      + '</tr>').join('');
    const table = '<table><thead><tr><th>Paid On</th><th>Referrer</th><th>Customer</th><th>Invoice</th><th>Amount</th><th>Reason</th><th>Reconciliation</th><th>Reconciled On</th><th>Authorized By</th><th>Age</th></tr></thead><tbody>' + body + '</tbody></table>';

    // Aging of the currently-unreconciled portion (recomputed from the filtered set).
    const ab = { '0-30': 0, '31-60': 0, '61-90': 0, '90+': 0 };
    rows.filter((r) => r.reconciliationStatus !== 'Reconciled').forEach((r) => { ab[r.ageBucket] = (ab[r.ageBucket] || 0) + Number(r.amount || 0); });
    const ageRow = ['0-30','31-60','61-90','90+'].map((b) =>
      '<td>' + agePill(b) + ' <span class="font-semibold text-slate-800">' + kes(ab[b]) + '</span></td>').join('');
    const ageTable = '<table><thead><tr><th>0–30 days</th><th>31–60 days</th><th>61–90 days</th><th>90+ days</th></tr></thead><tbody><tr>' + ageRow + '</tr></tbody></table>';

    document.getElementById('advcomm-content').innerHTML = card('Advanced Commissions', table) + card('Unreconciled Exposure by Age', ageTable);
  }

  function clearAdvCommFilters(){
    document.getElementById('advcomm-f-recon').value = '';
    document.getElementById('advcomm-f-q').value = '';
    renderAdvComm();
  }

  function dlAdvCommCsv(){
    const rows = advCommFilteredRows();
    if (!rows.length){ toast('Nothing to download for these filters.', false); return; }
    downloadCsv('advanced-commissions.csv',
      ['date','referrerName','customer','invoiceNumber','amount','advanceReason','reconciliationStatus','reconciledAt','authorizedBy','ageDays','ageBucket'],
      rows);
  }

  /* ---------- init ---------- */
  (function init(){
    if (!APP || !APP.apiFetch || !APP.getSession) { return setTimeout(init, 200); }
    switchTab('invoice');
  })();
</script>
</body>
</html>
