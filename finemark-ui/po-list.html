<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase Orders | Finemark</title>
  <link rel="icon" href="assets/finemark-logo.svg" />
  <link rel="stylesheet" href="assets/tailwind.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Purchase Orders</h1>
          <p class="text-sm text-slate-600 mt-1">Manage vendor purchase orders</p>
        </div>
        <button id="btn-create-po" class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 transition">
          <span>+</span> New PO
        </button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-lg border border-slate-200 p-4 space-y-4">
        <div class="grid gap-4 md:grid-cols-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Search</label>
            <input id="search-po" type="text" placeholder="PO number, vendor..." class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Status</label>
            <select id="filter-status" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40">
              <option value="">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Approved">Approved</option>
              <option value="Pending">Pending</option>
              <option value="Received">Received</option>
            </select>
          </div>
          <div class="flex items-end">
            <button id="btn-filter-clear" class="w-full rounded-md bg-slate-100 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200 transition">
              Clear Filters
            </button>
          </div>
        </div>
      </div>

      <!-- PO List -->
      <div id="po-list-container" class="bg-white rounded-lg border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="px-6 py-3 text-left font-semibold text-slate-700">PO Number</th>
                <th class="px-6 py-3 text-left font-semibold text-slate-700">Vendor</th>
                <th class="px-6 py-3 text-right font-semibold text-slate-700">Amount</th>
                <th class="px-6 py-3 text-left font-semibold text-slate-700">Status</th>
                <th class="px-6 py-3 text-left font-semibold text-slate-700">Items</th>
                <th class="px-6 py-3 text-left font-semibold text-slate-700">Date</th>
                <th class="px-6 py-3 text-center font-semibold text-slate-700">Actions</th>
              </tr>
            </thead>
            <tbody id="po-tbody" class="divide-y divide-slate-200">
              <tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination-container" class="flex items-center justify-between">
        <div class="text-sm text-slate-600" id="pagination-info"></div>
        <div class="flex gap-2">
          <button id="btn-prev-page" class="rounded-md border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50 transition">← Previous</button>
          <button id="btn-next-page" class="rounded-md border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50 transition">Next →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Create PO Modal -->
<div id="modal-create-po" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 sticky top-0 bg-white">
      <h2 class="text-lg font-semibold text-slate-900">Create Purchase Order</h2>
      <button id="btn-close-modal" class="text-slate-500 hover:text-slate-700 text-2xl leading-none">×</button>
    </div>
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Vendor Name</label>
        <input id="vendor-name" type="text" placeholder="e.g., Supplier Inc." class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Expected Delivery</label>
        <input id="expected-delivery" type="date" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Payment Terms</label>
        <select id="payment-terms" class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40">
          <option value="Net 30">Net 30</option>
          <option value="Net 60">Net 60</option>
          <option value="COD">COD</option>
          <option value="Prepaid">Prepaid</option>
        </select>
      </div>
      <div id="items-container" class="space-y-2">
        <h3 class="font-semibold text-slate-900">Items</h3>
        <div class="bg-slate-50 p-3 rounded-md space-y-3">
          <div class="grid gap-2 md:grid-cols-3">
            <input class="po-item-name rounded-md border border-slate-200 px-2 py-1.5 text-sm" placeholder="Item name" />
            <input type="number" class="po-item-quantity rounded-md border border-slate-200 px-2 py-1.5 text-sm" placeholder="Qty" />
            <input type="number" class="po-item-price rounded-md border border-slate-200 px-2 py-1.5 text-sm" placeholder="Unit Price" />
          </div>
        </div>
        <button id="btn-add-item" class="text-sm text-blue-600 hover:text-blue-700 font-medium">+ Add Item</button>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Notes</label>
        <textarea id="po-notes" placeholder="Additional notes..." class="w-full rounded-md border border-slate-200 px-3 py-2 text-sm h-24 focus:outline-none focus:ring-2 focus:ring-blue-500/40"></textarea>
      </div>
    </div>
    <div class="border-t border-slate-200 px-6 py-4 flex gap-2 justify-end bg-slate-50">
      <button id="btn-cancel-modal" class="rounded-md border border-slate-200 px-4 py-2 text-sm font-medium hover:bg-slate-50 transition">Cancel</button>
      <button id="btn-save-po" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition">Create PO</button>
    </div>
  </div>
</div>

<script src="assets/app.js?v=202607011016"></script>
<script>
  let currentPage = 1;
  let pageSize = 50;
  const API_BASE = `http://localhost:3000/api`;

  async function loadPOs() {
    try {
      const params = new URLSearchParams({
        page: currentPage.toString(),
        pageSize: pageSize.toString(),
        search: document.getElementById('search-po').value || '',
        status: document.getElementById('filter-status').value || ''
      });

      const response = await fetch(`${API_BASE}/purchase-orders?${params}`, {
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
      });

      if (!response.ok) throw new Error(await response.text());

      const { data, meta } = await response.json();

      const tbody = document.getElementById('po-tbody');
      tbody.innerHTML = data.length ? data.map(po => `
        <tr class="hover:bg-slate-50 transition">
          <td class="px-6 py-4 font-medium text-blue-600 cursor-pointer" onclick="viewPO('${po.id}')">${po.poNumber}</td>
          <td class="px-6 py-4">${po.vendorName}</td>
          <td class="px-6 py-4 text-right font-medium">KES ${(po.totalAmount || 0).toLocaleString()}</td>
          <td class="px-6 py-4"><span class="inline-block px-2 py-1 rounded-full text-xs font-medium ${getStatusColor(po.status)}">${po.status}</span></td>
          <td class="px-6 py-4">${po.itemCount} items</td>
          <td class="px-6 py-4 text-sm">${new Date(po.createdAt).toLocaleDateString()}</td>
          <td class="px-6 py-4 text-center"><button onclick="editPO('${po.id}')" class="text-blue-600 hover:underline text-sm">View</button></td>
        </tr>
      `).join('') : '<tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">No purchase orders found</td></tr>';

      document.getElementById('pagination-info').textContent = `Page ${currentPage} of ${Math.ceil(meta.total / pageSize)} (${meta.total} total)`;
      document.getElementById('btn-prev-page').disabled = currentPage === 1;
      document.getElementById('btn-next-page').disabled = currentPage >= Math.ceil(meta.total / pageSize);
    } catch (err) {
      console.error(err);
      document.getElementById('po-tbody').innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-red-600">Error loading POs</td></tr>`;
    }
  }

  function getStatusColor(status) {
    const colors = {
      'Draft': 'bg-slate-100 text-slate-700',
      'Approved': 'bg-green-100 text-green-700',
      'Pending': 'bg-yellow-100 text-yellow-700',
      'Received': 'bg-blue-100 text-blue-700'
    };
    return colors[status] || 'bg-slate-100 text-slate-700';
  }

  function viewPO(id) {
    // Implementation for viewing PO details
    console.log('View PO:', id);
  }

  function editPO(id) {
    // Implementation for editing PO
    console.log('Edit PO:', id);
  }

  // Event listeners
  document.getElementById('btn-create-po').onclick = () => document.getElementById('modal-create-po').classList.remove('hidden');
  document.getElementById('btn-close-modal').onclick = () => document.getElementById('modal-create-po').classList.add('hidden');
  document.getElementById('btn-cancel-modal').onclick = () => document.getElementById('modal-create-po').classList.add('hidden');

  document.getElementById('btn-filter-clear').onclick = () => {
    document.getElementById('search-po').value = '';
    document.getElementById('filter-status').value = '';
    currentPage = 1;
    loadPOs();
  };

  document.getElementById('search-po').oninput = () => {
    currentPage = 1;
    loadPOs();
  };

  document.getElementById('filter-status').onchange = () => {
    currentPage = 1;
    loadPOs();
  };

  document.getElementById('btn-prev-page').onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      loadPOs();
    }
  };

  document.getElementById('btn-next-page').onclick = () => {
    currentPage++;
    loadPOs();
  };

  document.getElementById('btn-save-po').onclick = async () => {
    const vendor = document.getElementById('vendor-name').value;
    const expectedDelivery = document.getElementById('expected-delivery').value;
    const paymentTerms = document.getElementById('payment-terms').value;
    const notes = document.getElementById('po-notes').value;

    if (!vendor || !expectedDelivery) {
      alert('Please fill in required fields');
      return;
    }

    // Collect items
    const items = [];
    const itemNames = document.querySelectorAll('.po-item-name');
    const itemQtys = document.querySelectorAll('.po-item-quantity');
    const itemPrices = document.querySelectorAll('.po-item-price');

    for (let i = 0; i < itemNames.length; i++) {
      if (itemNames[i].value && itemQtys[i].value && itemPrices[i].value) {
        items.push({
          itemName: itemNames[i].value,
          quantity: parseFloat(itemQtys[i].value),
          unitPrice: parseFloat(itemPrices[i].value)
        });
      }
    }

    if (items.length === 0) {
      alert('Please add at least one item');
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/purchase-orders`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify({
          vendorId: Math.random().toString(),
          vendorName: vendor,
          expectedDelivery,
          paymentTerms,
          notes,
          items
        })
      });

      if (!response.ok) throw new Error(await response.text());

      document.getElementById('modal-create-po').classList.add('hidden');
      currentPage = 1;
      loadPOs();
    } catch (err) {
      alert('Error creating PO: ' + err.message);
    }
  };

  // Initial load
  loadPOs();
</script>
</body>
</html>
