<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Customer Signature</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
<div id="fm-header"></div>
<div class="flex min-h-screen pt-16">
  <div id="fm-sidebar"></div>
  <main class="flex-1 p-6">

          <div class="max-w-3xl mx-auto space-y-6">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Customer Signature</h1>
            <div id="signature-inline-error" class="hidden"></div>
            <div class="bg-white border border-slate-200/80 rounded-xl p-6 shadow-sm shadow-slate-200/60 space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5" for="signed-by">Signed by</label>
                <input id="signed-by" type="text" placeholder="Customer name" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40" />
                <p id="signed-by-error" class="mt-1 text-xs text-red-600 hidden">Name is required.</p>
              </div>
              <div>
                <p class="text-sm font-medium text-slate-700 mb-2">Signature</p>
                <canvas id="signature-canvas" class="w-full h-48 border border-slate-200 rounded-lg bg-white touch-none"></canvas>
                <p class="mt-2 text-xs text-slate-500">Draw signature above.</p>
              </div>
              <div class="flex flex-wrap items-center gap-3 justify-end">
                <button id="clear-signature" type="button" class="rounded-lg border border-slate-200 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40">
                  Clear
                </button>
                <button id="save-signature" type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50">
                  Save
                </button>
              </div>
            </div>
            <a href="technician-jobs.html" class="inline-flex items-center text-sm text-blue-600 hover:underline">← Back to My Jobs</a>
          </div>
        
  </main>
</div>
<div id="fm-footer"></div>
<script src="assets/contracts.js"></script>
<script src="assets/app.js?v=202607011016"></script>
<script src="assets/layout.js?v=202607011016"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.FINEMARK_APP?.requirePageAccess?.();
  });
</script>
<script>
      const storedUser = localStorage.getItem("finemarkUser");
      let userData = null;
      try {
        userData = storedUser ? JSON.parse(storedUser) : null;
      } catch (error) {
        userData = null;
      }

      if (!userData || !userData.role || userData.role !== "technician") {
        window.location.href = "login.html";
      } else {
        const userInfo = document.getElementById("user-info");
        userInfo.textContent = `User: ${userData.email} (${userData.role})`;
      }

      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("finemarkUser");
        window.location.href = "login.html";
      });

      const jobsKey = "finemark_installations";
      const activityKey = "finemark_activity";
      const jobId = new URLSearchParams(window.location.search).get("id");
      const jobs = JSON.parse(localStorage.getItem(jobsKey) || "[]");
      const job = jobs.find((item) => item.id === jobId);
      const inlineError = document.getElementById("signature-inline-error");

      if (!job) {
        inlineError.classList.remove("hidden");
        window.FINEMARK_APP.showInlineError(
          inlineError,
          'Job not found. Return to <a href="technician-jobs.html" class="text-blue-600 hover:underline">My Jobs</a>.',
          {}
        );
      }

      const canvas = document.getElementById("signature-canvas");
      const ctx = canvas.getContext("2d");
      const signedByInput = document.getElementById("signed-by");
      const signedByError = document.getElementById("signed-by-error");
      const clearButton = document.getElementById("clear-signature");
      const saveButton = document.getElementById("save-signature");

      const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#0f172a";
      };

      resizeCanvas();
      window.addEventListener("resize", () => {
        const imageData = canvas.toDataURL();
        resizeCanvas();
        const image = new Image();
        image.onload = () => {
          ctx.drawImage(image, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
        };
        image.src = imageData;
      });

      let drawing = false;

      const startDraw = (event) => {
        drawing = true;
        ctx.beginPath();
        const { x, y } = getPoint(event);
        ctx.moveTo(x, y);
      };

      const draw = (event) => {
        if (!drawing) return;
        const { x, y } = getPoint(event);
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const endDraw = () => {
        drawing = false;
      };

      const getPoint = (event) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
        };
      };

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", endDraw);
      canvas.addEventListener("mouseleave", endDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: true });
      canvas.addEventListener("touchmove", draw, { passive: true });
      canvas.addEventListener("touchend", endDraw);

      clearButton.addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      saveButton.addEventListener("click", () => {
        const nameValue = signedByInput.value.trim();
        const hasSignature = canvas.toDataURL().length > 1000;
        const invalidName = !nameValue;
        signedByError.classList.toggle("hidden", !invalidName);
        signedByInput.classList.toggle("border-red-500", invalidName);
        signedByInput.classList.toggle("focus-visible:ring-red-500/40", invalidName);
        signedByInput.classList.toggle("focus-visible:ring-blue-500/40", !invalidName);
        if (!job || invalidName || !hasSignature) {
          return;
        }

        job.confirmation = {
          ...(job.confirmation || {}),
          method: "signature",
          verified: true,
          signedBy: nameValue,
          signatureData: canvas.toDataURL("image/png"),
        };
        job.status = "Completed";
        job.updatedAt = new Date().toISOString();
        localStorage.setItem(jobsKey, JSON.stringify(jobs));

        const activity = {
          id: `ACT-${Date.now()}`,
          action: "INSTALLATION_COMPLETED_SIGNATURE",
          recordId: job.requestId,
          recordType: "installation",
          summary: `Completed installation for ${job.customerName} with signature`,
          timestamp: job.updatedAt,
          actor: userData ? userData.email : "demo@finemark.com",
        };
        const activityLog = JSON.parse(localStorage.getItem(activityKey) || "[]");
        activityLog.unshift(activity);
        localStorage.setItem(activityKey, JSON.stringify(activityLog));

        localStorage.setItem("finemark_toast", "Installation completed");
        window.location.href = "technician-jobs.html";
      });
    </script>
</body>
</html>
