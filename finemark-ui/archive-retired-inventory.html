<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finemark | Archive — Retired Inventory</title>
    <link rel="icon" href="assets/finemark-logo.svg" />
    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
    <div id="fm-header"></div>
    <div class="flex min-h-screen pt-16">
      <div id="fm-sidebar"></div>
      <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div>
              <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Retired Inventory</h1>
              <p class="text-sm text-slate-600">Devices that were unallocated and never installed, swept out of the live inventory ledger.</p>
            </div>
            <div id="badge-slot"></div>
          </div>

          <section id="sweep-panel" class="hidden bg-white border border-amber-200 rounded-xl shadow-sm p-4 space-y-3">
            <div class="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h2 class="text-sm font-semibold text-slate-900">Sweep Live Inventory</h2>
                <p id="eligible-text" class="text-xs text-slate-500 mt-0.5">Checking eligible devices…</p>
              </div>
              <button id="btn-sweep" class="rounded-lg bg-amber-600 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled>Archive &amp; Remove From Ledger</button>
            </div>
            <div id="eligible-breakdown" class="flex flex-wrap gap-2"></div>
          </section>

          <section id="summary" class="grid grid-cols-2 md:grid-cols-5 gap-3"></section>

          <section class="bg-white border border-slate-200/80 rounded-xl shadow-sm p-4 space-y-3">
            <div class="flex flex-wrap items-end gap-3">
              <div>
                <label class="text-xs font-semibold text-slate-600">Search</label>
                <input id="filter-search" type="text" placeholder="Serial, IMEI, product…" class="mt-1 w-56 rounded-lg border border-slate-200 px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-600">Status at archive</label>
                <select id="filter-status" class="mt-1 rounded-lg border border-slate-200 px-3 py-2 text-sm">
                  <option value="">All</option>
                  <option value="In Stock">In Stock</option>
                  <option value="Returned">Returned</option>
                  <option value="Defective">Defective</option>
                  <option value="Sent to Supplier">Sent to Supplier</option>
                  <option value="Replaced">Replaced</option>
                </select>
              </div>
              <button id="btn-apply" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Apply</button>
              <button id="btn-reset" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Reset</button>
            </div>
          </section>

          <section class="bg-white border border-slate-200/80 rounded-xl shadow-sm">
            <div class="overflow-x-auto"><table class="w-full text-sm min-w-[760px]">
              <thead class="text-left text-slate-500 text-xs uppercase border-b border-slate-200 bg-slate-50">
                <tr>
                  <th class="py-2 px-3">Serial</th><th class="py-2 px-3">IMEI</th><th class="py-2 px-3">Product</th>
                  <th class="py-2 px-3">Status at Archive</th><th class="py-2 px-3">Warehouse</th>
                  <th class="py-2 px-3">Archived At</th><th class="py-2 px-3">Archived By</th>
                </tr>
              </thead>
              <tbody id="rows" class="divide-y divide-slate-100"><tr><td colspan="7" class="text-center py-10 text-slate-400">Loading…</td></tr></tbody>
            </table></div>
            <div id="pagination" class="flex items-center justify-between gap-3 px-4 py-3 border-t border-slate-100 text-xs text-slate-500"></div>
          </section>
        </div>
      </main>
    </div>
    <div id="fm-footer"></div>
    <script src="assets/contracts.js"></script>
    <script src="assets/app.js"></script>
    <script src="assets/layout.js"></script>
    <script src="assets/archive-common.js"></script>
    <script>
      const state = { page: 1, pageSize: 25, total: 0 };
      const INVENTORY_ARCHIVE_ROLES = ["Admin", "InventoryManager"];

      document.addEventListener("DOMContentLoaded", async () => {
        if ((await ArchiveCommon.gate()) === false) return;
        document.getElementById("badge-slot").innerHTML = ArchiveCommon.readOnlyBadge;

        const role = window.FINEMARK_APP.getSession()?.user?.role;
        if (INVENTORY_ARCHIVE_ROLES.includes(role)) {
          document.getElementById("sweep-panel").classList.remove("hidden");
          loadEligible();
        }

        load();
        document.getElementById("btn-apply").addEventListener("click", () => { state.page = 1; load(); });
        document.getElementById("btn-reset").addEventListener("click", () => {
          document.getElementById("filter-search").value = "";
          document.getElementById("filter-status").value = "";
          state.page = 1; load();
        });
        document.getElementById("btn-sweep").addEventListener("click", doSweep);
      });

      function currentParams() {
        const params = new URLSearchParams();
        const search = document.getElementById("filter-search").value.trim();
        const status = document.getElementById("filter-status").value;
        if (search) params.set("search", search);
        if (status) params.set("status", status);
        params.set("page", state.page);
        params.set("pageSize", state.pageSize);
        return params;
      }

      async function load() {
        const tbody = document.getElementById("rows");
        try {
          const res = await window.FINEMARK_APP.apiFetch(`/archive/retired-inventory?${currentParams().toString()}`);
          const items = res.data || [];
          const meta = res.meta || { total: 0, page: 1, pageSize: state.pageSize };
          const summary = res.summary || [];
          state.total = meta.total;

          document.getElementById("summary").innerHTML = summary.length
            ? summary.map((s) => `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-center"><div class="text-lg font-bold text-slate-800">${s.count}</div><div class="text-xs text-slate-600">${ArchiveCommon.escapeHtml(s.status)}</div></div>`).join("")
            : `<div class="col-span-full text-center text-slate-400 py-4">No retired inventory archived yet.</div>`;

          tbody.innerHTML = items.length
            ? items.map((r) => `
              <tr>
                <td class="py-2 px-3 font-mono">${ArchiveCommon.escapeHtml(r.serialNumber || "—")}</td>
                <td class="py-2 px-3 font-mono">${ArchiveCommon.escapeHtml(r.imei || "—")}</td>
                <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.productName || r.productId || "—")}${r.productCode ? ` <span class="text-slate-400">(${ArchiveCommon.escapeHtml(r.productCode)})</span>` : ""}</td>
                <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.statusAtArchive)}</td>
                <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.warehouseLocation || "—")}</td>
                <td class="py-2 px-3">${ArchiveCommon.fmtDateTime(r.archivedAt)}</td>
                <td class="py-2 px-3">${ArchiveCommon.escapeHtml(r.archivedByName || "—")}</td>
              </tr>`).join("")
            : `<tr><td colspan="7" class="text-center text-slate-400 py-8">No retired inventory found.</td></tr>`;

          const start = (meta.page - 1) * meta.pageSize + 1;
          const end = Math.min(meta.page * meta.pageSize, meta.total);
          document.getElementById("pagination").innerHTML = meta.total ? `
            <span>${meta.total ? `${start}–${end} of ${meta.total}` : ""}</span>
            <div class="flex gap-1">
              <button id="btn-prev" ${meta.page <= 1 ? "disabled" : ""} class="px-3 py-1 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40">&larr;</button>
              <button id="btn-next" ${end >= meta.total ? "disabled" : ""} class="px-3 py-1 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40">&rarr;</button>
            </div>` : "";
          document.getElementById("btn-prev")?.addEventListener("click", () => { state.page -= 1; load(); });
          document.getElementById("btn-next")?.addEventListener("click", () => { state.page += 1; load(); });
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-rose-600 py-8">${ArchiveCommon.escapeHtml(e.message)}</td></tr>`;
        }
      }

      async function loadEligible() {
        const textEl = document.getElementById("eligible-text");
        const breakdownEl = document.getElementById("eligible-breakdown");
        const btn = document.getElementById("btn-sweep");
        try {
          const res = await window.FINEMARK_APP.apiFetch("/archive/retired-inventory/eligible-count");
          const d = res.data || res;
          if (!d.total) {
            textEl.textContent = "No unallocated, uninstalled devices are eligible right now.";
            btn.disabled = true;
            breakdownEl.innerHTML = "";
            return;
          }
          textEl.textContent = `${d.total} device(s) currently eligible — unallocated, not installed, not reserved.`;
          breakdownEl.innerHTML = (d.byStatus || []).map((s) => `<span class="inline-flex items-center rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-medium text-amber-800">${ArchiveCommon.escapeHtml(s.status)}: ${s.count}</span>`).join("");
          btn.disabled = false;
        } catch (e) {
          textEl.textContent = "Failed to load eligible count.";
        }
      }

      async function doSweep() {
        const btn = document.getElementById("btn-sweep");
        const eligibleText = document.getElementById("eligible-text").textContent;
        if (!confirm(`This will archive matching devices into this report and remove them from the live inventory ledger (soft-delete — reversible by support if needed, not visible in any live inventory view afterward).\n\n${eligibleText}\n\nContinue?`)) return;
        btn.disabled = true; btn.textContent = "Archiving…";
        try {
          const res = await window.FINEMARK_APP.apiFetch("/archive/retired-inventory/sweep", { method: "POST" });
          window.FINEMARK_APP.showToast?.(res.message || "Sweep complete.", "success");
          state.page = 1;
          await load();
          await loadEligible();
        } catch (e) {
          window.FINEMARK_APP.showToast?.(e.message || "Sweep failed.", "error");
        } finally {
          btn.textContent = "Archive & Remove From Ledger";
        }
      }
    </script>
  </body>
</html>
